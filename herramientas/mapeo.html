<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisar el Mapeo</title>
<meta name="description" content="Abre el Excel del Mapeo de comunidades, lo muestra como fichas para revisar y corregir, y lo exporta con el mismo formato.">
<!--
  Revisar el Mapeo — Team LatAm

  Una página sola, sin servidor y sin datos adentro: el Excel se elige
  desde la compu o el celular, se revisa acá y se exporta con el MISMO
  formato (colores, listas desplegables, filas de TOTAL, comentarios):
  no se arma un Excel nuevo, se reescriben los valores adentro del
  archivo original. Lo que se va corrigiendo queda guardado en este
  navegador hasta que se exporta. Ver herramientas/LEEME.md.
-->
<style>
  :root{
    --petroleo:#0d3b3e; --celeste:#4fc7e0; --celeste-dark:#1a9fb8;
    --bg:#f4f8f8; --card:#ffffff; --text:#0d2a2c; --text-muted:#4f6c6e; --border:#e1edee;
    --surface-alt:#eef4f4; --surface-hover:#e2eded; --chip-bg:#eef6f6;
    --warn-bg:#fff7e6; --warn-border:#f3d78b; --warn-text:#6b4c00;
    --ok-bg:#dcfce7; --ok-border:#86efac; --ok-text:#166534;
    --danger:#dc2626; --danger-bg:#fee2e2; --danger-text:#991b1b;
    --cambio:#2563eb; --cambio-bg:#e8f0fe;
    /* Los colores de las tres regiones y de las dos mitades, como en el Excel. */
    --r0:#a4c2f4; --r1:#b6d7a8; --r2:#ffe599; --r0-soft:#e3edfc; --r1-soft:#e8f3e3; --r2-soft:#fff6d6;
    --comunidad:#c9daf8; --organizacion:#fff2cc; --verde-celda:#b7e1cd;
    --shadow:0 6px 24px rgba(13,59,62,.08); --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --petroleo:#14494e; --celeste-dark:#6fd8ec; --bg:#0a1719; --card:#102b2e; --text:#e6f2f2; --text-muted:#8faeb0; --border:#1d4045;
      --surface-alt:#17383c; --surface-hover:#20474c; --chip-bg:#17383c;
      --warn-bg:#3a2f14; --warn-border:#6b5520; --warn-text:#f0d9a0; --ok-bg:#153a24; --ok-border:#2f7a4a; --ok-text:#b9f0cc;
      --danger-bg:#3d1d1d; --danger-text:#f7b4b4; --cambio:#8ab4f8; --cambio-bg:#1b2a44;
      --r0-soft:#1b2a44; --r1-soft:#1c3320; --r2-soft:#3a3214; --comunidad:#1b2a44; --organizacion:#3a3214; --verde-celda:#1f4a35;
    }
  }
  :root[data-theme="dark"]{
    --petroleo:#14494e; --celeste-dark:#6fd8ec; --bg:#0a1719; --card:#102b2e; --text:#e6f2f2; --text-muted:#8faeb0; --border:#1d4045;
    --surface-alt:#17383c; --surface-hover:#20474c; --chip-bg:#17383c;
    --warn-bg:#3a2f14; --warn-border:#6b5520; --warn-text:#f0d9a0; --ok-bg:#153a24; --ok-border:#2f7a4a; --ok-text:#b9f0cc;
    --danger-bg:#3d1d1d; --danger-text:#f7b4b4; --cambio:#8ab4f8; --cambio-bg:#1b2a44;
    --r0-soft:#1b2a44; --r1-soft:#1c3320; --r2-soft:#3a3214; --comunidad:#1b2a44; --organizacion:#3a3214; --verde-celda:#1f4a35;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px; line-height:1.4; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  h1{ font-size:20px; margin:0; }
  h2{ font-size:17px; margin:0; }
  .oculto{ display:none !important; }
  .gris{ color:var(--text-muted); }
  .chico{ font-size:13px; }

  /* ---------- La cabecera fija ---------- */
  .cab{ position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--border); box-shadow:0 2px 12px rgba(13,59,62,.06); }
  .cab-fila{ display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap; }
  .cab-fila h1{ flex:1 1 auto; min-width:0; }
  .cab-fila h1 small{ display:block; font-weight:500; color:var(--text-muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:var(--radius-sm); padding:8px 14px; font-weight:600; font-size:14px; min-height:40px; }
  .btn:hover{ background:var(--surface-hover); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn-primario{ background:var(--petroleo); color:#fff; border-color:var(--petroleo); }
  .btn-primario:hover{ background:#0b3234; }
  .btn-chico{ padding:4px 10px; min-height:30px; font-size:13px; }
  .btn-peligro{ color:var(--danger-text); border-color:transparent; background:transparent; }
  .btn-peligro:hover{ background:var(--danger-bg); }
  .btn-link{ background:none; border:0; color:var(--celeste-dark); font-weight:600; padding:4px 6px; text-decoration:underline; text-underline-offset:2px; }
  .barra{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:0 16px 10px; }
  .barra input[type=search], .barra select{ border:1px solid var(--border); background:var(--bg); border-radius:var(--radius-sm); padding:8px 10px; min-height:40px; }
  .barra input[type=search]{ flex:1 1 180px; min-width:120px; }
  .contadores{ display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px; font-size:13px; }
  .pastilla{ display:inline-flex; align-items:center; gap:4px; background:var(--chip-bg); border:1px solid var(--border); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .pastilla.ok{ background:var(--ok-bg); border-color:var(--ok-border); color:var(--ok-text); }
  .pastilla.aviso{ background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-text); }
  .pastilla.cambio{ background:var(--cambio-bg); border-color:transparent; color:var(--cambio); }
  .pastilla button{ background:none; border:0; padding:0; font-weight:700; color:inherit; text-decoration:underline; }

  /* ---------- El principio: abrir el archivo ---------- */
  main{ max-width:1180px; margin:0 auto; padding:16px; }
  .portada{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px 20px; box-shadow:var(--shadow); max-width:640px; margin:24px auto; }
  .portada h2{ font-size:20px; margin-bottom:8px; }
  .portada ol{ padding-inline-start:20px; margin:12px 0; }
  .portada li{ margin:6px 0; }
  .zona-archivo{ border:2px dashed var(--border); border-radius:var(--radius-md); padding:20px; text-align:center; margin-top:14px; }
  .zona-archivo.sobre{ border-color:var(--celeste-dark); background:var(--chip-bg); }
  .aviso-caja{ background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-text); border-radius:var(--radius-md); padding:10px 12px; margin-top:12px; font-size:14px; }
  .error-caja{ background:var(--danger-bg); color:var(--danger-text); border-radius:var(--radius-md); padding:10px 12px; margin-top:12px; font-size:14px; }

  /* ---------- Las regiones y las fichas ---------- */
  .region{ margin:22px 0; }
  .region-cab{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-radius:var(--radius-md); margin-bottom:10px; background:var(--surface-alt); border-inline-start:8px solid var(--border); }
  .region-cab[data-color="0"]{ border-color:var(--r0); background:var(--r0-soft); }
  .region-cab[data-color="1"]{ border-color:var(--r1); background:var(--r1-soft); }
  .region-cab[data-color="2"]{ border-color:var(--r2); background:var(--r2-soft); }
  .region-cab input{ font-weight:800; font-size:17px; border:1px solid transparent; background:transparent; border-radius:var(--radius-sm); padding:4px 8px; min-width:120px; max-width:260px; }
  .region-cab input:hover, .region-cab input:focus{ border-color:var(--border); background:var(--card); }
  .region-cab .resumen{ flex:1 1 auto; font-size:13px; color:var(--text-muted); }
  .region-pie{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 0 0; }
  .fichas{ display:grid; gap:12px; grid-template-columns:1fr; }
  .ficha{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; box-shadow:var(--shadow); position:relative; }
  .ficha.revisada{ border-color:var(--ok-border); }
  .ficha.revisada::before{ content:"✓ Revisada"; position:absolute; top:-9px; inset-inline-end:14px; background:var(--ok-bg); color:var(--ok-text); border:1px solid var(--ok-border); border-radius:999px; font-size:11px; font-weight:700; padding:1px 8px; }
  .ficha.nueva::after{ content:"Nueva"; position:absolute; top:-9px; inset-inline-start:14px; background:var(--cambio-bg); color:var(--cambio); border-radius:999px; font-size:11px; font-weight:700; padding:1px 8px; }
  .ficha-cab{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:10px; }
  .ficha-cab .campo.ancho{ grid-column:1 / -1; }
  .campo{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .campo > span{ font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); }
  .campo input, .campo select, .barra input, .barra select{ font-size:16px; }
  .campo input, .campo select{ border:1px solid var(--border); background:var(--bg); border-radius:var(--radius-sm); padding:7px 9px; min-height:38px; width:100%; }
  .campo input:focus, .campo select:focus{ outline:2px solid var(--celeste-dark); outline-offset:0; border-color:transparent; }
  .campo input.con-valor{ background:var(--verde-celda); }
  .campo input.cambiado, .campo select.cambiado{ box-shadow:inset 3px 0 0 var(--cambio); }
  .campo input.vacio-raro{ border-color:var(--warn-border); }
  .seccion{ border-radius:var(--radius-md); padding:8px 10px 4px; margin-top:8px; }
  .seccion[data-mitad="0"]{ background:var(--comunidad); }
  .seccion[data-mitad="1"]{ background:var(--organizacion); }
  .seccion h3{ margin:0 0 6px; font-size:14px; font-weight:800; color:var(--petroleo); }
  .grupos{ display:grid; grid-template-columns:1fr; gap:8px; }
  .grupo{ display:grid; grid-template-columns:minmax(110px, 36%) 1fr; gap:6px; align-items:start; background:var(--card); border-radius:var(--radius-sm); padding:6px 8px 8px; }
  .grupo.solo{ grid-template-columns:minmax(110px, 36%); }
  .grupo .titulo{ grid-column:1 / -1; font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--petroleo); }
  .grupo .campo > span{ display:none; }
  .grupo .campo .avisos{ grid-column:1 / -1; }
  .avisos{ display:flex; flex-direction:column; gap:4px; margin-top:4px; }
  .aviso{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--warn-text); background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:var(--radius-sm); padding:3px 8px; }
  .aviso b{ font-weight:600; }
  .aviso .btn-link{ font-size:12px; padding:0 2px; color:inherit; }
  .ficha-pie{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .ficha-pie .espacio{ flex:1 1 auto; }
  .revisar{ display:inline-flex; align-items:center; gap:8px; font-weight:700; cursor:pointer; padding:6px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); min-height:40px; }
  .revisar input{ width:20px; height:20px; margin:0; accent-color:#16a34a; }
  .ficha.revisada .revisar{ background:var(--ok-bg); border-color:var(--ok-border); color:var(--ok-text); }
  .menu-ficha{ position:relative; }
  .menu-ficha .menu{ position:absolute; inset-inline-end:0; bottom:44px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow); display:flex; flex-direction:column; min-width:200px; z-index:4; padding:4px; }
  .menu-ficha .menu button{ text-align:start; background:none; border:0; padding:9px 12px; border-radius:var(--radius-sm); }
  .menu-ficha .menu button:hover{ background:var(--surface-hover); }
  .menu-ficha .menu button.peligro{ color:var(--danger-text); }
  .nada{ text-align:center; color:var(--text-muted); padding:30px 10px; }
  .pie-pagina{ text-align:center; color:var(--text-muted); font-size:12px; padding:30px 0 20px; }
  .toast{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--petroleo); color:#fff; padding:10px 16px; border-radius:999px; box-shadow:var(--shadow); font-size:14px; z-index:9; max-width:calc(100vw - 32px); text-align:center; }
  .toast.error{ background:var(--danger); }

  @media (min-width:700px){
    .ficha-cab{ grid-template-columns:1.4fr 1fr .9fr .9fr 1fr; }
    .ficha-cab .campo.ancho{ grid-column:auto; }
    .grupos{ grid-template-columns:1fr 1fr; }
    .fichas.compactas{ grid-template-columns:1fr 1fr; }
  }
  @media (min-width:1400px){
    .grupos{ grid-template-columns:1fr 1fr 1fr; }
  }
  /* En el celular la cabecera no queda fija (ocupa media pantalla): abajo va
     una barra con «Exportar», siempre a mano. */
  .pie-movil{ display:none; }
  @media (max-width:699px){
    .cab{ position:static; box-shadow:none; }
    .cab-fila{ flex-wrap:nowrap; }
    .cab-fila h1{ font-size:18px; }
    .cab-fila .btn{ padding:8px 10px; font-size:13px; white-space:nowrap; }
    .cab-fila #btnExportar{ display:none; }   /* en el celular, «Exportar» va en la barra de abajo */
    .barra{ display:grid; grid-template-columns:1fr 1fr; }
    .barra select{ min-width:0; width:100%; }
    .barra input[type=search]{ grid-column:1 / -1; }
    .contadores{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    main{ padding-bottom:84px; }
    .pie-movil{ display:flex; position:fixed; bottom:0; left:0; right:0; z-index:5; gap:10px; align-items:center; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--border); box-shadow:0 -4px 16px rgba(13,59,62,.08); }
    .pie-movil .btn{ flex:1 1 auto; }
    .toast{ bottom:84px; }
  }
  @media print{ .cab, .ficha-pie, .region-pie{ display:none; } .ficha{ break-inside:avoid; box-shadow:none; } }
</style>
</head>
<body>
<header class="cab">
  <div class="cab-fila">
    <h1>Revisar el Mapeo <small id="nombreArchivo">Ningún archivo abierto todavía</small></h1>
    <div class="acciones">
      <button type="button" class="btn" data-action="abrir">Abrir Excel…</button>
      <button type="button" class="btn btn-primario" data-action="exportar" id="btnExportar" disabled>Exportar a Excel</button>
    </div>
  </div>
  <div class="barra" id="barra" hidden>
    <input type="search" id="buscar" placeholder="Buscar ciudad, país o persona…" autocomplete="off">
    <select id="fPais" aria-label="País"><option value="">Todos los países</option></select>
    <select id="fQue" aria-label="Qué mostrar">
      <option value="">Todas las comunidades</option>
      <option value="sin-revisar">Solo sin revisar</option>
      <option value="con-avisos">Solo con avisos</option>
      <option value="cambiadas">Solo con cambios</option>
    </select>
  </div>
  <div class="contadores" id="contadores" hidden></div>
</header>
<main id="principal"></main>
<div class="pie-movil" id="pieMovil" hidden><span class="chico gris" id="pieMovilTexto"></span><button type="button" class="btn btn-primario" data-action="exportar">Exportar a Excel</button></div>
<input type="file" id="archivo" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="oculto">
<script>
/* ====================== NUCLEO XLSX (empieza) ======================
   Todo lo de acá abajo no toca la página: lee y escribe el .xlsx tal
   cual (un zip con XML adentro) sin ninguna biblioteca. Las pruebas
   (pruebas/mapeo_test.mjs) sacan este bloque entero, entre las dos
   marcas, y lo corren en Node.

   La idea central: NO se arma un Excel nuevo. Se abre el original, se
   cambian solo los valores de las celdas (y, si hace falta, se agregan o
   sacan filas al final de cada región), se recalculan las cadenas
   compartidas y los totales, y se vuelve a cerrar el zip con todas las
   demás partes (estilos, colores, listas, comentarios, tema) intactas.
   ================================================================== */

// ---------- El zip: leer y escribir, con lo que trae el navegador ----------
const CRC32 = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return bytes => { let c = 0xFFFFFFFF; for(let i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
})();
async function porStream(bytes, stream){
  const r = new Blob([bytes]).stream().pipeThrough(stream);
  return new Uint8Array(await new Response(r).arrayBuffer());
}
async function leerZip(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let fin = -1;
  for(let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--){ if(dv.getUint32(i, true) === 0x06054b50){ fin = i; break; } }
  if(fin < 0) throw new Error("No parece un archivo .xlsx (no tiene el cierre de un zip).");
  const cuantas = dv.getUint16(fin + 10, true), inicioCentral = dv.getUint32(fin + 16, true);
  const partes = [];
  let p = inicioCentral;
  const dec = new TextDecoder();
  for(let n = 0; n < cuantas; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error("El zip está dañado (directorio central).");
    const metodo = dv.getUint16(p + 10, true), comprimido = dv.getUint32(p + 20, true);
    const largoNombre = dv.getUint16(p + 28, true), largoExtra = dv.getUint16(p + 30, true), largoComent = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const nombre = dec.decode(bytes.subarray(p + 46, p + 46 + largoNombre));
    if(dv.getUint32(local, true) !== 0x04034b50) throw new Error("El zip está dañado (cabecera local).");
    const desde = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const crudo = bytes.subarray(desde, desde + comprimido);
    let datos;
    if(metodo === 0) datos = crudo.slice();
    else if(metodo === 8) datos = await porStream(crudo, new DecompressionStream("deflate-raw"));
    else throw new Error("El zip usa una compresión que no sé abrir (" + metodo + ").");
    partes.push({ nombre, datos });
    p += 46 + largoNombre + largoExtra + largoComent;
  }
  return partes;
}
async function escribirZip(partes){
  const enc = new TextEncoder(), trozos = [], central = [];
  let offset = 0;
  const comprimir = typeof CompressionStream === "function";
  // Fecha fija en formato DOS (1/1/2026 00:00): el contenido es lo que importa.
  const hora = 0, fecha = ((2026 - 1980) << 9) | (1 << 5) | 1;
  for(const { nombre, datos } of partes){
    const nom = enc.encode(nombre), crc = CRC32(datos);
    const comp = comprimir ? await porStream(datos, new CompressionStream("deflate-raw")) : datos;
    const metodo = comprimir ? 8 : 0;
    const cab = new Uint8Array(30 + nom.length), v = new DataView(cab.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true); v.setUint16(8, metodo, true);
    v.setUint16(10, hora, true); v.setUint16(12, fecha, true); v.setUint32(14, crc, true); v.setUint32(18, comp.length, true); v.setUint32(22, datos.length, true);
    v.setUint16(26, nom.length, true); v.setUint16(28, 0, true); cab.set(nom, 30);
    const c = new Uint8Array(46 + nom.length), w = new DataView(c.buffer);
    w.setUint32(0, 0x02014b50, true); w.setUint16(4, 20, true); w.setUint16(6, 20, true); w.setUint16(8, 0x0800, true); w.setUint16(10, metodo, true);
    w.setUint16(12, hora, true); w.setUint16(14, fecha, true); w.setUint32(16, crc, true); w.setUint32(20, comp.length, true); w.setUint32(24, datos.length, true);
    w.setUint16(28, nom.length, true); w.setUint16(30, 0, true); w.setUint16(32, 0, true); w.setUint16(34, 0, true); w.setUint16(36, 0, true); w.setUint32(38, 0, true); w.setUint32(42, offset, true); c.set(nom, 46);
    trozos.push(cab, comp); central.push(c);
    offset += cab.length + comp.length;
  }
  const largoCentral = central.reduce((s, c) => s + c.length, 0);
  const fin = new Uint8Array(22), f = new DataView(fin.buffer);
  f.setUint32(0, 0x06054b50, true); f.setUint16(8, partes.length, true); f.setUint16(10, partes.length, true); f.setUint32(12, largoCentral, true); f.setUint32(16, offset, true);
  const total = offset + largoCentral + 22, salida = new Uint8Array(total);
  let i = 0;
  for(const t of [...trozos, ...central, fin]){ salida.set(t, i); i += t.length; }
  return salida;
}

// ---------- XML a mano: lo justo para estas hojas ----------
const desXml = s => s.replace(/&(amp|lt|gt|quot|apos|#x[0-9a-fA-F]+|#\d+);/g, (m, e) => {
  if(e === "amp") return "&"; if(e === "lt") return "<"; if(e === "gt") return ">"; if(e === "quot") return '"'; if(e === "apos") return "'";
  return String.fromCodePoint(e[1] === "x" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
});
// Lo que XML 1.0 no admite adentro de un texto (controles) se saca; el resto
// —acentos, marcas de dirección, espacios duros— va tal cual, escapado.
const aXml = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const aXmlAttr = s => aXml(s).replace(/"/g, "&quot;");
const atributo = (attrs, nombre) => { const m = new RegExp("(?:^|\\s)" + nombre + '="([^"]*)"').exec(attrs || ""); return m ? desXml(m[1]) : null; };

const letraACol = letras => { let n = 0; for(const ch of letras) n = n * 26 + (ch.charCodeAt(0) - 64); return n; };
const colALetra = n => { let s = ""; while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
const partirRef = ref => { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(ref); return m ? { col: m[1], fila: Number(m[2]) } : null; };

// Las cadenas compartidas: <si><t>…</t></si> (y, si hubiera, <si><r><t>…</t></r>…).
function leerCadenas(xml){
  if(!xml) return [];
  return [...xml.matchAll(/<si>([\s\S]*?)<\/si>|<si\/>/g)].map(m => (m[1] || "").replace(/<rPh[\s\S]*?<\/rPh>/g, "")
    .split(/<t(?:\s[^>]*)?>/).slice(1).map(t => desXml(t.slice(0, t.indexOf("</t>")))).join(""));
}
function escribirCadenas(lista, cuenta){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="' + cuenta + '" uniqueCount="' + lista.length + '">'
    + lista.map(s => '<si><t xml:space="preserve">' + aXml(s) + "</t></si>").join("") + "</sst>";
}

// La hoja, partida en tres: lo de antes de <sheetData>, las filas (cada una
// con sus celdas, como texto) y lo de después (combinadas, formato
// condicional, listas, filtro).
function partirHoja(xml){
  const i = xml.indexOf("<sheetData"), j = xml.indexOf("</sheetData>");
  if(i < 0) throw new Error("La hoja no tiene datos (<sheetData>).");
  let antes, cuerpo, despues;
  if(j < 0){ const k = xml.indexOf("/>", i); antes = xml.slice(0, i) + "<sheetData>"; cuerpo = ""; despues = "</sheetData>" + xml.slice(k + 2); }
  else { const k = xml.indexOf(">", i); antes = xml.slice(0, k + 1); cuerpo = xml.slice(k + 1, j); despues = xml.slice(j); }
  const filas = [...cuerpo.matchAll(/<row\b([^>]*?)(\/>|>([\s\S]*?)<\/row>)/g)].map(m => ({
    r: Number(atributo(m[1], "r")), attrs: m[1].replace(/\s*\br="\d+"/, ""),
    celdas: [...(m[3] || "").matchAll(/<c\b([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g)].map(c => ({ ref: atributo(c[1], "r"), attrs: c[1], inner: c[3] || "" }))
  }));
  return { antes, filas, despues };
}
const serializarFila = f => "<row" + f.attrs.replace(/^\s*/, " ").replace(/\s+$/, "").replace(/^ $/, "") + ' r="' + f.r + '">' + f.celdas.map(c => "<c" + c.attrs.replace(/\s+$/, "") + (c.inner ? ">" + c.inner + "</c>" : "/>")).join("") + "</row>";

// El valor que muestra una celda, ya resuelto contra las cadenas compartidas.
function valorDeCelda(c, cadenas){
  const t = atributo(c.attrs, "t");
  const v = (/<v>([\s\S]*?)<\/v>/.exec(c.inner) || [])[1];
  if(t === "s") return v == null ? "" : (cadenas[Number(v)] ?? "");
  if(t === "inlineStr") return (c.inner.split(/<t(?:\s[^>]*)?>/).slice(1).map(x => desXml(x.slice(0, x.indexOf("</t>")))).join(""));
  if(t === "str" || t === "e") return v == null ? "" : desXml(v);
  if(t === "b") return v === "1" ? "VERDADERO" : "FALSO";
  if(v == null || v === "") return "";
  const n = Number(v); return Number.isFinite(n) ? n : desXml(v);
}
const esFormula = c => /<f[\s>\/]/.test(c.inner);

// Mover referencias de fila: todo lo que esté en `desde` o más abajo se corre
// `delta` filas. Un rango que termina en `expandirFin` (la última fila de una
// región a la que se le agregan filas) se estira, igual que haría Excel al
// insertar adentro; con delta negativo, los rangos que terminan en las filas
// sacadas se acortan, y los que estaban enteros ahí desaparecen (null).
function moverRango(ref, desde, delta, expandirFin){
  const partes = ref.split(":").map(partirRef);
  if(partes.some(p => !p)) return ref;
  const [a, b] = partes.length === 2 ? partes : [partes[0], partes[0]];
  const mover = fila => fila >= desde ? fila + delta : fila;
  let fa = mover(a.fila), fb;
  if(delta > 0) fb = (b.fila >= desde || b.fila === expandirFin) ? b.fila + delta : b.fila;
  else {
    const ultimaSacada = desde - delta - 1;
    if(b.fila > ultimaSacada) fb = b.fila + delta;
    else if(b.fila >= desde) fb = desde - 1;        // termina adentro de lo sacado
    else fb = b.fila;
    if(a.fila >= desde && a.fila <= ultimaSacada){ if(fb < desde) return null; fa = desde; }   // empezaba adentro
  }
  if(partes.length === 1) return fa === a.fila ? ref : ref.replace(/\d+$/, String(fa));
  const abs = s => s.includes("$") ? s.replace(/\d+$/, "") : s.replace(/\d+$/, "");
  return abs(ref.split(":")[0]) + fa + ":" + abs(ref.split(":")[1]) + fb;
}
function moverTexto(texto, desde, delta, expandirFin){
  return texto.replace(/\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?/g, m => moverRango(m, desde, delta, expandirFin) ?? m);
}
// Los sqref de formato condicional y listas son varios rangos separados por
// espacio: los que desaparecen se sacan; si no queda ninguno, se saca el bloque.
function moverSqrefs(xml, desde, delta, expandirFin){
  xml = xml.replace(/ sqref="([^"]*)"/g, (m, lista) => {
    const quedan = lista.split(/\s+/).filter(Boolean).map(r => moverRango(r, desde, delta, expandirFin)).filter(Boolean);
    return ' sqref="' + quedan.join(" ") + '"';
  });
  return xml.replace(/<(conditionalFormatting|dataValidation)\b[^>]*\ssqref=""[^>]*>[\s\S]*?<\/\1>/g, "");
}
function moverTodo(xml, desde, delta, expandirFin){
  // Primero los sqref (con su regla de sacar los que se vacían); después el
  // resto de referencias (ref="…", fórmulas, activeCell, topLeftCell).
  return moverSqrefs(xml, desde, delta, expandirFin).replace(/(\sref="|<formula>|<f[^>]*>|<definedName\b[^>]*>|activeCell="|topLeftCell=")([^"<]*)/g, (m, pre, cuerpo) => pre + moverTexto(cuerpo, desde, delta, expandirFin));
}

// ---------- Los totales: SUM y COUNTIF, para que el archivo salga con los números al día ----------
function evaluarFormula(texto, valor){
  const rango = r => { const p = r.split(":").map(partirRef); if(p.some(x => !x)) return [];
    const [a, b] = p.length === 2 ? p : [p[0], p[0]], out = [];
    for(let c = letraACol(a.col); c <= letraACol(b.col); c++) for(let f = a.fila; f <= b.fila; f++) out.push(valor(colALetra(c) + f));
    return out; };
  let m = /^SUM\(([^)]*)\)$/i.exec(texto.trim());
  if(m) return m[1].split(",").flatMap(x => rango(x.trim().replace(/\$/g, ""))).reduce((s, v) => s + (typeof v === "number" ? v : 0), 0);
  m = /^COUNTIF\(([^,]+),\s*"([^"]*)"\s*\)$/i.exec(texto.trim());
  if(m){ const q = m[2].toLowerCase(); return rango(m[1].trim().replace(/\$/g, "")).filter(v => String(v ?? "").toLowerCase() === q).length; }
  return null;
}
// Una fórmula compartida vale para varias celdas: la copia de D28 en E28 es la
// misma con la columna corrida.
function correrColumnas(texto, cuantas){
  return texto.replace(/(\$?)([A-Z]{1,3})(\$?\d+)/g, (m, d, col, resto) => d ? m : colALetra(letraACol(col) + cuantas) + resto);
}

// ---------- Leer el libro ----------
function rutaDeLaHoja(partes){
  const texto = n => { const p = partes.find(x => x.nombre === n); return p ? new TextDecoder().decode(p.datos) : ""; };
  const libro = texto("xl/workbook.xml");
  const id = (/<sheet\b[^>]*\sr:id="([^"]+)"/.exec(libro) || [])[1];
  const rel = id && new RegExp('<Relationship\\b[^>]*\\sId="' + id + '"[^>]*>').exec(texto("xl/_rels/workbook.xml.rels"));
  const destino = rel && (/Target="([^"]+)"/.exec(rel[0]) || [])[1];
  if(destino) return destino.startsWith("/") ? destino.slice(1) : "xl/" + destino.replace(/^\.\//, "");
  return partes.some(p => p.nombre === "xl/worksheets/sheet1.xml") ? "xl/worksheets/sheet1.xml" : null;
}
async function leerLibro(bytes){
  const partes = await leerZip(bytes);
  const texto = n => { const p = partes.find(x => x.nombre === n); return p ? new TextDecoder().decode(p.datos) : ""; };
  const ruta = rutaDeLaHoja(partes);
  if(!ruta) throw new Error("No encontré ninguna hoja adentro del archivo.");
  const cadenas = leerCadenas(texto("xl/sharedStrings.xml"));
  const hoja = partirHoja(texto(ruta));
  const celdas = new Map();
  for(const f of hoja.filas) for(const c of f.celdas) if(c.ref){
    const m = esFormula(c) ? /<f\b([^>]*)>([\s\S]*?)<\/f>|<f\b([^>]*)\/>/.exec(c.inner) : null;
    celdas.set(c.ref, { fila: f.r, formula: !!m, textoFormula: m ? desXml(m[2] ?? "") : null, si: m ? atributo(m[1] ?? m[3] ?? "", "si") : null, valor: valorDeCelda(c, cadenas) });
  }
  const combinadas = [...hoja.despues.matchAll(/<mergeCell\b[^>]*\sref="([^"]+)"/g)].map(m => m[1]);
  const listas = [...hoja.despues.matchAll(/<dataValidation\b([^>]*)>([\s\S]*?)<\/dataValidation>/g)]
    .filter(m => atributo(m[1], "type") === "list").map(m => ({
      rangos: (atributo(m[1], "sqref") || "").split(/\s+/).filter(Boolean),
      opciones: desXml((/<formula1>([\s\S]*?)<\/formula1>/.exec(m[2]) || [])[1] || "").replace(/^"|"$/g, "").split(",").map(s => s.trim()).filter(Boolean) }));
  // Los comentarios de las celdas (ref → texto): viajan con su fila.
  const comentarios = [...texto("xl/comments1.xml").matchAll(/<comment\b[^>]*\sref="([^"]+)"[^>]*>([\s\S]*?)<\/comment>/g)]
    .map(m => ({ ref: m[1], texto: m[2].split(/<t(?:\s[^>]*)?>/).slice(1).map(x => desXml(x.slice(0, x.indexOf("</t>")))).join("") }));
  return { partes, ruta, cadenas, hoja, celdas, combinadas, listas, comentarios };
}

// ---------- Escribir el libro: los mismos bytes, con los valores nuevos ----------
// `regiones`: [{ inicio, fin, etiqueta, filas:[{ origen, valores:{B:…} }] }] con
// las filas de cada región en el orden final (origen = número de fila en el
// archivo original, o null si es nueva). `columnasNumericas`: letras que
// guardan números. Devuelve los bytes del .xlsx nuevo.
async function escribirLibro(libro, regiones, columnasNumericas){
  const { partes, ruta, cadenas } = libro;
  if(!partes.some(p => p.nombre === "xl/sharedStrings.xml")) throw new Error("El archivo no tiene cadenas compartidas; no lo sé escribir.");
  const hoja = partirHoja(new TextDecoder().decode(partes.find(p => p.nombre === ruta).datos));
  const filasPorNumero = () => new Map(hoja.filas.map(f => [f.r, f]));
  let despues = hoja.despues, antes = hoja.antes;
  const otros = { "xl/workbook.xml": null };
  const comentariosXml = (() => { const p = partes.find(x => x.nombre === "xl/comments1.xml"); return p ? new TextDecoder().decode(p.datos) : null; })();
  // Dónde empezaba y terminaba cada región antes de tocar nada (las filas de
  // afuera —encabezados, TOTAL— se corren según cuántas filas cambió cada región de arriba).
  const originales = regiones.map(r => ({ inicio: r.inicio, fin: r.fin, delta: r.filas.length - (r.fin - r.inicio + 1) }));
  for(const n of Object.keys(otros)){ const p = partes.find(x => x.nombre === n); otros[n] = p ? new TextDecoder().decode(p.datos) : null; }
  const vml = partes.find(p => /^xl\/drawings\/vmlDrawing\d+\.vml$/.test(p.nombre));
  let vmlTexto = vml ? new TextDecoder().decode(vml.datos) : null;

  // Dónde cae cada fila original en el archivo nuevo (para los comentarios).
  const destino = new Map();
  // 1. Agregar o sacar filas al final de cada región, de abajo para arriba.
  const ordenadas = [...regiones].sort((a, b) => b.fin - a.fin);
  for(const reg of ordenadas){
    const cuantasHay = reg.fin - reg.inicio + 1, delta = reg.filas.length - cuantasHay;
    if(delta === 0) continue;
    const mapa = filasPorNumero();
    if(delta > 0){
      const molde = mapa.get(reg.fin) || hoja.filas.find(f => f.r >= reg.inicio && f.r <= reg.fin);
      const nuevas = [];
      for(let k = 1; k <= delta; k++) nuevas.push({ r: reg.fin + k, attrs: molde ? molde.attrs : "", celdas: (molde ? molde.celdas : []).map(c => {
        const p = partirRef(c.ref); return { ref: p.col + (reg.fin + k), attrs: c.attrs.replace(/\s*\bt="[^"]*"/, "").replace(/\s*\br="[^"]*"/, " r=\"" + p.col + (reg.fin + k) + "\""), inner: "" }; }) });
      hoja.filas = hoja.filas.flatMap(f => {
        if(f.r <= reg.fin) return [f];
        return [{ ...f, r: f.r + delta, celdas: f.celdas.map(c => ({ ...c, ref: c.ref.replace(/\d+$/, String(f.r + delta)), attrs: c.attrs.replace(/\br="[^"]*"/, 'r="' + c.ref.replace(/\d+$/, String(f.r + delta)) + '"'), inner: moverTexto(c.inner, reg.fin + 1, delta, reg.fin) })) }];
      });
      const i = hoja.filas.findIndex(f => f.r > reg.fin);
      hoja.filas.splice(i < 0 ? hoja.filas.length : i, 0, ...nuevas);
      // Las fórmulas de las filas que no se movieron pero miran la región (los totales de abajo ya se corrieron; los rangos que terminan en fin se estiran).
      for(const f of hoja.filas) if(f.r <= reg.fin) for(const c of f.celdas) if(esFormula(c)) c.inner = moverTexto(c.inner, reg.fin + 1, delta, reg.fin);
      despues = moverTodo(despues, reg.fin + 1, delta, reg.fin); antes = moverTodo(antes, reg.fin + 1, delta, reg.fin);
      for(const n of Object.keys(otros)) if(otros[n]) otros[n] = moverTodo(otros[n], reg.fin + 1, delta, reg.fin);
    } else {
      const sacar = -delta, desde = reg.fin - sacar + 1;
      hoja.filas = hoja.filas.filter(f => f.r < desde || f.r > reg.fin).map(f => f.r <= reg.fin ? f : ({ ...f, r: f.r + delta, celdas: f.celdas.map(c => ({ ...c, ref: c.ref.replace(/\d+$/, String(f.r + delta)), attrs: c.attrs.replace(/\br="[^"]*"/, 'r="' + c.ref.replace(/\d+$/, String(f.r + delta)) + '"') })) }));
      for(const f of hoja.filas) for(const c of f.celdas) if(esFormula(c)) c.inner = moverTexto(c.inner, desde, delta);
      despues = moverTodo(despues, desde, delta); antes = moverTodo(antes, desde, delta);
      for(const n of Object.keys(otros)) if(otros[n]) otros[n] = moverTodo(otros[n], desde, delta);
    }
    // Las regiones de arriba no se mueven; las de abajo ya quedaron corridas en el archivo, y acá llevamos la cuenta.
    for(const otra of regiones) if(otra !== reg && otra.inicio > reg.fin){ otra.inicio += delta; otra.fin += delta; }
    reg.fin += delta;
  }
  // 2. Los valores, fila por fila.
  const mapa = filasPorNumero();
  const nuevasCadenas = [], indice = new Map();
  let cuantasRefs = 0;
  const idxDe = s => { if(!indice.has(s)){ indice.set(s, nuevasCadenas.length); nuevasCadenas.push(s); } cuantasRefs++; return indice.get(s); };
  const poner = (fila, col, valor) => {
    const f = mapa.get(fila); if(!f) return;
    const ref = col + fila;
    let c = f.celdas.find(x => x.ref === ref);
    if(!c){
      c = { ref, attrs: ' r="' + ref + '"', inner: "" };
      const i = f.celdas.findIndex(x => letraACol(partirRef(x.ref).col) > letraACol(col));
      f.celdas.splice(i < 0 ? f.celdas.length : i, 0, c);
    }
    if(esFormula(c)) return;
    const base = c.attrs.replace(/\s*\bt="[^"]*"/, "");
    if(valor === "" || valor == null){ c.attrs = base; c.inner = ""; c.texto = null; return; }
    if(columnasNumericas.has(col) && typeof valor === "number" && Number.isFinite(valor)){ c.attrs = base; c.inner = "<v>" + String(valor) + "</v>"; c.texto = null; return; }
    c.attrs = base + ' t="s"'; c.texto = String(valor); c.inner = "<v>0</v>";
  };
  const valorFinal = new Map();
  const filaOriginalDeDestino = new Map();
  for(const reg of regiones){
    let fila = reg.inicio;
    poner(reg.inicio, "A", reg.etiqueta ?? "");
    for(const r of reg.filas){
      if(r.origen != null){ destino.set(r.origen, fila); filaOriginalDeDestino.set(fila, r.origen); }
      for(const [col, v] of Object.entries(r.valores)){ poner(fila, col, v); valorFinal.set(col + fila, v); }
      fila++;
    }
  }
  // 3. Las cadenas compartidas, rearmadas enteras (las que ya nadie usa se van).
  const viejas = cadenas;
  for(const f of hoja.filas) for(const c of f.celdas){
    if(atributo(c.attrs, "t") !== "s") continue;
    if(c.texto == null){ const v = (/<v>([\s\S]*?)<\/v>/.exec(c.inner) || [])[1]; c.texto = viejas[Number(v)] ?? ""; }
    c.inner = "<v>" + idxDe(c.texto) + "</v>";
  }
  // 4. Los totales con el valor al día (y fullCalcOnLoad por si Excel no confía).
  const valorEn = ref => { if(valorFinal.has(ref)) return valorFinal.get(ref); const c = libroCelda(ref); return c; };
  const celdasAhora = new Map();
  for(const f of hoja.filas) for(const c of f.celdas) celdasAhora.set(c.ref, c);
  function libroCelda(ref){ const c = celdasAhora.get(ref); if(!c || esFormula(c)) return c && c.cache != null ? c.cache : ""; return valorDeCelda(c, nuevasCadenas); }
  const maestras = new Map();
  for(const f of hoja.filas) for(const c of f.celdas){
    if(!esFormula(c)) continue;
    const m = /<f\b([^>]*)>([\s\S]*?)<\/f>|<f\b([^>]*)\/>/.exec(c.inner);
    const attrs = m[1] ?? m[3] ?? "", si = atributo(attrs, "si");
    let texto = m[2] ?? "";
    if(texto && si != null) maestras.set(si, { texto, ref: c.ref });
    if(!texto && si != null && maestras.has(si)){ const ma = maestras.get(si); texto = correrColumnas(ma.texto, letraACol(partirRef(c.ref).col) - letraACol(partirRef(ma.ref).col)); }
    const v = texto ? evaluarFormula(desXml(texto), valorEn) : null;
    if(v == null) continue;
    c.cache = v;
    c.inner = /<v>[\s\S]*?<\/v>/.test(c.inner) ? c.inner.replace(/<v>[\s\S]*?<\/v>/, "<v>" + v + "</v>") : c.inner + "<v>" + v + "</v>";
    c.attrs = c.attrs.replace(/\s*\bt="[^"]*"/, "");
  }
  // 5. Los comentarios siguen a su fila (y si la fila se fue, se van).
  let comentariosNuevo = comentariosXml;
  if(comentariosXml){
    const filaNueva = filaOriginal => {
      const reg = originales.find(o => filaOriginal >= o.inicio && filaOriginal <= o.fin);
      if(reg) return destino.has(filaOriginal) ? destino.get(filaOriginal) : null;
      return filaOriginal + originales.filter(o => o.fin < filaOriginal).reduce((n, o) => n + o.delta, 0);
    };
    comentariosNuevo = comentariosXml.replace(/<comment\b([^>]*)\sref="([^"]+)"([^>]*)>([\s\S]*?)<\/comment>/g, (m, a, ref, b, cuerpo) => {
      const p = partirRef(ref); if(!p) return m;
      const nueva = filaNueva(p.fila);
      return nueva == null ? "" : "<comment" + a + ' ref="' + p.col + nueva + '"' + b + ">" + cuerpo + "</comment>";
    });
    if(vmlTexto) vmlTexto = vmlTexto.replace(/<v:shape\b[\s\S]*?<\/v:shape>/g, forma => {
      const fila0 = /<x:Row>(\d+)<\/x:Row>/.exec(forma); if(!fila0) return forma;
      const nueva = filaNueva(Number(fila0[1]) + 1);
      if(nueva == null) return "";
      const delta = nueva - 1 - Number(fila0[1]);
      if(!delta) return forma;
      return forma.replace(/<x:Anchor>([^<]*)<\/x:Anchor>/, (a, lista) => { const n = lista.split(",").map(x => Number(x.trim())); if(n.length === 8){ n[2] += delta; n[6] += delta; } return "<x:Anchor>" + n.join(", ") + "</x:Anchor>"; })
        .replace(/<x:Row>\d+<\/x:Row>/, "<x:Row>" + (nueva - 1) + "</x:Row>");
    });
  }
  if(otros["xl/workbook.xml"]){
    const w = otros["xl/workbook.xml"];

    let nums = 0, total = 0;

        if(texto) reg.textoFormula[col] = texto;

    reg.filas = [];
    for(let f = reg.inicio; f <= reg.fin; f++){
      const valores = {};
      for(const c of columnas) valores[c.col] = valor(c.col + f);
      const comentario = libro.comentarios.find(k => partirRef(k.ref).fila === f);

const LARGOS_TEL = [["549", [13]], ["54", [12, 13]], ["55", [12, 13]], ["56", [11]], ["598", [11]], ["595", [12]], ["52", [12, 13]], ["57", [12]], ["51", [11]],
  ["58", [12]], ["507", [11]], ["506", [11]], ["502", [11]], ["591", [11]], ["593", [12]], ["53", [10]], ["503", [11]], ["501", [10]], ["599", [11]], ["972", [12]], ["1", [11]]];

// Limpieza segura de un texto: marcas invisibles, espacios duros, guiones

function limpiezaSegura(s){
  return String(s ?? "").replace(/[​-‏‪-‮⁠﻿]/g, "").replace(/ /g, " ").replace(/[‐‑‒–−]/g, "-")
    .replace(/\+\s+(\d)/g, "+$1").replace(/\s{2,}/g, " ").replace(/\s+\)/g, ")").replace(/\(\s+/g, "(").trim();

// Los teléfonos que hay en un texto: lo que va entre paréntesis con 7
// dígitos o más ("Rab X (1 (929) 555-0100)" da uno: "1 (929) 555-0100";
// "A (+54…) / B (+54…)" da dos). Sin paréntesis, un tramo de dígitos suelto
// que empiece después de un espacio. `desde` es donde empieza el número.
function telefonosDe(texto){
  const s = String(texto ?? ""), out = [];
  for(let i = 0; i < s.length; i++){
    if(s[i] !== "(") continue;
    let prof = 0, j = i;
    for(; j < s.length; j++){ if(s[j] === "(") prof++; else if(s[j] === ")" && --prof === 0) break; }
    const adentro = s.slice(i + 1, j), digitos = adentro.replace(/\D/g, "");
    if(digitos.length >= 7){ const desde = i + 1 + (adentro.match(/^\s*/)[0].length); out.push({ texto: adentro.trim(), desde, digitos, conMas: adentro.trim().startsWith("+") }); }
    i = j;
  }
  if(out.length) return out;
  for(const m of s.matchAll(/(?:^|\s)(\+?\d[\d\s.\-]*\d)/g)){
    const digitos = m[1].replace(/\D/g, "");

function avisosDeTexto(valor, col, columna){

  if(columna.tipo !== "texto" || !columna.segunda) return avisos;
  const abre = (limpio.match(/\(/g) || []).length, cierra = (limpio.match(/\)/g) || []).length;
  if(abre > cierra) avisos.push({ col, texto: "Falta cerrar un paréntesis.", arreglo: limpio + ")".repeat(abre - cierra), seguro: true });
  else if(cierra > abre) avisos.push({ col, texto: "Sobra un paréntesis de cierre." });

  if(!tels.length){
    if(/\(\s*\)/.test(limpio)) avisos.push({ col, texto: "El paréntesis está vacío: falta el teléfono." });
    else avisos.push({ col, texto: "Sin teléfono." });
    return avisos;
  }
  // Primero el «+» que falta (un solo arreglo, con todos los que falten).
  if(tels.some(t => !t.conMas)){
    let con = "", pos = 0;
    for(const t of tels){ con += limpio.slice(pos, t.desde) + (t.conMas ? "" : "+"); pos = t.desde; }
    con += limpio.slice(pos);
    avisos.push({ col, texto: tels.length > 1 ? "Hay un teléfono que no empieza con «+»." : "El teléfono no empieza con «+».", arreglo: con, seguro: true });
  }
  for(const t of tels){
    const d = t.digitos, regla = LARGOS_TEL.find(([p]) => d.startsWith(p));
    if(regla && !regla[1].includes(d.length)) avisos.push({ col, texto: `El teléfono ${t.texto.trim()} tiene ${d.length} dígitos; con el +${regla[0]} (${PAISES_PREFIJO[regla[0]]}) suelen ser ${regla[1].join(" o ")}. ¿Falta o sobra uno?` });

}
function avisosDeFila(fila, modelo, todas){
  const avisos = [];
  const v = fila.valores;
  for(const c of modelo.columnas){
    const val = v[c.col];
    if(c.tipo === "lista"){
      const s = limpiar(val);
      if(s && !c.opciones.includes(s)){
        const parecido = c.opciones.find(o => sinAcentos(o) === sinAcentos(s));
        avisos.push({ col: c.col, texto: `«${s}» no está en la lista (${c.opciones.join(", ")}).`, arreglo: parecido || null, seguro: !!parecido });
      }
    } else if(c.tipo === "numero"){
      if(val !== "" && val != null && aNumero(val) == null) avisos.push({ col: c.col, texto: "Tendría que ser un número." });
    } else avisos.push(...avisosDeTexto(val, c.col, c));
  }
  // SI/NO y el nombre de al lado tienen que decir lo mismo.
  for(const g of modelo.grupos){
    if(g.cols.length !== 2) continue;
    const [a, b] = g.cols;
    if(a.tipo !== "lista" || !a.opciones.some(o => o.toUpperCase() === "SI")) continue;
    const dice = limpiar(v[a.col]).toUpperCase(), nombre = v[b.col];
    if(dice === "SI" && esNada(nombre)) avisos.push({ col: b.col, texto: `Dice SI en ${g.titulo} pero no hay nadie anotado.` });
    if(dice === "NO" && !esNada(nombre)) avisos.push({ col: a.col, texto: `Dice NO en ${g.titulo} pero hay alguien anotado.` });
    if(dice === "" && !esNada(nombre)) avisos.push({ col: a.col, texto: `Falta el SI/NO de ${g.titulo}.` });
  }
  // País: que esté bien escrito.
  const pais = limpiar(v.C);
  if(pais && !PAISES.includes(pais)){
    const cerca = PAISES.map(p => [p, distancia(sinAcentos(p), sinAcentos(pais))]).sort((x, y) => x[1] - y[1])[0];
    if(cerca && cerca[1] <= 3) avisos.push({ col: "C", texto: `¿«${pais}» es «${cerca[0]}»?`, arreglo: cerca[0], seguro: false });
    else avisos.push({ col: "C", texto: `«${pais}» no está en la lista de países que conozco.` });

    const clave = sinAcentos(v.B) + "|" + sinAcentos(v.C);
    if(limpiar(v.B) && todas.filter(o => o !== fila && sinAcentos(o.valores.B) + "|" + sinAcentos(o.valores.C) === clave).length) avisos.push({ col: "B", texto: "Hay otra comunidad con la misma ciudad y país." });
  }
  for(const c of modelo.basicas) if(c.col !== "B" && c.col !== "C" && (v[c.col] === "" || v[c.col] == null)) avisos.push({ col: c.col, texto: `Sin ${c.titulo.toLowerCase()}.` });

}

function valoresParaExportar(fila, modelo){

    const v = fila.valores[c.col];

function guardarYa(){

      regiones: estado.modelo.regiones.map(r => ({ etiqueta: r.etiqueta, filas: r.filas.map(f => ({ id: f.id, origen: f.origen, valores: f.valores, revisada: f.revisada, nueva: f.nueva })) })) }));

async function cargar(bytes, nombre, guardado){
  const libro = await leerLibro(bytes);
  const modelo = armarModelo(libro);
  const base64 = aBase64(bytes);
  // Lo revisado antes, por ciudad y país, sobrevive aunque el archivo sea otro
  // (por ejemplo, el mismo Excel ya exportado desde acá).
  const revisadasPrevias = new Set();
  if(guardado) for(const r of guardado.regiones || []) for(const f of r.filas || []) if(f.revisada) revisadasPrevias.add(sinAcentos(f.valores?.B) + "|" + sinAcentos(f.valores?.C));
  if(guardado && guardado.base64 === base64){
    modelo.regiones.forEach((reg, i) => {
      const g = guardado.regiones[i]; if(!g) return;
      reg.etiqueta = g.etiqueta ?? reg.etiqueta;
      const porOrigen = new Map(reg.filas.map(f => [f.origen, f]));
      const vacias = Object.fromEntries(modelo.columnas.map(c => [c.col, ""]));
      reg.filas = g.filas.map(s => {
        const base = s.origen != null ? porOrigen.get(s.origen) : null;
        if(base){ base.valores = { ...base.original, ...s.valores }; base.revisada = !!s.revisada; return base; }
        return { id: s.id, origen: null, valores: { ...vacias, ...s.valores }, original: { ...vacias }, revisada: !!s.revisada, nueva: true, comentario: null };

    for(const reg of modelo.regiones) for(const f of reg.filas) if(revisadasPrevias.has(sinAcentos(f.valores.B) + "|" + sinAcentos(f.valores.C))) f.revisada = true;

}
async function abrirArchivo(archivo){
  if(!archivo) return;

  const guardado = leerGuardado();
  try{
    const bytes = new Uint8Array(await archivo.arrayBuffer());
    if(guardado && guardado.base64 !== aBase64(bytes) && guardado.regiones?.some(r => r.filas.some(f => f.nueva || Object.keys(f.valores || {}).length))){

}
function contarCambiosGuardados(g){
  // Sin el archivo a mano no se sabe qué cambió: se cuenta lo nuevo y lo que dice revisado como señal de trabajo hecho.
  let n = 0; for(const r of g.regiones || []) for(const f of r.filas || []) if(f.nueva) n++;
  return n + (g.cambios || 0);
}

// ---------- Exportar ----------
async function exportar(){
  if(!estado) return;
  const { modelo, libro } = estado;
  const regs = modelo.regiones.map(r => ({ inicio: r.inicio, fin: r.fin, etiqueta: r.etiqueta, filas: r.filas.map(f => ({ origen: f.origen, valores: valoresParaExportar(f, modelo) })) }));
  const boton = $("#btnExportar"); boton.disabled = true; boton.textContent = "Armando el Excel…";
  try{
    const bytes = await escribirLibro(libro, regs, modelo.numericas);
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a"); a.href = url; a.download = estado.nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    const cambios = contarCambios();
    aviso(`Listo: «${estado.nombre}» con ${cambios} cambio${cambios === 1 ? "" : "s"}, con el mismo formato de siempre.`);
  } catch(e){ console.error(e); aviso("No pude armar el Excel: " + e.message, true); }
  boton.disabled = false; boton.textContent = "Exportar a Excel";
}

// ---------- Contar ----------
const todasLasFilas = () => estado ? estado.modelo.regiones.flatMap(r => r.filas) : [];
// Fichas cambiadas o nuevas, regiones renombradas y filas del archivo que ya no están.
const contarCambios = () => todasLasFilas().filter(filaCambiada).length + estado.modelo.regiones.filter(r => r.etiqueta !== r.etiquetaOriginal).length
  + estado.modelo.regiones.reduce((n, r) => n + (r.fin - r.inicio + 1) - r.filas.filter(f => f.origen != null).length, 0);
const avisosDe = f => avisosDeFila(f, estado.modelo, todasLasFilas());
function arreglosSeguros(){ return todasLasFilas().flatMap(f => avisosDe(f).filter(a => a.seguro && a.arreglo != null).map(a => ({ fila: f, aviso: a }))); }

// ---------- Dibujar ----------
function renderTodo(){
  const principal = $("#principal");
  if(!estado){
    $("#nombreArchivo").textContent = "Ningún archivo abierto todavía";
    $("#barra").hidden = true; $("#contadores").hidden = true; $("#btnExportar").disabled = true; $("#pieMovil").hidden = true;
    principal.innerHTML = `<section class="portada">
      <h2>Revisar el Mapeo de comunidades</h2>
      <p>Abrí el Excel del Mapeo, corregí lo que haga falta ficha por ficha y volvé a bajarlo <b>con el mismo formato</b>: no se crea un archivo nuevo, se actualiza el que abriste.</p>
      <ol>
        <li><b>Abrir Excel…</b> y elegir «Mapeo - LatAm.xlsx» (o el nombre que tenga).</li>
        <li>Revisar cada comunidad. Lo que parece mal aparece en amarillo, con un botón <b>Aplicar</b> cuando el arreglo es seguro. Al terminar una, marcarla <b>Revisada</b>.</li>
        <li><b>Exportar a Excel</b>: baja el mismo archivo, con los cambios adentro.</li>
      </ol>
      <div class="zona-archivo" id="zonaArchivo">
        <p><button type="button" class="btn btn-primario" data-action="abrir">Abrir Excel…</button></p>
        <p class="gris chico">o arrastrá el archivo hasta acá</p>
      </div>
      <p class="gris chico">Nada sale de este dispositivo: el archivo se lee y se escribe acá, en el navegador. El avance queda guardado en este mismo navegador hasta que exportes.</p>
    </section>`;
    return;
  }
  $("#nombreArchivo").textContent = estado.nombre;
  $("#barra").hidden = false; $("#contadores").hidden = false; $("#btnExportar").disabled = false; $("#pieMovil").hidden = false;
  const paises = [...new Set(todasLasFilas().map(f => limpiar(f.valores.C)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  const fPais = $("#fPais"), elegido = fPais.value;
  fPais.innerHTML = `<option value="">Todos los países</option>` + paises.map(p => `<option value="${esc(p)}"${p === elegido ? " selected" : ""}>${esc(p)}</option>`).join("");
  renderContadores();
  renderRegiones();
}
function renderContadores(){
  const filas = todasLasFilas(), revisadas = filas.filter(f => f.revisada).length, conAvisos = filas.filter(f => avisosDe(f).length).length;
  const cambios = contarCambios(), seguros = arreglosSeguros().length;
  $("#contadores").innerHTML = `<span class="pastilla">${filas.length} comunidades</span>
    <span class="pastilla${revisadas === filas.length && filas.length ? " ok" : ""}">${revisadas} revisada${revisadas === 1 ? "" : "s"}</span>
    <span class="pastilla${conAvisos ? " aviso" : " ok"}">${conAvisos ? conAvisos + " con avisos" : "sin avisos"}</span>
    <span class="pastilla${cambios ? " cambio" : ""}">${cambios} cambio${cambios === 1 ? "" : "s"}</span>
    ${seguros ? `<span class="pastilla aviso"><button type="button" data-action="arreglar-todo">Aplicar ${seguros} arreglo${seguros === 1 ? "" : "s"} seguro${seguros === 1 ? "" : "s"}</button></span>` : ""}
    <span class="pastilla"><button type="button" data-action="empezar-de-nuevo">Cerrar este archivo</button></span>`;
  $("#pieMovilTexto").textContent = `${cambios} cambio${cambios === 1 ? "" : "s"} · ${revisadas}/${filas.length} revisadas`;
}
function filtroPasa(f){
  const q = sinAcentos($("#buscar").value), pais = $("#fPais").value, que = $("#fQue").value;
  if(pais && limpiar(f.valores.C) !== pais) return false;
  if(que === "sin-revisar" && f.revisada) return false;
  if(que === "con-avisos" && !avisosDe(f).length) return false;
  if(que === "cambiadas" && !filaCambiada(f)) return false;
  if(q && !Object.values(f.valores).some(v => sinAcentos(v).includes(q))) return false;
  return true;
}
function renderRegiones(){
  const { modelo } = estado;
  let html = "", vistas = 0;
  modelo.regiones.forEach((reg, i) => {
    const filas = reg.filas.filter(filtroPasa); vistas += filas.length;
    const sub = subtotalesDe(reg, modelo);
    const resumen = [`${reg.filas.length} comunidad${reg.filas.length === 1 ? "" : "es"}`, sub.D != null ? `${fmtNum(sub.D)} miembros` : "", sub.E != null ? `${fmtNum(sub.E)} entidades` : ""].filter(Boolean).join(" · ");
    html += `<section class="region" data-region="${i}">
      <div class="region-cab" data-color="${i % 3}">
        <input type="text" value="${esc(reg.etiqueta)}" placeholder="Región sin nombre" aria-label="Nombre de la región" data-region-etiqueta="${i}" maxlength="40">
        <span class="resumen">${esc(resumen)}${filas.length !== reg.filas.length ? ` · se muestran ${filas.length}` : ""}</span>
        <select class="btn btn-chico" data-ordenar="${i}" aria-label="Ordenar esta región"><option value="">Ordenar…</option><option value="archivo">Como estaba en el archivo</option><option value="pais">Por país y ciudad</option><option value="miembros">Por miembros, de mayor a menor</option></select>
      </div>
      <div class="fichas">${filas.map(f => renderFicha(f, reg, i)).join("")}</div>
      <div class="region-pie"><button type="button" class="btn" data-action="sumar-fila" data-region="${i}">+ Sumar una comunidad${reg.etiqueta ? " en " + esc(reg.etiqueta) : ""}</button></div>
    </section>`;
  });
  if(!vistas) html += `<p class="nada">Ninguna comunidad coincide con lo que buscás.</p>`;
  html += `<p class="pie-pagina">Revisar el Mapeo · Team LatAm</p>`;
  $("#principal").innerHTML = html;
}
function campo(f, c, conTitulo){
  const v = f.valores[c.col], cambiado = String(v ?? "") !== String(f.original[c.col] ?? "");
  const id = `c-${f.id}-${c.col}`;
  let control;
  if(c.tipo === "lista"){
    const actual = limpiar(v), opciones = [...c.opciones]; if(actual && !opciones.includes(actual)) opciones.push(actual);
    control = `<select id="${id}" data-fila="${esc(f.id)}" data-col="${c.col}" class="${cambiado ? "cambiado" : ""}"><option value="">—</option>${opciones.map(o => `<option value="${esc(o)}"${o === actual ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  } else if(c.tipo === "numero"){
    control = `<input id="${id}" type="text" inputmode="numeric" data-fila="${esc(f.id)}" data-col="${c.col}" class="${cambiado ? "cambiado" : ""}" value="${esc(v === "" || v == null ? "" : (typeof v === "number" ? fmtNum(v) : v))}" autocomplete="off">`;
  } else {
    control = `<input id="${id}" type="text" data-fila="${esc(f.id)}" data-col="${c.col}" class="${cambiado ? "cambiado " : ""}${!esNada(v) ? "con-valor" : ""}" value="${esc(v)}" autocomplete="off" dir="auto" placeholder="${c.segunda ? "Nombre (+teléfono)" : ""}">`;
  }
  return `<label class="campo${c.col === "B" ? " ancho" : ""}" for="${id}"><span>${esc(c.titulo)}</span>${control}<div class="avisos" data-col="${c.col}">${htmlAvisos(f, c.col, avisosDe(f))}</div></label>`;
}
const htmlAvisos = (f, col, avisos) => avisos.filter(a => a.col === col).map((a, k) => `<div class="aviso"><b>${esc(a.texto)}</b>${a.arreglo != null ? `<button type="button" class="btn-link" data-action="aplicar-arreglo" data-fila="${esc(f.id)}" data-col="${col}" data-k="${k}">Aplicar${a.seguro ? "" : " «" + esc(a.arreglo) + "»"}</button>` : ""}</div>`).join("");
function renderFicha(f, reg, i){
  const { modelo } = estado;
  const mitades = [...new Set(modelo.grupos.map(g => g.mitad))].filter(Boolean);
  const grupos = modelo.grupos.filter(g => !g.cols.every(c => COLS_BASICAS.includes(c.col)));
  const secciones = (mitades.length ? mitades : [""]).map((m, k) => {
    const de = grupos.filter(g => (g.mitad || "") === m); if(!de.length) return "";
    return `<div class="seccion" data-mitad="${k}">${m ? `<h3>${esc(m)}</h3>` : ""}<div class="grupos">${de.map(g => `<div class="grupo${g.cols.length === 1 ? " solo" : ""}"><span class="titulo">${esc(g.titulo)}</span>${g.cols.map(c => campo(f, c)).join("")}</div>`).join("")}</div></div>`;
  }).join("");
  return `<article class="ficha${f.revisada ? " revisada" : ""}${f.nueva ? " nueva" : ""}" data-ficha="${esc(f.id)}">
    <div class="ficha-cab">${modelo.basicas.map(c => campo(f, c)).join("")}</div>
    ${secciones}
    ${f.comentario ? `<p class="chico gris">💬 Comentario en ${esc(modelo.columnas.find(c => c.col === f.comentario.col)?.titulo || f.comentario.col)}: ${esc(f.comentario.texto)}</p>` : ""}
    <div class="ficha-pie">
      <label class="revisar"><input type="checkbox" data-revisada="${esc(f.id)}"${f.revisada ? " checked" : ""}> Revisada</label>
      <button type="button" class="btn btn-chico ${filaCambiada(f) ? "" : "oculto"}" data-action="deshacer-ficha" data-fila="${esc(f.id)}">Deshacer cambios</button>
      <span class="espacio"></span>
      <span class="menu-ficha"><button type="button" class="btn btn-chico" data-action="menu-ficha" data-fila="${esc(f.id)}" aria-haspopup="true" aria-expanded="false" aria-label="Más opciones">⋯</button></span>
    </div>
  </article>`;
}
// Después de cada tecla: los avisos de esa ficha y los contadores, sin volver
// a dibujar el campo que se está escribiendo.
function refrescarFicha(id){
  const f = todasLasFilas().find(x => x.id === id); const art = document.querySelector(`[data-ficha="${CSS.escape(id)}"]`);
  if(!f || !art) return;
  const avisos = avisosDe(f);
  for(const caja of art.querySelectorAll(".avisos")){
    const col = caja.dataset.col;
    caja.innerHTML = htmlAvisos(f, col, avisos);
    const ctrl = art.querySelector(`[data-fila="${CSS.escape(id)}"][data-col="${col}"]`);
    if(ctrl){
      const v = f.valores[col];
      ctrl.classList.toggle("cambiado", String(v ?? "") !== String(f.original[col] ?? ""));
      if(ctrl.tagName === "INPUT" && ctrl.inputMode !== "numeric") ctrl.classList.toggle("con-valor", !esNada(v));
    }
  }
  art.querySelector('[data-action="deshacer-ficha"]').classList.toggle("oculto", !filaCambiada(f));
  art.classList.toggle("revisada", f.revisada);
  renderContadores();
}
function refrescarTodo(){ for(const f of todasLasFilas()) refrescarFicha(f.id); }

// ---------- Lo que hace cada botón ----------
const filaPorId = id => todasLasFilas().find(f => f.id === id);
const regionDe = f => estado.modelo.regiones.find(r => r.filas.includes(f));
function cerrarMenu(){ if(menuAbierto){ menuAbierto.remove(); menuAbierto = null; document.querySelectorAll('[data-action="menu-ficha"][aria-expanded="true"]').forEach(b => b.setAttribute("aria-expanded", "false")); } }
const acciones = {
  abrir(){ $("#archivo").value = ""; $("#archivo").click(); },
  exportar(){ exportar(); },
  "sumar-fila"(el){
    const reg = estado.modelo.regiones[Number(el.dataset.region)];
    const vacias = Object.fromEntries(estado.modelo.columnas.map(c => [c.col, ""]));
    const f = { id: "n" + Date.now().toString(36), origen: null, valores: { ...vacias }, original: { ...vacias }, revisada: false, nueva: true, comentario: null };
    // El país más común de la región, para no tipearlo.
    const cuenta = {}; for(const o of reg.filas){ const p = limpiar(o.valores.C); if(p) cuenta[p] = (cuenta[p] || 0) + 1; }
    const comun = Object.entries(cuenta).sort((a, b) => b[1] - a[1])[0]; if(comun && reg.filas.length <= 2) f.valores.C = comun[0];
    reg.filas.push(f); guardar(); $("#buscar").value = ""; $("#fQue").value = ""; renderTodo();
    const inp = document.getElementById(`c-${f.id}-B`); if(inp){ inp.scrollIntoView({ block: "center" }); inp.focus(); }
  },
  "menu-ficha"(el){
    if(menuAbierto){ cerrarMenu(); return; }
    const f = filaPorId(el.dataset.fila), reg = regionDe(f), i = reg.filas.indexOf(f);
    const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu");
    m.innerHTML = `<button type="button" role="menuitem" data-action="mover" data-fila="${esc(f.id)}" data-d="-1"${i === 0 ? " disabled" : ""}>↑ Mover arriba</button>
      <button type="button" role="menuitem" data-action="mover" data-fila="${esc(f.id)}" data-d="1"${i === reg.filas.length - 1 ? " disabled" : ""}>↓ Mover abajo</button>
      <button type="button" role="menuitem" class="peligro" data-action="quitar" data-fila="${esc(f.id)}">Quitar esta comunidad</button>`;
    el.parentElement.appendChild(m); menuAbierto = m; el.setAttribute("aria-expanded", "true"); m.querySelector("button:not([disabled])")?.focus();
  },
  mover(el){
    const f = filaPorId(el.dataset.fila), reg = regionDe(f), i = reg.filas.indexOf(f), j = i + Number(el.dataset.d);
    cerrarMenu(); if(j < 0 || j >= reg.filas.length) return;
    reg.filas.splice(i, 1); reg.filas.splice(j, 0, f); guardar(); renderRegiones();
    document.querySelector(`[data-ficha="${CSS.escape(f.id)}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
  },
  quitar(el){
    const f = filaPorId(el.dataset.fila), reg = regionDe(f); cerrarMenu();
    if(reg.filas.length === 1){ aviso("Una región no puede quedar sin comunidades.", true); return; }
    if(!confirm(`¿Quitar «${limpiar(f.valores.B) || "esta comunidad"}» del Mapeo? Al exportar, la fila desaparece del Excel.`)) return;
    reg.filas.splice(reg.filas.indexOf(f), 1);
    guardar(); renderTodo();
  },
  "deshacer-ficha"(el){
    const f = filaPorId(el.dataset.fila);
    if(f.nueva){ const reg = regionDe(f); reg.filas.splice(reg.filas.indexOf(f), 1); guardar(); renderTodo(); return; }
    f.valores = { ...f.original }; guardar(); renderRegiones(); renderContadores();
  },
  "aplicar-arreglo"(el){
    const f = filaPorId(el.dataset.fila), col = el.dataset.col, a = avisosDe(f).filter(x => x.col === col)[Number(el.dataset.k)];
    if(!a || a.arreglo == null) return;
    f.valores[col] = a.arreglo; guardar();
    const ctrl = document.querySelector(`[data-fila="${CSS.escape(f.id)}"][data-col="${col}"]`); if(ctrl) ctrl.value = a.arreglo;
    refrescarFicha(f.id);
  },
  "arreglar-todo"(){
    let n = 0;
    for(let vuelta = 0; vuelta < 4; vuelta++){
      const lista = arreglosSeguros(); if(!lista.length) break;
      for(const { fila, aviso: a } of lista){ if(fila.valores[a.col] !== a.arreglo){ fila.valores[a.col] = a.arreglo; n++; } }
    }
    guardar(); renderRegiones(); renderContadores();
    aviso(n ? `Apliqué ${n} arreglo${n === 1 ? "" : "s"}: caracteres raros, espacios y el «+» de los teléfonos.` : "No había nada seguro para arreglar.");
  },
  "empezar-de-nuevo"(){
    const cambios = contarCambios();
    if(!confirm(cambios ? `Hay ${cambios} cambio${cambios === 1 ? "" : "s"} que todavía no exportaste. Si cerrás el archivo, se pierden. ¿Cerrar igual?` : "¿Cerrar este archivo? Lo marcado como revisado se conserva para la próxima vez.")) return;
    const g = leerGuardado();
    try{ localStorage.setItem(CLAVE, JSON.stringify(g ? { regiones: g.regiones.map(r => ({ filas: r.filas.filter(f => f.revisada).map(f => ({ valores: { B: f.valores.B, C: f.valores.C }, revisada: true })) })) } : null)); } catch(e){}
    estado = null; renderTodo();
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(!el){ if(menuAbierto && !e.target.closest(".menu")) cerrarMenu(); return; }
  const fn = acciones[el.dataset.action]; if(fn) fn(el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && menuAbierto){ cerrarMenu(); } });
document.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.fila && el.dataset.col){
    const f = filaPorId(el.dataset.fila); if(!f) return;
    const c = estado.modelo.columnas.find(x => x.col === el.dataset.col);
    f.valores[el.dataset.col] = c.tipo === "numero" ? (aNumero(el.value) ?? (el.value.trim() === "" ? "" : el.value)) : el.value;
    guardar(); refrescarFicha(f.id);
  } else if(el.dataset.regionEtiqueta != null){
    estado.modelo.regiones[Number(el.dataset.regionEtiqueta)].etiqueta = el.value; guardar(); renderContadores();
  } else if(el.id === "buscar") renderRegiones();
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.revisada){ const f = filaPorId(el.dataset.revisada); f.revisada = el.checked; guardar(); refrescarFicha(f.id); }
  else if(el.dataset.ordenar){
    const reg = estado.modelo.regiones[Number(el.dataset.ordenar)], como = el.value; if(!como) return;
    const orden = { archivo: (a, b) => (a.origen ?? 1e9) - (b.origen ?? 1e9), pais: (a, b) => (limpiar(a.valores.C) + " " + limpiar(a.valores.B)).localeCompare(limpiar(b.valores.C) + " " + limpiar(b.valores.B), "es"), miembros: (a, b) => (aNumero(b.valores.D) ?? -1) - (aNumero(a.valores.D) ?? -1) }[como];
    reg.filas.sort(orden); guardar(); renderRegiones();
  }
  else if(el.id === "fPais" || el.id === "fQue") renderRegiones();
  else if(el.id === "archivo") abrirArchivo(el.files[0]);
  else if(el.dataset.fila && el.dataset.col && el.tagName === "SELECT"){ /* ya lo tomó input */ }
});
// Arrastrar el archivo sobre la portada.
document.addEventListener("dragover", e => { if(e.dataTransfer?.types.includes("Files")){ e.preventDefault(); $("#zonaArchivo")?.classList.add("sobre"); } });
document.addEventListener("dragleave", () => $("#zonaArchivo")?.classList.remove("sobre"));
document.addEventListener("drop", e => { if(e.dataTransfer?.files?.length){ e.preventDefault(); $("#zonaArchivo")?.classList.remove("sobre"); abrirArchivo(e.dataTransfer.files[0]); } });

// ---------- Al abrir la página ----------
(async () => {
  if(typeof DecompressionStream !== "function"){ $("#principal").innerHTML = `<section class="portada"><h2>Este navegador es muy viejo</h2><p>Para abrir el Excel hace falta un navegador más nuevo (Chrome, Safari o Firefox de 2023 en adelante).</p></section>`; return; }
  const g = leerGuardado();
  if(g && g.base64){
    try{ await cargar(deBase64(g.base64), g.nombre, g); aviso("Seguís donde lo dejaste."); return; }
    catch(e){ console.error(e); }
  }
  renderTodo();
})();
