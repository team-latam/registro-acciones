# Las pruebas de index.html, en cada push que toca la app.
#
# Hasta el 3 de octubre de 2026 estas pruebas vivían fuera del repo, en la
# sesión de trabajo que las escribió, y se perdían con ella: lo que
# protegía la app entera no lo corría nadie. Ver pruebas/LEEME.md.
name: Pruebas de la app

on:
  # En main estas mismas pruebas las corre «Publicar el sitio» (pages.yml)
  # antes de publicar: si corrieran también acá, cada push a main las
  # haría dos veces. En cualquier otra rama siguen corriendo solas.
  push:
    branches-ignore: [main]
    paths:
      - "index.html"
      - "supabase/**"              # y sb_test, el adaptador de Supabase
      - "pruebas/**"
      - ".github/workflows/**"       # y workflows_test, las reglas de todos
  pull_request:
  workflow_dispatch:
  # Para que pages.yml las use como portero antes de publicar.
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    name: Correr todas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pruebas/package-lock.json

      - name: Playwright
        working-directory: pruebas
        run: |
          npm ci
          # En GitHub sí hay que bajar el navegador (en el sandbox de
          # Claude Code no: ya está instalado).
          npx playwright install --with-deps chromium

      - name: Las pruebas
        run: ./pruebas/correr.sh
