# Las pruebas de index.html, en cada push que toca la app.
#
# Hasta el 3 de octubre de 2026 estas pruebas vivían fuera del repo, en la
# sesión de trabajo que las escribió, y se perdían con ella: lo que
# protegía la app entera no lo corría nadie. Ver herramientas/pruebas/README.md.
name: Pruebas de la app

on:
  # En main estas mismas pruebas las corre «Publicar el sitio» (pages.yml)
  # antes de publicar: si corrieran también acá, cada push a main las
  # haría dos veces. Tampoco en las ramas de las sesiones de Claude
  # (claude/…): el mismo commit llega a main minutos después y se prueba
  # ahí, y la sesión ya las corrió antes de empujar; eran 20 minutos de
  # más por cada tanda (24/10/2026, docs/AUDITORIA.md, S10). Para correrlas
  # igual en una rama: Actions → «Pruebas de la app» → Run workflow. En
  # cualquier otra rama, y en un pull request, siguen corriendo solas.
  push:
    branches-ignore: [main, 'claude/**']
    paths:
      - "index.html"
      - "supabase/**"              # y sb_test, el adaptador de Supabase
      - "herramientas/pruebas/**"
      - "herramientas/publicar/**"
      - ".github/workflows/**"       # y workflows_test, las reglas de todos
  pull_request:
  workflow_dispatch:
  # Para que pages.yml las use como portero antes de publicar.
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    # En cuatro trabajos a la vez (24/11/2026): corriendo de a uno tardaban ~10 minutos; repartidas (herramientas/pruebas/
    # repartir.py, parejas según pesos.txt) tarda cada parte ~3. `reparto_test.mjs` comprueba que las cuatro partes juntas sean
    # EXACTAMENTE todas las pruebas. fail-fast apagado: si una parte falla, se ven también las otras, no solo la primera.
    name: Correr (parte ${{ matrix.parte }} de ${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    # ubuntu-24.04 y no «latest»: el 19/10/2026 GitHub mueve ubuntu-latest a
    # Ubuntu 26 (actions/runner-images#14748) y cambiar de sistema se decide y
    # se prueba, como subir una acción (docs/AUDITORIA.md, R5).
    runs-on: ubuntu-24.04
    # Cada parte: ~3 min de pruebas (eran ~20 de a una, 24/10/2026; ~10 de a cuatro antes del 24/11) + Playwright
    # (lo normal, 30 s; lo peor, su tope de 20).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            herramientas/pruebas/package-lock.json
            herramientas/publicar/package-lock.json

      # esbuild: lo usan achicar_test.mjs y csp_publicada_test.mjs para armar la página como la publica «Publicar el sitio».
      - name: esbuild (para probar la página achicada)
        working-directory: herramientas/publicar
        run: npm ci --ignore-scripts

      - name: Playwright
        working-directory: herramientas/pruebas
        # El 7/10/2026 (corrida 49 de «Publicar el sitio») este paso se
        # quedó 20 minutos esperando un servidor de paquetes de Ubuntu y se
        # comió el tiempo del trabajo entero, sin llegar a las pruebas. Ahora
        # apt se rinde a los 30 s por pedido, cada intento tiene 6 minutos
        # y hay tres; lo normal son 30 segundos (con un servidor lento, 4
        # minutos: el reintento de esa misma corrida).
        timeout-minutes: 20
        run: |
          npm ci
          # Primero solo el navegador, sin apt (segundos): la imagen de GitHub casi siempre ya trae las librerías del
          # sistema. El 24/11/2026 el intento con `--with-deps` se quedó 5 minutos colgado en apt hasta su tope de 6 y el
          # reintento terminó en 11 segundos. Si el navegador arranca, no se toca apt; si no, sigue todo como antes.
          if npx playwright install chromium \
             && node -e "require('playwright').chromium.launch().then(b => b.close()).then(() => process.exit(0), e => { console.error(String(e).split('\n')[0]); process.exit(1); })"; then
            echo "✓ El navegador arranca sin tocar apt."
            exit 0
          fi
          echo "::notice::El navegador no arrancó solo: se instalan también las librerías del sistema (apt)."
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-tiempos >/dev/null
          # En GitHub sí hay que bajar el navegador (en el sandbox de
          # Claude Code no: ya está instalado).
          for intento in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium && exit 0
            echo "::warning::Bajar el navegador no terminó (intento $intento de 3)."
            sleep 15
          done
          exit 1

      - name: Las pruebas
        env:
          SHARD: ${{ matrix.parte }}/${{ strategy.job-total }}
        run: ./herramientas/pruebas/correr.sh
