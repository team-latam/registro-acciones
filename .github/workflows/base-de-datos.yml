# ============================================================
# La base de datos, sola
# ============================================================
# Antes: cada cambio al SQL había que pegarlo a mano en el panel de
# Supabase. Ahora se hace solo al pushear a main — pero NUNCA sin antes
# probarlo contra un Postgres de verdad, descartable, que se arma y se tira
# en cada corrida.
#
# Si falla aunque sea UNA comprobación, el segundo trabajo no corre y la
# base de verdad no se toca.
# ============================================================
name: Base de datos

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**.sql'
      - 'supabase/aplicar.sh'
      - 'supabase/pruebas/**'
      - '.github/workflows/base-de-datos.yml'
  pull_request:
    paths:
      - 'supabase/**.sql'
      - 'supabase/aplicar.sh'
      - 'supabase/pruebas/**'
      - '.github/workflows/base-de-datos.yml'
  # Para correrlo a mano desde la pestaña Actions, sin cambiar nada.
  workflow_dispatch:


# Lo justo: leer el repo. Las llaves de verdad van por los secretos, no
# por el token de GitHub (docs/AUDITORIA.md, B4).
permissions:
  contents: read

jobs:
  probar:
    name: Probarlo en una base descartable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Esta base vive y muere con esta corrida. La clave está a la vista a
      # propósito: no protege nada.
      BASE: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Que haya psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      # El auth y el storage de mentira, más el banco de pruebas. Esto NO
      # se aplica nunca a la base de verdad: arma una función para hacerse
      # pasar por cualquiera, que es justo lo que hay que poder hacer para
      # probar permisos, y justo lo que no puede existir en producción.
      - name: Armar el laboratorio
        run: psql "$BASE" -q -v ON_ERROR_STOP=1 -f supabase/pruebas/00-laboratorio.sql

      # El WARNING de "wal_level is insufficient" que sale acá es esperable
      # y no rompe nada: un Postgres pelado no arranca preparado para
      # mandar cambios en vivo, Supabase sí. La publicación se crea igual y
      # la prueba 98 lo comprueba.
      - name: Aplicar el esquema entero
        run: ./supabase/aplicar.sh "$BASE"

      - name: Aplicarlo DE NUEVO (tiene que ser inofensivo)
        run: ./supabase/aplicar.sh "$BASE"

      - name: Las pruebas
        run: ./supabase/pruebas/correr.sh "$BASE"

      # Lo de arriba aplica el esquema sobre una base VACÍA. La de verdad
      # tiene datos, y Postgres los revisa cada vez que se recrea una
      # restricción: un archivo que endurece algo sin acordarse de lo ya
      # guardado pasaba acá en verde y se caía recién en Supabase (pasó con
      # el 03 y el 09). Esto vuelve a aplicar todo con filas al límite de lo
      # permitido adentro.
      - name: Aplicarlo otra vez, con datos adentro
        run: ./supabase/pruebas/reaplicar-con-datos.sh "$BASE"

  aplicar:
    name: Aplicarlo a Supabase
    needs: probar
    # Todo menos un pull request. Antes decía `== 'push'`, y eso dejaba
    # afuera al botón "Run workflow": estaba puesto justamente para poder
    # aplicar a mano, y no aplicaba nada — el trabajo se salteaba entero y
    # la corrida figuraba en verde igual. Un botón de adorno es peor que no
    # tenerlo, porque parece que hizo algo.
    #
    # Y solo desde main: el botón deja elegir cualquier rama, y aplicaba a
    # la base de verdad el SQL de una rama a medio hacer (docs/AUDITORIA.md,
    # U2). Lo que llega a producción es lo que está en main, por acá también.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # De a una aplicación por vez, en el orden en que llegaron los push. Sin
    # esto, dos push seguidos aplicaban el SQL a la vez: se pisaban los
    # `drop policy` / `create policy` de una y otra, y la del commit viejo
    # podía terminar última y dejar la base con el esquema anterior, en
    # verde. Si llega un tercero mientras uno espera, el que esperaba se
    # descarta: el más nuevo trae todo (aplicar.sh aplica el esquema entero).
    concurrency:
      group: base-de-datos-aplicar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Que haya psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      # Sin el secreto esto no puede hacer nada, pero tampoco tiene sentido
      # que la corrida figure en rojo por eso: avisa qué falta y termina
      # bien. El día que se cargue, empieza a aplicar solo.
      - name: ¿Está puesta la dirección de la base?
        id: revisar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "### Falta el secreto SUPABASE_DB_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "El SQL se probó y quedó bien, pero no se aplicó a Supabase." >> "$GITHUB_STEP_SUMMARY"
            echo "Se carga en Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar
        if: steps.revisar.outputs.hay == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./supabase/aplicar.sh "$SUPABASE_DB_URL"

      - name: Dejarlo dicho
        if: steps.revisar.outputs.hay == 'si'
        run: |
          echo "### Esquema aplicado a Supabase" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pasó todas las comprobaciones contra un Postgres descartable, vacío y con datos, antes de tocar nada." >> "$GITHUB_STEP_SUMMARY"
