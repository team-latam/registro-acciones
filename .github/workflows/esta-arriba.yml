# "¿Es el sitio o es mi conexión?"
#
# Esto se pregunta desde adentro, con la página sin cargar y sin ninguna
# forma de saberlo: si el navegador no llega, no hay consola ni error que
# mirar. Acá la pregunta la hace una máquina de GitHub, que no comparte ni
# tu red, ni tu DNS, ni tu antivirus, ni tus extensiones.
#
# Se aprieta a mano: Actions > "¿Está arriba la página?" > Run workflow.
# Y corre solo cada 6 horas (desde el 6/10/2026, docs/AUDITORIA.md, M9):
# un trabajo programado que falla le manda un mail al dueño del repo, que
# es el aviso que faltaba. Mira también que Supabase conteste.
name: ¿Está arriba la página?

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  URL: https://team-latam.github.io/registro-acciones/

jobs:
  mirar:
    name: Pedirle la página a GitHub Pages desde afuera
    # ubuntu-24.04 y no «latest»: el 19/10/2026 GitHub mueve ubuntu-latest a
    # Ubuntu 26 (actions/runner-images#14748) y cambiar de sistema se decide y
    # se prueba, como subir una acción (docs/AUDITORIA.md, R5).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pedirla como la pide curl
        run: |
          set -o pipefail   # si no, el exit code lo tapa el último comando de la tubería
          echo "Pidiendo $URL"
          echo

          # --max-time para que un cuelgue termine en un resultado y no en
          # un trabajo colgado 6 horas.
          codigo=$(curl -sS -o pagina.html -w '%{http_code}' --max-time 30 "$URL") || {
            echo "✗ No contestó: la página NO está respondiendo desde afuera tampoco."
            echo "  Entonces el problema no es tu red: es GitHub Pages."
            exit 1
          }

          bytes=$(wc -c < pagina.html)
          echo "Respuesta HTTP: $codigo"
          echo "Tamaño: $bytes bytes"
          echo

          if [ "$codigo" != "200" ]; then
            echo "✗ Contestó $codigo en vez de 200. El sitio está mal publicado."
            exit 1
          fi

          # Que haya contestado 200 no alcanza: GitHub sirve una página de
          # error con 200 si el sitio no existe. Esto comprueba que lo que
          # volvió es la app de verdad.
          if ! grep -q "Registro de Acciones" pagina.html; then
            echo "✗ Contestó 200 pero lo que vino no es la app."
            exit 1
          fi

          echo "✓ La página está arriba y es la de verdad ($bytes bytes)."

      # Un navegador NO pide la página como curl: pide la versión
      # comprimida, por HTTP/2, y se presenta como Chrome. Si la copia
      # comprimida del CDN está rota o cortada, curl a secas no se entera
      # —pide la cruda— y el navegador se queda con la barra a medias y la
      # pantalla en blanco. Que es exactamente lo que se ve.
      - name: Pedirla como la pide un navegador
        run: |
          set -o pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          esperado=$(wc -c < pagina.html)
          falla=0

          for modo in "gzip" "br" "gzip, deflate, br, zstd"; do
            echo "── Accept-Encoding: $modo"
            # --compressed-no: se pide a mano para controlar exactamente qué
            # se ofrece, y curl descomprime solo lo que sabe.
            if ! curl -sS --max-time 30 --compressed \
                 -H "Accept-Encoding: $modo" -H "User-Agent: $UA" \
                 -o conmodo.html -w '   HTTP %{http_code}  bajado %{size_download}B  en %{time_total}s  por %{http_version}\n' \
                 "$URL"; then
              echo "   ✗ se cortó la descarga"
              falla=1
              continue
            fi
            real=$(wc -c < conmodo.html)
            echo "   descomprimido: $real bytes (esperado $esperado)"
            if [ "$real" != "$esperado" ]; then
              echo "   ✗ NO coincide: la copia comprimida viene distinta de la cruda."
              falla=1
            elif ! grep -q "</html>" conmodo.html; then
              echo "   ✗ llegó cortada: no tiene el cierre </html>."
              falla=1
            else
              echo "   ✓ igual que la cruda y completa"
            fi
            echo
          done

          echo "── Encabezados que manda el CDN"
          curl -sSI --max-time 30 -H "User-Agent: $UA" "$URL" \
            | grep -iE "^(content-|cache-|age|x-served-by|x-cache|via|server|last-modified)" || true
          echo

          if [ "$falla" != "0" ]; then
            echo "✗ La página está publicada, pero el CDN la entrega mal a quien la"
            echo "  pide comprimida — o sea, a cualquier navegador. No es tu red."
            exit 1
          fi
          echo "✓ También llega bien comprimida, por HTTP/2 y como Chrome."
          echo
          echo "Con esto, de mi lado no queda nada roto: la página está arriba y se"
          echo "entrega bien de todas las formas en que se la puede pedir. Si vos"
          echo "no podés abrirla, lo que falla está en el camino entre tu equipo y"
          echo "github.io (proveedor de internet, DNS, VPN o antivirus)."

      # La app sin Supabase es una pantalla de error: se pregunta por el
      # login y por la API, con la dirección y la clave pública que usa la
      # app (las mismas que están en index.html, que se lee de main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: ¿Contesta Supabase?
        run: |
          set -o pipefail
          SB_URL=$(grep -oE 'const SUPABASE_URL = "[^"]+"' index.html | cut -d'"' -f2)
          SB_KEY=$(grep -oE 'const SUPABASE_KEY = "[^"]+"' index.html | cut -d'"' -f2)
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "✗ No encontré la dirección de Supabase en index.html"; exit 1; fi
          falla=0
          for camino in "/auth/v1/health" "/rest/v1/"; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "apikey: $SB_KEY" "$SB_URL$camino") || codigo="sin respuesta"
            echo "$camino → $codigo"
            # La API sin sesión puede contestar 401/404 (bien: contestó). Un
            # 5xx o nada es Supabase caído o el proyecto en pausa.
            case "$codigo" in 2*|401|403|404) ;; *) falla=1 ;; esac
          done
          if [ "$falla" != "0" ]; then
            echo "✗ Supabase no contesta bien: la app no puede entrar ni mostrar nada."
            echo "  Mirar el panel de Supabase (¿proyecto en pausa?) y https://status.supabase.com"
            exit 1
          fi
          echo "✓ Supabase contesta."

      # La app carga de afuera la librería de la sesión (supabase-js), la de
      # los Word y las planillas y las del mapa, cada una con su huella (SRI):
      # si el CDN sirve un solo byte distinto, el navegador la frena y la app
      # no entra o no abre. Desde el sandbox de Claude no se llega a esos CDN,
      # así que acá, que sí llegan, se comprueba de verdad que cada archivo
      # sirva lo que la huella espera (docs/AUDITORIA.md, R15). Sale en rojo
      # —y por mail— antes de que alguien se encuentre con la pantalla de error.
      - name: ¿Las librerías de afuera llegan con la huella que la app espera?
        run: |
          set -o pipefail
          pares=$(
            for n in SUPABASE JSZIP DOCX_PREVIEW; do
              u=$(grep -oE "const ${n}_CDN = \"[^\"]+\"" index.html | cut -d'"' -f2)
              h=$(grep -oE "const ${n}_SRI = \"[^\"]+\"" index.html | cut -d'"' -f2)
              echo "$u $h"
            done
            grep -oE '\["https://[^"]+", "sha(256|384)-[A-Za-z0-9+/=]+"\]' index.html \
              | sed -E 's/^\["([^"]+)", "([^"]+)"\]$/\1 \2/'
          )
          total=$(echo "$pares" | grep -c .)
          if [ "$total" -lt 8 ]; then
            echo "✗ Encontré $total pares dirección/huella en index.html y esperaba 8 (supabase-js, JSZip, docx-preview y las cinco del mapa)."
            exit 1
          fi
          falla=0
          while read -r url huella; do
            [ -n "$url" ] || continue
            algoritmo=${huella%%-*}
            if ! curl -sSL --max-time 60 -o libreria.bin "$url"; then
              echo "✗ No se pudo bajar $url"; falla=1; continue
            fi
            real="$algoritmo-$(openssl dgst -"$algoritmo" -binary libreria.bin | openssl base64 -A)"
            if [ "$real" = "$huella" ]; then
              echo "✓ ${url#https://}"
            else
              echo "✗ ${url#https://}"
              echo "    la app espera: $huella"
              echo "    el CDN sirve:  $real"
              falla=1
            fi
          done <<< "$pares"
          if [ "$falla" != "0" ]; then
            echo
            echo "✗ Alguna librería de afuera NO llega como la app la espera: el navegador la va a frenar."
            echo "  Si es supabase-js, nadie puede entrar. Ver docs/AUDITORIA.md (R15) y pruebas/supabase_integridad_test.mjs."
            exit 1
          fi
          echo
          echo "✓ Las $total librerías de afuera llegan con la huella que la app espera."

      # Si github.io está bloqueado en el camino hacia él, el archivo sigue
      # existiendo en otro lado: jsDelivr sirve cualquier archivo de un repo
      # público, por otro CDN y otro dominio. No reemplaza al sitio —el login
      # de Google no funciona desde ahí sin autorizar el dominio— pero sirve
      # para contestar la pregunta que importa: ¿llega el archivo, o no llega
      # NADA? Informativo: que el espejo falle no es problema suyo.
      - name: Un espejo del mismo archivo, por otro CDN
        continue-on-error: true
        run: |
          set -o pipefail
          ESPEJO="https://cdn.jsdelivr.net/gh/team-latam/registro-acciones@main/index.html"
          echo "Pidiendo $ESPEJO"
          codigo=$(curl -sSL -o espejo.html -w '%{http_code}' --max-time 60 "$ESPEJO") || {
            echo "✗ El espejo no contestó."; exit 1; }
          bytes=$(wc -c < espejo.html)
          echo "HTTP $codigo · $bytes bytes"
          if [ "$codigo" = "200" ] && grep -q "Registro de Acciones" espejo.html; then
            echo "✓ El espejo sirve la app. Como PRUEBA sirve: si desde ahí la ve,"
            echo "  lo que falla es github.io y no la página."
          else
            echo "✗ El espejo no trajo la app."
            exit 1
          fi
