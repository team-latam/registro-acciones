# ============================================================
# Calendar, sin que nadie tenga la app abierta
# ============================================================
# Hasta ahora, los cambios hechos directo en Google Calendar entraban al
# Registro solo mientras alguien tenía la app abierta (un chequeo cada 30
# segundos en el navegador). Si nadie entraba en toda la semana no se
# perdía nada —Google guarda el lugar— pero tampoco pasaba nada hasta que
# alguien abriera.
#
# Esto hace lo mismo, todas las madrugadas, sin nadie adelante.
#
# ATENCIÓN: la lógica de qué hacer con cada evento está DOS VECES (en
# supabase/sync-calendar/decidir.mjs y en index.html). La prueba
# diferencial corre las dos contra los mismos eventos y compara escritura
# por escritura: es lo único que evita que se separen en silencio. Si se
# cae, no la saltees.
#
# Lo único que hay que darle es la llave de servicio de Supabase y la de
# la cuenta de servicio de Google (GOOGLE_CUENTA_DE_SERVICIO). A qué
# proyecto y qué calendario salen de index.html.
# ============================================================
name: Calendar

on:
  schedule:
    # 06:00 UTC = 03:00 en Argentina. GitHub puede correrlo unos minutos
    # más tarde si está cargado; para esto da igual.
    - cron: '0 6 * * *'
  # Para correrlo a mano desde la pestaña Actions.
  workflow_dispatch:
  # Y en cada cambio a cualquiera de las dos copias, para que no se separen.
  push:
    branches: [main]
    paths:
      - 'supabase/sync-calendar/**'
      - 'supabase/functions/_compartido/**'
      - 'index.html'
      - '.github/workflows/calendario.yml'
  pull_request:
    paths:
      - 'supabase/sync-calendar/**'
      - 'supabase/functions/_compartido/**'
      - 'index.html'


# Lo justo: leer el repo. Las llaves de verdad van por los secretos, no
# por el token de GitHub (docs/AUDITORIA.md, B4).
permissions:
  contents: read

jobs:
  probar:
    name: Que las dos copias digan lo mismo
    # ubuntu-24.04 y no «latest»: el 19/10/2026 GitHub mueve ubuntu-latest a
    # Ubuntu 26 (actions/runner-images#14748) y cambiar de sistema se decide y
    # se prueba, como subir una acción (docs/AUDITORIA.md, R5).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', package-manager-cache: false }
      - name: La prueba diferencial y la de punta a punta
        run: ./supabase/sync-calendar/pruebas/correr.sh

  sincronizar:
    name: Traer los cambios de Calendar
    needs: probar
    # En un push a main NO se sincroniza: ahí solo interesa que las dos
    # copias sigan diciendo lo mismo. Se sincroniza de madrugada y cuando
    # se pide a mano.
    # Solo el código de main corre con las llaves de verdad: el botón «Run
    # workflow» deja elegir otra rama (docs/AUDITORIA.md, U2).
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Una sincronización por vez: una a mano mientras corre la nocturna se
    # pisaban el token de Google.
    concurrency:
      group: calendario-sincronizar
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', package-manager-cache: false }

      # Sin la llave esto no puede escribir, pero tampoco tiene sentido que
      # la corrida figure en rojo por eso: avisa qué falta y termina bien.
      - name: ¿Está la llave?
        id: revisar
        env:
          LLAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "### Falta el secreto SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Se carga en Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "El paso a paso está en supabase/sync-calendar/LEEME.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar
        if: steps.revisar.outputs.hay == 'si'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # La cuenta de servicio (docs/AUDITORIA.md, U5): el calendario no
          # es público desde el 6/10/2026 y solo ella lo lee. Es el mismo
          # secreto que usa la función de Supabase (funciones.yml).
          GOOGLE_CUENTA_DE_SERVICIO: ${{ secrets.GOOGLE_CUENTA_DE_SERVICIO }}
        # `set -o pipefail` NO es opcional acá: sin eso, bash devuelve el
        # resultado de `tee` —que siempre anda— y no el del programa. El
        # paso quedaba en verde con la sincronización caída, que es la
        # única forma de fallar que no se ve.
        run: |
          set -o pipefail
          node supabase/sync-calendar/sincronizar.mjs | tee -a "$GITHUB_STEP_SUMMARY"
