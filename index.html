<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Acciones — Team LatAm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<style>
  :root{
    --petroleo:#0d3b3e;
    --petroleo-dark:#082a2c;
    --celeste:#4fc7e0;
    --celeste-dark:#1a9fb8;
    --bg:#f4f8f8;
    --card:#ffffff;
    --text:#0d2a2c;
    --text-muted:#5c7a7c;
    --border:#e1edee;
    --sur:#2563eb;
    --central:#eab308;
    --norte:#16a34a;
    --danger:#dc2626;
    --shadow: 0 6px 24px rgba(13,59,62,0.08);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; }
  a{ color:var(--celeste-dark); }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Header ---------- */
  header.topbar{
    background:linear-gradient(135deg, var(--petroleo), var(--petroleo-dark));
    color:#fff;
    padding:18px 20px 0 20px;
    position:sticky; top:0; z-index:40;
    box-shadow:0 4px 18px rgba(0,0,0,0.15);
  }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1200px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{ font-size:26px; }
  .brand h1{ font-size:17px; margin:0; font-weight:800; letter-spacing:0.2px; }
  .brand .sub{ font-size:11px; color:#bfe9ef; font-weight:500; }
  .btn-new{
    background:var(--celeste); color:var(--petroleo-dark); border:none;
    padding:10px 18px; border-radius:999px; font-weight:700; font-size:13.5px;
    cursor:pointer; box-shadow:0 4px 12px rgba(79,199,224,0.4);
    white-space:nowrap;
  }
  .btn-new:hover{ background:var(--celeste-dark); color:#fff; }
  .btn-sync{ background:rgba(255,255,255,0.14); color:#fff; border:none; padding:9px 16px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .btn-sync:hover{ background:rgba(255,255,255,0.24); }
  .btn-sync:disabled{ opacity:0.5; cursor:not-allowed; }
  .header-actions{ display:flex; align-items:center; gap:10px; }

  /* Avatar circular en el header: al apretarlo despliega un menú tipo
     Google con nombre/email y cerrar sesión, en vez de mostrar el email
     entero pegado al lado del botón todo el tiempo. */
  .user-badge{ position:relative; }
  .avatar-btn{
    width:36px; height:36px; padding:0; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    flex-shrink:0; transition:border-color .15s;
  }
  .avatar-btn:hover, .avatar-btn.open{ border-color:#fff; }
  .avatar-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-btn .avatar-fallback-badge{ color:#fff; font-weight:800; font-size:14px; }

  .user-menu{
    position:absolute; top:calc(100% + 12px); right:0; width:250px;
    background:var(--card); color:var(--text); border-radius:var(--radius-md);
    box-shadow:0 14px 36px rgba(8,42,44,0.28); padding:18px 16px 14px;
    text-align:center; z-index:60;
  }
  .user-menu::before{
    content:""; position:absolute; top:-6px; right:13px; width:12px; height:12px;
    background:var(--card); transform:rotate(45deg); border-radius:2px;
  }
  .user-menu .um-avatar, .user-menu .um-avatar-fallback{
    width:60px; height:60px; border-radius:50%; margin:0 auto 10px; display:flex;
    align-items:center; justify-content:center; object-fit:cover;
  }
  .user-menu .um-avatar-fallback{ background:var(--petroleo); color:#fff; font-weight:800; font-size:22px; }
  .user-menu .um-name{ font-size:14.5px; font-weight:700; color:var(--petroleo-dark); line-height:1.3; }
  .user-menu .um-role{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.3px; text-transform:uppercase;
    padding:2px 10px; border-radius:999px; margin:5px 0 2px;
  }
  .user-menu .um-role.role-admin{ background:var(--petroleo); color:#fff; }
  .user-menu .um-role.role-member{ background:var(--bg); color:var(--text-muted); border:1px solid var(--border); }
  .user-menu .um-email{ font-size:12px; color:var(--text-muted); margin:6px 0 14px; word-break:break-all; }
  .user-menu .um-signout{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--petroleo-dark);
    padding:9px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .user-menu .um-signout:hover{ background:#eaf3f3; }
  #tabSolicitudes .pending-count{ background:var(--danger); color:#fff; border-radius:999px; font-size:10.5px; font-weight:800; padding:1px 6px; margin-left:6px; }

  /* ---------- Auth gate (login / pendiente / rechazado) ---------- */
  .auth-gate{ max-width:440px; margin:60px auto; text-align:center; }
  .auth-gate .big{ font-size:44px; margin-bottom:14px; }
  .auth-gate h2{ margin:0 0 8px 0; color:var(--petroleo); font-size:19px; }
  .auth-gate p{ color:var(--text-muted); font-size:13.5px; line-height:1.6; margin:0 0 20px 0; }
  .btn-google{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:#3c4043; border:1.5px solid var(--border);
    padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:var(--shadow);
  }
  .btn-google:hover{ border-color:var(--celeste); }

  /* ---------- Solicitudes (admin) ---------- */
  .request-row{
    display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--border);
    border-radius:var(--radius-md); padding:14px 18px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .request-row img{ width:40px; height:40px; border-radius:50%; flex:none; }
  .avatar-fallback{
    width:40px; height:40px; border-radius:50%; flex:none; background:var(--petroleo); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
  }
  .request-row .rinfo{ flex:1; min-width:0; }
  .request-row .rname{ font-weight:700; font-size:14px; }
  .request-row .remail{ font-size:12px; color:var(--text-muted); margin-top:1px; }
  .request-row .ractions{ display:flex; align-items:center; gap:4px; flex:none; }
  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:999px; margin-right:6px;
  }
  .status-pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .status-pill.approved{ background:#dcfce7; color:#166534; }
  .status-pill.rejected{ background:#fee2e2; color:#991b1b; }
  .btn-ghost{ background:none; border:none; padding:9px 14px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--petroleo); white-space:nowrap; }
  .btn-ghost:hover{ background:#eef4f4; }
  .btn-ghost.danger{ color:var(--danger); }
  .btn-ghost.danger:hover{ background:#fdeceb; }
  .ractions-sep{ width:1px; height:20px; background:var(--border); margin:0 6px; }

  /* ---------- Actividad / registro de auditoría (admin) ---------- */
  .audit-list{ background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow); }
  .audit-row{ display:flex; align-items:center; gap:12px; padding:11px 18px; }
  .audit-row + .audit-row{ border-top:1px solid var(--border); }
  .audit-icon{ font-size:16px; flex:none; }
  .audit-text{ flex:1; font-size:13px; }
  .audit-date{ font-size:11.5px; color:var(--text-muted); flex:none; white-space:nowrap; }
  nav.tabs{ max-width:1200px; margin:14px auto 0 auto; display:flex; gap:4px; }
  nav.tabs.tabs-hidden{ visibility:hidden; pointer-events:none; }
  nav.tabs button{
    background:transparent; border:none; color:#bfe9ef; padding:10px 16px;
    font-weight:700; font-size:13.5px; cursor:pointer; border-bottom:3px solid transparent;
    border-radius:8px 8px 0 0;
  }
  nav.tabs button.active{ color:#fff; border-bottom-color:var(--celeste); background:rgba(255,255,255,0.06); }

  main{ flex:1; max-width:1200px; width:100%; margin:0 auto; padding:18px 16px 80px 16px; }

  /* ---------- Setup banner ---------- */
  .setup-banner{
    background:#fff7e6; border:1px solid #f3d78b; color:#6b4c00;
    border-radius:var(--radius-md); padding:16px 18px; margin-bottom:16px; font-size:13.5px; line-height:1.5;
  }
  .setup-banner code{ background:#f3e6c4; padding:1px 6px; border-radius:5px; }
  /* Flota encima del contenido (no empuja nada) y se desvanece sola. */
  .calendar-notice{
    position:fixed; left:50%; bottom:24px; z-index:70; max-width:min(560px, calc(100vw - 32px));
    transform:translate(-50%, 0); background:#fff7e6; border:1px solid #f3d78b; color:#6b4c00;
    border-radius:var(--radius-md); padding:14px 18px; font-size:13.5px; line-height:1.5;
    box-shadow:0 8px 28px rgba(0,0,0,0.18);
    transition:opacity 0.4s ease, transform 0.4s ease; opacity:1;
  }
  .calendar-notice.notice-ok{ background:#dcfce7; border-color:#86efac; color:#166534; }
  .calendar-notice.fading{ opacity:0; transform:translate(-50%, 8px); }
  .calendar-notice[hidden]{ display:none; }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    padding:18px; margin-bottom:16px; border:1px solid var(--border);
  }

  /* ---------- Filter bar ---------- */
  .filterbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .filterbar input[type=text]{
    flex:1 1 220px; padding:11px 14px; border-radius:999px; border:1.5px solid var(--border);
    font-size:13.5px; background:#fff;
  }
  .chip-toggle{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px;
    border:1.5px solid var(--border); background:#fff; font-size:12.5px; font-weight:600;
    cursor:pointer; color:var(--text-muted); user-select:none;
  }
  .chip-toggle.active{ background:var(--petroleo); color:#fff; border-color:var(--petroleo); }
  .chip-toggle .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chipgroup{ display:flex; flex-wrap:wrap; gap:6px; }
  .filter-clear{ background:none; border:none; color:var(--text-muted); font-size:12px; text-decoration:underline; cursor:pointer; }

  /* ---------- Scope chips ---------- */
  .scope-chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px;
    font-size:11.5px; font-weight:700; background:#eef6f6; color:var(--petroleo); border:1px solid var(--border);
  }
  .scope-chip .zdot{ width:8px; height:8px; border-radius:50%; }
  .scope-chip.removable{ padding-right:6px; }
  .scope-chip .rm{ cursor:pointer; font-weight:800; opacity:0.6; margin-left:2px; }
  .scope-chip .rm:hover{ opacity:1; }

  .type-badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    font-size:11px; font-weight:700; background:var(--petroleo); color:#fff;
  }

  /* ---------- Post card ---------- */
  .post{ }
  .post-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .post-meta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .post-date{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .post-author{ font-size:12.5px; font-weight:700; color:var(--petroleo); }
  .post-content{ font-size:14.5px; line-height:1.55; white-space:pre-wrap; margin:8px 0 10px 0; }
  .post-scopes{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .post-links{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .post-links a{ font-size:12.5px; font-weight:600; }
  .post-images{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .post-images img{
    width:92px; height:92px; object-fit:cover; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid var(--border);
  }
  .post-actions{ display:flex; gap:14px; font-size:12.5px; }
  .post-actions button{
    background:none; border:none; color:var(--text-muted); font-weight:700; cursor:pointer; padding:4px 0;
  }
  .post-actions button:hover{ color:var(--celeste-dark); }

  .thread{ margin-top:12px; padding-left:16px; border-left:3px solid var(--border); display:flex; flex-direction:column; gap:12px; }
  .reply{ background:#f8fbfb; border-radius:var(--radius-md); padding:12px 14px; }
  .reply-system{ background:#fdf9ee; border:1px dashed #ecdcae; }
  .post-cancelled{ opacity:0.85; }
  .reply-head{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .reply-author{ font-size:12.5px; font-weight:700; color:var(--petroleo); }
  .reply-date{ font-size:11px; color:var(--text-muted); }
  .reply-content{ font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .reply-scopes{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .reply-images{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .reply-images img{ width:70px; height:70px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--border); }
  .reply-links{ margin-top:6px; display:flex; flex-direction:column; gap:2px; }
  .reply-links a{ font-size:12px; }
  .reply-actions{ display:flex; gap:14px; margin-top:8px; }
  .reply-actions button{ background:none; border:none; padding:0; font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer; }
  .reply-actions button:hover{ color:var(--petroleo); }
  .reply-actions button.liked{ color:var(--celeste-dark); }
  .reply-children{ margin-top:10px; margin-left:18px; padding-left:12px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .reply-nested-form{ margin-top:8px; }
  .reply-nested-form textarea{ width:100%; min-height:60px; padding:8px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--border); font-size:13px; font-family:inherit; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state .big{ font-size:36px; margin-bottom:10px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,30,31,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:24px 12px; z-index:100; overflow-y:auto;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:#fff; border-radius:var(--radius-lg); width:100%; max-width:640px; padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); margin:auto 0;
  }
  .modal h2{ margin:0 0 14px 0; font-size:18px; color:var(--petroleo); }
  .modal .close{
    position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted);
  }
  .modal-wrap{ position:relative; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px; }
  .field input[type=text], .field input[type=date], .field textarea, .field select, .field input[type=url]{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1.5px solid var(--border); font-size:14px; background:#fbfdfd;
  }
  .field textarea{ min-height:90px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }
  .type-picker{ display:flex; flex-wrap:wrap; gap:8px; }
  .type-picker label{ display:inline-flex; }
  .type-opt{ display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; border:1.5px solid var(--border); cursor:pointer; font-size:12.5px; font-weight:600; }
  .type-opt input{ display:none; }
  .type-opt.checked{ background:var(--petroleo); color:#fff; border-color:var(--petroleo); }

  .scope-builder{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:12px; }
  .scope-builder-add{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .scope-builder-add.has-extra{ grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:520px){ .scope-builder-add, .scope-builder-add.has-extra{ grid-template-columns:1fr; } }
  .scope-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .btn-mini{ background:var(--celeste); color:var(--petroleo-dark); border:none; padding:9px 14px; border-radius:var(--radius-sm); font-weight:700; font-size:12.5px; cursor:pointer; }
  .btn-mini:hover{ background:var(--celeste-dark); color:#fff; }

  .attach-toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label.btn-attach, button.btn-attach{
    display:inline-flex; align-items:center; gap:6px; background:#eef4f4; color:var(--text);
    border:none; padding:11px 18px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer;
    text-transform:none; letter-spacing:normal; margin-bottom:0;
  }
  .btn-attach:hover{ background:#e2eded; }
  .attach-panel{ margin-top:10px; }
  .reply-form-footer{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .attach-row{
    display:flex; gap:8px; align-items:center; margin-bottom:6px;
    background:#f8fbfb; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px;
  }
  .attach-row input{ flex:1; border:1.5px solid var(--border); border-radius:8px; padding:7px 9px; font-size:13px; background:#fff; }
  .attach-row .btn-mini{ flex:none; }
  .link-rows{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .btn-text-add{ background:none; border:none; color:var(--celeste-dark); font-weight:700; font-size:12.5px; cursor:pointer; padding:4px 0; }
  .img-preview-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .img-preview{ position:relative; width:76px; height:76px; }
  .img-preview img{ width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
  .img-preview .rm{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--danger);
    color:#fff; border:none; font-size:12px; cursor:pointer; line-height:20px; text-align:center; padding:0;
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .btn-secondary{ background:#eef4f4; color:var(--text); border:none; padding:11px 18px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-primary{ background:var(--petroleo); color:#fff; border:none; padding:11px 20px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .form-error{ color:var(--danger); font-size:12.5px; margin-top:6px; }
  .hint{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }

  /* ---------- Paises view ---------- */
  .subview-toggle{ display:inline-flex; background:#eef4f4; border-radius:999px; padding:4px; margin-bottom:16px; }
  .subview-toggle button{ border:none; background:none; padding:8px 18px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; color:var(--text-muted); }
  .subview-toggle button.active{ background:var(--petroleo); color:#fff; }
  .paises-toolbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .paises-toolbar .subview-toggle, .paises-toolbar .zone-legend{ margin-bottom:0; }
  .country-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .country-card{
    background:#fff; border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow); cursor:pointer;
    border:1px solid var(--border); border-left:6px solid var(--petroleo); transition:transform 0.1s;
  }
  .country-card:hover{ transform:translateY(-2px); }
  .country-card .name{ font-weight:800; font-size:14px; margin-bottom:4px; }
  .country-card .count{ font-size:22px; font-weight:800; color:var(--petroleo); }
  .country-card .count small{ font-size:11px; font-weight:600; color:var(--text-muted); }

/* ======================================================================

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
function normalize(s){
  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
}
function titleCase(s){
  return String(s||"").trim().replace(/\s+/g," ").replace(/\w\S*/g, w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
}
function safeUrl(u){
  try{
    const url = new URL(String(u).trim());
    if(["http:","https:","mailto:"].includes(url.protocol)) return url.href;
  }catch(e){}
  return null;
}
function fmtDate(d){
  if(!d) return "";
  const dt = typeof d === "string" ? new Date(d+"T00:00:00") : d;
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("es-AR",{ day:"2-digit", month:"short", year:"numeric" });
}
function fmtDateTime(ts){
  if(!ts) return "";
  const dt = ts.toDate ? ts.toDate() : new Date(ts);
  if(isNaN(dt)) return "";
  return dt.toLocaleDateString("es-AR",{ day:"2-digit", month:"short", year:"numeric" }) + " " +
         dt.toLocaleTimeString("es-AR",{ hour:"2-digit", minute:"2-digit" });
}
function uid(){ return Math.random().toString(36).slice(2,10); }

function zoneOfScope(scope){
  if(scope.type==="region") return scope.region;
  const c = COUNTRY_BY_NAME[scope.country];
  return c ? c.zone : null;
}
// ¿esta escala (post o respuesta) afecta al país dado? (directo, vía región, o "toda LatAm")
function scopeAffectsCountry(scope, countryName){
  if(scope.type==="todo") return true;
  if(scope.type==="pais" || scope.type==="ciudad") return scope.country === countryName;
  if(scope.type==="region") return ZONE_COUNTRIES[scope.region].includes(countryName);
  return false;
}
function scopeAffectsZone(scope, zoneKey){
  if(scope.type==="todo") return true;
  return zoneOfScope(scope) === zoneKey;
}
function scopeAffectsCity(scope, countryName, cityName){
  if(scope.type==="todo") return true;
  return scope.type==="ciudad" && scope.country===countryName && normalize(scope.city)===normalize(cityName);
}
function scopeLabel(scope){
  if(scope.type==="todo") return "Toda LatAm y el Caribe";
  if(scope.type==="region") return `Región ${ZONES[scope.region].label}`;
  if(scope.type==="pais") return scope.country;
  if(scope.type==="ciudad") return `${scope.city}, ${scope.country}`;
  return "";
}
function scopeIcon(scope){
  if(scope.type==="todo") return "🌐";
  return scope.type==="region" ? "🌎" : scope.type==="pais" ? "🏳️" : "📍";
}

/* Compresión de imágenes: reduce a JPEG, máx 1280px de lado mayor */
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("No se pudo leer la imagen"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Imagen inválida"));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function storeCalendarCredential(result, opts={}){
  const cred = authMod.GoogleAuthProvider.credentialFromResult(result);
  if(cred && cred.accessToken){
    calendarAccessToken = cred.accessToken;
    calendarTokenExpiry = Date.now() + 55*60*1000; // los access tokens de Google duran ~1h
    if(opts.aclScope) calendarAclScopeGranted = true;
    try{
      sessionStorage.setItem(CALENDAR_TOKEN_STORAGE_KEY, JSON.stringify({ token: calendarAccessToken, expiry: calendarTokenExpiry, aclScope: calendarAclScopeGranted }));
    }catch(e){}
  }
}

// Se asegura de tener un token de Calendar vigente. Si no lo tiene (por
// ejemplo, la sesión de Firebase se restauró silenciosamente al recargar
// la página, lo que NO trae un access token nuevo), vuelve a pedir el
// login con Google — normalmente un click rápido, ya con la cuenta
// pre-seleccionada, no un login completo de nuevo.
// Si quien está logueado es el admin, se pide de una vez también el
// permiso de compartir/sacar gente del Calendar (ver ensureCalendarAclToken)
// junto con el de eventos, en el MISMO popup — así el admin ve como mucho
// UN popup de Google por sesión (al crear/editar el primer posteo, o al
// aprobar/compartir el primer acceso, lo que ocurra primero) en vez de uno
// para cada tipo de acción.
async function ensureCalendarToken(){
  if(calendarAccessToken && Date.now() < calendarTokenExpiry) return calendarAccessToken;
  try{
    const isAdminUser = state.auth.user && state.auth.user.email === ADMIN_EMAIL;
    const provider = new authMod.GoogleAuthProvider();
    provider.addScope("https://www.googleapis.com/auth/calendar.events");
    if(isAdminUser) provider.addScope("https://www.googleapis.com/auth/calendar.acls");
    provider.setCustomParameters({ login_hint: state.auth.user.email });
    const result = await authMod.signInWithPopup(auth, provider);
    storeCalendarCredential(result, { aclScope: isAdminUser });
    return calendarAccessToken;
  }catch(err){
    console.error("No se pudo obtener acceso a Calendar:", err);
    return null;
  }
}

// en true una vez concedido, y se guarda en sessionStorage junto con el
// token para no volver a pedir el popup en cada recarga de página.
async function ensureCalendarAclToken(){
  if(calendarAclScopeGranted && calendarAccessToken && Date.now() < calendarTokenExpiry) return calendarAccessToken;

    const provider = new authMod.GoogleAuthProvider();

}

function addDaysISO(dateStr, days){
  const dt = new Date(dateStr + "T00:00:00");
  dt.setDate(dt.getDate() + days);

}

function buildCalendarEvent(postData){
  const sc = postData.scopes[0];
  const alcanceTipo = !sc ? "" : sc.type === "todo" ? "todo" : sc.type;
  const alcanceValor = (postData.scopes||[]).map(scopeLabel).join(" + ") || "Sin alcance definido";
  const descLines = [
    `Alcance: ${alcanceTipo} | ${alcanceValor}`,
    "",
    postData.content,
  ];
  if(postData.organizer) descLines.push("", `Organiza: ${postData.organizer}`);
  descLines.push("", `Cargado por ${postData.authorName} en Registro de Acciones.`);
  return {
    summary: `${ACTIVITY_BY_KEY[postData.activityType]?.label || "Actividad"}: ${postData.title}`,
    location: postData.location || undefined,
    description: descLines.join("\n"),
    start: { date: postData.startDate },
    end: { date: addDaysISO(postData.endDate, 1) }, // el fin de un evento de todo el día es exclusivo
  };
}

// Para posteos que quedaron sin `calendarEventId` guardado (creados antes
// de esta función, o si falló la sincronización original): busca en el
// Calendar un evento que coincida por título exacto y fecha, para poder
// adoptarlo en vez de fallar o crear uno duplicado. Solo lo toma si hay
// UNA sola coincidencia clara — ante cualquier ambigüedad, no adivina.
async function findCalendarEventId(post){
  const token = await ensureCalendarToken();
  if(!token) return null;
  try{
    const timeMin = `${post.startDate}T00:00:00Z`;
    const timeMax = `${addDaysISO(post.endDate || post.startDate, 2)}T00:00:00Z`;
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events` +
      `?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&q=${encodeURIComponent(post.title)}`;
    const res = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
    if(!res.ok) return null;
    const body = await res.json();
    const expectedSummary = `${ACTIVITY_BY_KEY[post.activityType]?.label || "Actividad"}: ${post.title}`;
    const matches = (body.items||[]).filter(ev => ev.summary === expectedSummary && ev.status !== "cancelled");
    return matches.length === 1 ? matches[0].id : null;
  }catch(err){
    console.error("Error buscando el evento existente en Calendar:", err);
    return null;
  }
}

/* ======================================================================
   SINCRONIZACIÓN CALENDAR → APP (Calendar compartido → posteos)
   ======================================================================
   Si alguien edita, cancela/borra o crea un evento directamente en
   Google Calendar (sin pasar por la app), esto lo refleja en los
   posteos de Firestore. Usa el "sync token" que da la API de Calendar
   para pedir solo lo que cambió desde la última vez (se guarda en
   meta/calendarSync), no todo el calendario entero cada vez.

   Se dispara solo: (a) una vez por sesión, apenas cargan los posteos,
   PERO solo si ya hay un token de Calendar en memoria (o sea, sin pedir
   un login-popup extra a alguien que nunca tocó Calendar), y (b) a mano
   con el botón "Actualizar desde Calendar". No hace falta ninguna regla
   nueva de Firestore para posts/replies: quien corre la sincronización
   ya es un usuario aprobado de la app, así que sus escrituras pasan por
   las mismas reglas de siempre.

   Nota: los eventos recurrentes NO se expanden (no se usa singleEvents),
   así que una serie recurrente cuenta como un solo evento/posteo. No es
   el caso de uso de este calendario (cada acción tiene sus propias
   fechas), así que se deja así por simplicidad.
*/

async function getSyncMeta(){
  const snap = await fb.getDoc(fb.doc(db, "meta", "calendarSync"));
  return snap.exists() ? snap.data() : null;
}
async function setSyncMeta(patch){
  await fb.setDoc(fb.doc(db, "meta", "calendarSync"), { ...patch, lastSyncedAt: fb.serverTimestamp() }, { merge:true });
}

// Lee eventos con la clave de API (no el login de nadie) — el calendario
// tiene que estar configurado como público para lectura en Google
// Calendar. Nunca escribe nada: solo se usa para detectar cambios.
async function fetchCalendarChanges(syncToken){
  let pageToken = null, nextSyncToken = null;
  const events = [];
  do{
    const params = new URLSearchParams({ key:CALENDAR_API_KEY, maxResults:"250", showDeleted:"true" });
    if(syncToken) params.set("syncToken", syncToken);
    else params.set("timeMin", new Date(Date.now() - 90*24*60*60*1000).toISOString());
    if(pageToken) params.set("pageToken", pageToken);
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?${params}`);
    if(res.status === 410) return { needsFullResync:true };
    const body = await res.json();
    if(!res.ok) throw new Error(body.error?.message || res.statusText);
    events.push(...(body.items||[]));
    pageToken = body.nextPageToken || null;
    if(body.nextSyncToken) nextSyncToken = body.nextSyncToken;
  }while(pageToken);
  return { events, nextSyncToken };
}

// A partir de un evento de Calendar, calcula startDate/endDate en el
// mismo formato que usa la app (YYYY-MM-DD, fin inclusive). Los eventos
// de "todo el día" que arma esta misma app tienen el fin exclusivo
// (+1 día, ver buildCalendarEvent) así que hay que deshacer eso acá.
function calendarEventDates(ev){
  if(ev.start?.date) return { startDate: ev.start.date, endDate: addDaysISO(ev.end?.date || ev.start.date, -1) };
  if(ev.start?.dateTime) return { startDate: ev.start.dateTime.slice(0,10), endDate: (ev.end?.dateTime || ev.start.dateTime).slice(0,10) };
  return { startDate:null, endDate:null };
}

// El "summary" que la app manda a Calendar lleva el prefijo "Tipo: " (ver
// buildCalendarEvent) — para leer el título real hay que sacarlo, si está.
function extractTitleFromSummary(summary, activityType){
  const prefix = `${ACTIVITY_BY_KEY[activityType]?.label || ""}: `;
  const s = summary || "";
  return s.startsWith(prefix) ? s.slice(prefix.length) : s;
}

async function applyCalendarEventToPosts(ev){
  const existing = state.posts.find(p => p.calendarEventId === ev.id);

  if(ev.status === "cancelled"){
    if(existing && !existing.cancelled){
      await updatePostDoc(existing.id, { cancelled:true, lastEditedAt: fb.serverTimestamp(), lastEditedBy:"Google Calendar" });
      await createReply(existing.id, {
        authorName:"Google Calendar", content:"Este evento se canceló o se borró directamente en Google Calendar.",
        system:true, icon:"📅", scopes:[], images:[], links:[],
      });
    }
    return;
  }

  const { startDate, endDate } = calendarEventDates(ev);
  if(!startDate) return;
  const location = ev.location || "";

  if(existing){
    const newTitle = extractTitleFromSummary(ev.summary, existing.activityType).trim();
    const titleChanged = !!newTitle && newTitle !== existing.title;
    const changed = existing.startDate !== startDate || existing.endDate !== endDate || (existing.location||"") !== location || titleChanged;
    if(!changed) return;
    const parts = [];
    if(titleChanged) parts.push(`título ("${existing.title}" → "${newTitle}")`);
    if(existing.startDate !== startDate || existing.endDate !== endDate){
      const oldLabel = (existing.endDate||existing.startDate) !== existing.startDate ? `${fmtDate(existing.startDate)}–${fmtDate(existing.endDate)}` : fmtDate(existing.startDate);
      const newLabel = endDate !== startDate ? `${fmtDate(startDate)}–${fmtDate(endDate)}` : fmtDate(startDate);
      parts.push(`fecha (${oldLabel} → ${newLabel})`);
    }
    if((existing.location||"") !== location) parts.push(`lugar${location ? ` (ahora: ${location})` : " (se quitó)"}`);
    const patch = {
      startDate, endDate, date:startDate, location,
      lastEditedAt: fb.serverTimestamp(), lastEditedBy:"Google Calendar",
    };
    if(titleChanged) patch.title = newTitle;
    await updatePostDoc(existing.id, patch);
    await createReply(existing.id, {
      authorName:"Google Calendar", content:`Se actualizó desde Google Calendar: ${parts.join(", ")}.`,
      system:true, icon:"📅", scopes:[], images:[], links:[],
    });
    return;
  }

  // Evento nuevo creado directo en Calendar (no vino de la app): se suma
  // como posteo simple, tipo "Otro" y SIN alcance (no "Toda LatAm y el
  // Caribe" — eso sumaría a los 32 países en los conteos de Países/Mapa
  // antes de que alguien lo revise). Queda marcado como "sin definir" en
  // la tarjeta hasta que alguien lo edite y le ponga el lugar real.
  await createPost({
    title: ev.summary || "(Sin título)",
    content: ev.description || "Creado automáticamente desde Google Calendar.",
    startDate, endDate, date:startDate,
    organizer: ev.organizer?.displayName || ev.organizer?.email || "",
    location,
    activityType: "otro",
    scopes: [],
    images: [], links: [],
    authorName: "Google Calendar", authorEmail: "",
    calendarEventId: ev.id,
  });
}

// Muestra el aviso como un toast flotante (no ocupa espacio ni empuja el
// contenido) y lo hace desaparecer solo, con un fundido, a los pocos
// segundos (el botón "Cerrar" lo saca al toque). Los de error NO se
// auto-ocultan: hay que poder leerlos con calma y que no desaparezcan
// antes de anotar qué decían. Se maneja por DOM directo (no vía
// state+render) para no depender del ciclo de re-render de la vista, que
// recrearía el elemento en cada tecla tipeada y cortaría la animación.
let calendarNoticeTimer = null;
function showCalendarNotice(notice){
  clearTimeout(calendarNoticeTimer);
  calendarToastTextEl.textContent = `${notice.ok ? "📅" : "⚠️"} ${notice.message}`;
  calendarToastEl.classList.toggle("notice-ok", !!notice.ok);
  calendarToastEl.classList.remove("fading");
  calendarToastEl.hidden = false;
  if(!notice.ok) return;
  calendarNoticeTimer = setTimeout(()=>{
    calendarToastEl.classList.add("fading");
    calendarNoticeTimer = setTimeout(()=>{ calendarToastEl.hidden = true; }, 400);
  }, 4000);
}

let calendarSyncInFlight = false;
async function syncFromCalendar(opts){
  const silent = !!(opts && opts.silent);
  // Lee con la clave de API: no hace falta ningún login ni token de
  // usuario, así que esto nunca dispara un popup de Google.
  if(calendarSyncInFlight) return; // evita superponer sincronizaciones (ej. el intervalo de 30s con una anterior que todavía no terminó)
  calendarSyncInFlight = true;
  if(!silent){ state.calendarSyncing = true; render(); }
  try{
    const meta = await getSyncMeta();
    let result = await fetchCalendarChanges(meta?.syncToken || null);
    if(result.needsFullResync) result = await fetchCalendarChanges(null);
    for(const ev of result.events || []){
      await applyCalendarEventToPosts(ev);
    }
    if(result.nextSyncToken) await setSyncMeta({ syncToken: result.nextSyncToken });
    if(!silent){ showCalendarNotice({ ok:true, message:`Sincronizado con Calendar (${(result.events||[]).length} cambio(s) revisado(s)).` }); }
  }catch(err){
    console.error("Error sincronizando desde Calendar:", err);
    if(!silent){ showCalendarNotice({ ok:false, message:"No se pudo sincronizar con Calendar: " + err.message }); }
  }finally{
    calendarSyncInFlight = false;
    if(!silent){ state.calendarSyncing = false; render(); }
  }
}

// Sincroniza sola cada 30s mientras la app esté abierta y con sesión
// (además del botón manual, que sigue estando). Se arranca una sola vez
// por sesión y se para al cerrar sesión.
let calendarSyncInterval = null;
function startCalendarAutoSync(){
  if(calendarSyncInterval) return;
  syncFromCalendar({ silent:true });
  calendarSyncInterval = setInterval(()=> syncFromCalendar({ silent:true }), 30000);
}
function stopCalendarAutoSync(){
  clearInterval(calendarSyncInterval);
  calendarSyncInterval = null;
}

// Registro de auditoría: eventos de acceso/administración (no de contenido
// de posteos). Como el login es 100% con cuenta de Google, no hay
// "contraseña" que registrar acá — se loguean inicio de sesión, pedidos de
// acceso, aprobar/rechazar/revocar, y compartir/sacar del Calendar. Falla
// en silencio (nunca debe bloquear la acción real que se está auditando).
async function logAudit(type, opts){
  const actorEmail = opts?.actorEmail || state.auth.user?.email;
  const actorName = opts?.actorName || state.auth.user?.displayName;
  if(!actorEmail || !actorName) return;
  try{
    await fb.addDoc(fb.collection(db,"auditLog"), {
      type, actorEmail, actorName,
      targetEmail: opts?.targetEmail || null,
      detail: opts?.detail || null,
      createdAt: fb.serverTimestamp(),
    });
  }catch(err){ console.error("Error escribiendo auditoría:", err); }
}
// Un solo registro de "login" por sesión de navegador (no uno por cada
// re-render/recarga silenciosa de la sesión de Firebase).
let auditLoginLoggedThisSession = false;

let unsubscribeData = null;
let unsubscribeRequests = null;
let unsubAllowlist = null;
let unsubOwnRequest = null;
let unsubAuditLog = null;

function recomputeAuthStatus(){
  if(state.auth.status === "admin") return;
  if(state.auth.allowlisted){ state.auth.status = "approved"; return; }
  state.auth.status = state.auth.requestStatus === "rejected" ? "rejected" : "pending";
}

async function onAuthChanged(user){
  if(unsubscribeData){ unsubscribeData(); unsubscribeData = null; }
  if(unsubscribeRequests){ unsubscribeRequests(); unsubscribeRequests = null; }
  if(unsubAllowlist){ unsubAllowlist(); unsubAllowlist = null; }
  if(unsubOwnRequest){ unsubOwnRequest(); unsubOwnRequest = null; }
  if(unsubAuditLog){ unsubAuditLog(); unsubAuditLog = null; }
  state.posts = []; state.repliesByPost = {}; state.loaded = false; state.accessRequests = []; state.auditLog = [];

  if(!user){
    state.auth = { status:"signedOut", user:null };
    render();
    return;
  }
  const profile = { uid:user.uid, email:user.email, displayName:user.displayName || user.email, photoURL:user.photoURL || "" };
  user.getIdTokenResult().then(tok=>{
    console.log("[diagnóstico] email en user.email:", user.email, "| email en el token (lo que ven las reglas):", tok.claims.email);
  }).catch(()=>{});

  if(!auditLoginLoggedThisSession){
    auditLoginLoggedThisSession = true;
    logAudit("login", { actorEmail: profile.email, actorName: profile.displayName });
  }

  if(profile.email === ADMIN_EMAIL){
    state.auth = { status:"admin", user:profile };
    subscribeData();
    subscribeAccessRequests();
    subscribeAuditLog();
    render();
    return;
  }

  // Mientras se resuelve si está aprobado, no se suscribe a posts/replies
  // (evita un permission-denied transitorio contra Firestore).
  state.auth = { status:"loading", user:profile, allowlisted:false, requestStatus:null };
  render();

  let dataSubscribed = false;
  unsubAllowlist = fb.onSnapshot(fb.doc(db, "allowlist", profile.email), snap=>{
    state.auth.allowlisted = snap.exists();
    recomputeAuthStatus();
    if(state.auth.allowlisted && !dataSubscribed){ dataSubscribed = true; subscribeData(); }
    render();
  }, err=>console.error("Error chequeando allowlist:", err));

  const reqRef = fb.doc(db, "accessRequests", profile.email);
  unsubOwnRequest = fb.onSnapshot(reqRef, async snap=>{
    if(!snap.exists()){
      try{
        await fb.setDoc(reqRef, {
          email: profile.email, name: profile.displayName, photoURL: profile.photoURL,
          status: "pending", requestedAt: fb.serverTimestamp(),
        });
        logAudit("access_requested", { actorEmail: profile.email, actorName: profile.displayName });
      }catch(err){ console.error("Error creando solicitud de acceso:", err); }
      return; // el propio setDoc va a disparar un nuevo snapshot con exists()=true
    }
    state.auth.requestStatus = snap.data().status;
    recomputeAuthStatus();
    render();
  }, err=>{
    console.error("Error leyendo solicitud de acceso:", err);
    state.auth.requestStatus = "pending";
    recomputeAuthStatus();
    render();
  });
}

async function requestAccessAgain(){
  const email = state.auth.user.email;
  try{
    await fb.setDoc(fb.doc(db, "accessRequests", email), {
      email, name: state.auth.user.displayName, photoURL: state.auth.user.photoURL,
      status: "pending", requestedAt: fb.serverTimestamp(),
    });
    state.auth = { ...state.auth, status:"pending" };
    logAudit("access_requested", { detail:"pidió de nuevo tras un rechazo" });
    render();
  }catch(err){ console.error(err); }
}

function subscribeAccessRequests(){
  const q = fb.query(fb.collection(db,"accessRequests"), fb.orderBy("requestedAt","desc"));
  unsubscribeRequests = fb.onSnapshot(q, snap=>{
    state.accessRequests = snap.docs.map(d=>({ id:d.id, ...d.data({serverTimestamps:"estimate"}) }));
    render();
  }, err=>console.error("Error leyendo solicitudes:", err));
}
function subscribeAuditLog(){
  const q = fb.query(fb.collection(db,"auditLog"), fb.orderBy("createdAt","desc"));
  unsubAuditLog = fb.onSnapshot(q, snap=>{
    state.auditLog = snap.docs.map(d=>({ id:d.id, ...d.data({serverTimestamps:"estimate"}) }));
    render();
  }, err=>console.error("Error leyendo auditoría:", err));
}
async function approveRequest(email){
  await fb.setDoc(fb.doc(db, "allowlist", email), { email, approvedAt: fb.serverTimestamp(), approvedBy: ADMIN_EMAIL });
  await fb.updateDoc(fb.doc(db, "accessRequests", email), { status:"approved" });
  logAudit("access_approved", { targetEmail: email });
}
async function rejectRequest(email){
  await fb.updateDoc(fb.doc(db, "accessRequests", email), { status:"rejected" });
  logAudit("access_rejected", { targetEmail: email });
}
async function revokeAccess(email){
  await fb.deleteDoc(fb.doc(db, "allowlist", email));
  logAudit("access_revoked", { targetEmail: email });
}

// Las respuestas se escuchan posteo por posteo (subcolección normal),
// nunca con una consulta collectionGroup — ver el comentario grande en
// firestore.rules sobre por qué (esas consultas dan "Missing or
// insufficient permissions" en este proyecto sin importar la regla).
let repliesUnsubs = {}; // postId -> función para dejar de escuchar
function syncReplyListeners(){
  const currentIds = new Set(state.posts.map(p=>p.id));
  Object.keys(repliesUnsubs).forEach(postId=>{
    if(!currentIds.has(postId)){
      repliesUnsubs[postId]();
      delete repliesUnsubs[postId];
      delete state.repliesByPost[postId];
    }
  });
  currentIds.forEach(postId=>{
    if(repliesUnsubs[postId]) return;
    const repliesQ = fb.query(fb.collection(db,"posts",postId,"replies"), fb.orderBy("createdAt","asc"));
    repliesUnsubs[postId] = fb.onSnapshot(repliesQ, snap=>{
      state.repliesByPost[postId] = snap.docs.map(d=>({ id:d.id, postId, ...d.data({serverTimestamps:"estimate"}) }));
      render();
    }, err=>console.error(`Error leyendo respuestas de ${postId}:`, err));
  });
}

function subscribeData(){
  const postsQ = fb.query(fb.collection(db,"posts"), fb.orderBy("date","desc"));
  const unsubPosts = fb.onSnapshot(postsQ, snap=>{
    state.posts = snap.docs.map(d=>({ id:d.id, ...d.data({serverTimestamps:"estimate"}) }));
    state.loaded = true;
    syncReplyListeners();
    render();
    startCalendarAutoSync();
  }, err=>{
    console.error("Error leyendo posts:", err);
    renderFatalError("Error leyendo los posteos desde Firestore: " + err.message);
  });

  unsubscribeData = ()=>{
    unsubPosts();
    Object.values(repliesUnsubs).forEach(fn=>fn());
    repliesUnsubs = {};
    state.repliesByPost = {};
  };
}

async function createPost(data){
  const ref = await fb.addDoc(fb.collection(db,"posts"), {
    ...data,
    createdAt: fb.serverTimestamp(),
  });
  return ref.id;
}
async function createReply(postId, data){
  await fb.addDoc(fb.collection(db, "posts", postId, "replies"), {
    ...data,
    createdAt: fb.serverTimestamp(),
  });
}
async function updatePostDoc(postId, patch){
  await fb.updateDoc(fb.doc(db, "posts", postId), patch);
}

function canEditPost(post){
  if(!isAuthorized()) return false;
  return post.authorEmail === state.auth.user.email || post.activityType !== "rutina";
}

// Compara el posteo original con los datos nuevos y arma un resumen en
// español para dejarlo como respuesta automática en el hilo.
function buildEditSummary(original, next){
  const parts = [];
  if(original.title !== next.title) parts.push(`título ("${original.title}" → "${next.title}")`);
  const oldStart = original.startDate, oldEnd = original.endDate || oldStart;
  if(oldStart !== next.startDate || oldEnd !== next.endDate){
    const oldLabel = oldEnd !== oldStart ? `${fmtDate(oldStart)}–${fmtDate(oldEnd)}` : fmtDate(oldStart);
    const newLabel = next.endDate !== next.startDate ? `${fmtDate(next.startDate)}–${fmtDate(next.endDate)}` : fmtDate(next.startDate);
    parts.push(`fecha (${oldLabel} → ${newLabel})`);
  }
  if((original.location||"") !== (next.location||"")) parts.push(`lugar${next.location ? ` (ahora: ${next.location})` : " (se quitó)"}`);
  if((original.organizer||"") !== (next.organizer||"")) parts.push(`quién organiza${next.organizer ? ` (ahora: ${next.organizer})` : " (se quitó)"}`);
  if(original.activityType !== next.activityType) parts.push(`tipo de actividad (${ACTIVITY_BY_KEY[original.activityType]?.label} → ${ACTIVITY_BY_KEY[next.activityType]?.label})`);
  if(original.content !== next.content) parts.push("comentarios");
  if(JSON.stringify(original.scopes||[]) !== JSON.stringify(next.scopes||[])) parts.push("alcance");
  if(!parts.length) return null;
  return `✏️ ${state.auth.user.displayName} editó este posteo: ${parts.join(", ")}.`;
}

// Actualiza el posteo, deja constancia en el hilo, y mantiene el mismo
// evento de Calendar en vez de duplicarlo (lo crea si antes no existía,
// lo actualiza si ya existía, o lo borra si dejó de ser un tipo que
// sincroniza).
async function updatePostAndSync(postId, original, newData){
  const patch = {
    title:newData.title, content:newData.content, startDate:newData.startDate, endDate:newData.endDate,
    date:newData.startDate, organizer:newData.organizer, location:newData.location,
    activityType:newData.activityType, scopes:newData.scopes, images:newData.images, links:newData.links,
    lastEditedAt: fb.serverTimestamp(), lastEditedBy: state.auth.user.displayName,
  };
  await updatePostDoc(postId, patch);

  const summary = buildEditSummary(original, newData);
  if(summary){
    await createReply(postId, {
      authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
      content: summary, system:true, icon:"✏️", scopes:[], images:[], links:[],
    });
  }

  const willSync = CALENDAR_SYNC_TYPES.has(newData.activityType);
  let eventId = original.calendarEventId;
  if(!eventId && CALENDAR_SYNC_TYPES.has(original.activityType)){
    // Posteo viejo sin el vínculo guardado: buscar el evento existente por
    // título/fecha originales antes de resignarse o crear uno duplicado.
    eventId = await findCalendarEventId(original);
    if(eventId) await updatePostDoc(postId, { calendarEventId: eventId }).catch(()=>{});
  }

  let calResult = { ok:true };
  if(eventId && willSync){
    calResult = await updateCalendarEvent(eventId, newData);
    if(calResult.ok && calResult.eventId !== eventId){
      await updatePostDoc(postId, { calendarEventId: calResult.eventId }).catch(()=>{});
    }
  } else if(eventId && !willSync){
    calResult = await deleteCalendarEvent(eventId);
    if(calResult.ok) await updatePostDoc(postId, { calendarEventId: null }).catch(()=>{});
  } else if(!eventId && willSync){
    calResult = await syncToCalendar(newData);
    if(calResult.ok && calResult.eventId) await updatePostDoc(postId, { calendarEventId: calResult.eventId }).catch(()=>{});
  }
  return calResult;
}

async function cancelPost(post){
  if(!confirm(`¿Cancelar "${post.title}"? Queda marcado como cancelado (no se borra) y se avisa en el hilo.`)) return;
  try{
    await updatePostDoc(post.id, { cancelled:true, lastEditedAt: fb.serverTimestamp(), lastEditedBy: state.auth.user.displayName });
    await createReply(post.id, {
      authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
      content: `🚫 ${state.auth.user.displayName} canceló este evento.`, system:true, icon:"🚫",
      scopes:[], images:[], links:[],
    });
    let eventId = post.calendarEventId;
    if(!eventId && CALENDAR_SYNC_TYPES.has(post.activityType)){
      eventId = await findCalendarEventId(post);
      if(eventId) await updatePostDoc(post.id, { calendarEventId: eventId }).catch(()=>{});
    }
    let calResult;
    if(eventId){
      calResult = await deleteCalendarEvent(eventId);
    } else if(CALENDAR_SYNC_TYPES.has(post.activityType)){
      calResult = { ok:false, reason:"no se encontró un evento de Calendar que coincida (puede que ya se haya borrado a mano, o el título cambió demasiado) — revisalo a mano si hace falta" };
    } else {
      calResult = { ok:true }; // nunca había sincronizado (era Rutina), no hay nada que borrar
    }
    showCalendarNotice(calResult.ok
      ? { ok:true, message:`Se canceló "${post.title}".` }
      : { ok:false, message:`Se canceló "${post.title}" en la app, pero no se pudo sacar del Calendar (${calResult.reason}).` });
  }catch(err){
    console.error(err);
    alert("No se pudo cancelar: " + err.message);
  }
}

/* ======================================================================
   RENDER: shell / tabs / filtros
   ====================================================================== */
const viewRoot = document.getElementById("viewRoot");
let fatalError = null;
function renderFatalError(msg){ fatalError = msg; render(); }

function render(){
  const active = document.activeElement;
  const focusId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  doRender();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el && el !== active){
      el.focus();
      if(selStart != null) try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
}

const userBadgeEl = document.getElementById("userBadge");
const btnNewPostEl = document.getElementById("btnNewPost");
const btnSyncCalendarEl = document.getElementById("btnSyncCalendar");

// Si el menú del avatar está abierto (nombre/email + cerrar sesión). Vive
// fuera de `state` a propósito, como openThreads/openReplyForms: es puro
// estado de UI efímero, no hace falta que sobreviva a nada.
let userMenuOpen = false;

function renderUserBadge(){
  const u = state.auth.user;
  if(!u){ userBadgeEl.innerHTML = ""; userMenuOpen = false; return; }
  const initial = esc((u.displayName || u.email || "?")[0].toUpperCase());
  const avatar = u.photoURL ? `<img src="${esc(u.photoURL)}" alt="">` : `<span class="avatar-fallback-badge">${initial}</span>`;
  const menuAvatar = u.photoURL
    ? `<img class="um-avatar" src="${esc(u.photoURL)}" alt="">`
    : `<div class="um-avatar-fallback">${initial}</div>`;
  userBadgeEl.innerHTML = `
    <button class="avatar-btn${userMenuOpen ? " open" : ""}" data-action="toggle-user-menu" title="${esc(u.displayName)}" aria-label="Cuenta">${avatar}</button>
    ${userMenuOpen ? `
      <div class="user-menu">
        ${menuAvatar}
        <div class="um-name">${esc(u.displayName)}</div>
        <div class="um-role ${isAdmin() ? "role-admin" : "role-member"}">${isAdmin() ? "Admin" : "Miembro"}</div>
        <div class="um-email">${esc(u.email)}</div>
        <button class="um-signout" data-action="sign-out">Cerrar sesión</button>
      </div>` : ""}`;
}

function doRender(){
  document.querySelectorAll("#tabs button[data-view]").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === state.view);
  });

  let html = "";
  if(CONFIG_IS_PLACEHOLDER){
    tabsNav.classList.add("tabs-hidden"); btnNewPostEl.hidden = true; btnSyncCalendarEl.hidden = true; userBadgeEl.innerHTML = "";
    html += `<div class="setup-banner">
      ⚠️ <strong>Falta configurar Firebase.</strong> Esta app todavía no tiene datos compartidos
      porque <code>FIREBASE_CONFIG</code> tiene valores de ejemplo. Abrí <code>index.html</code>,
      completá la configuración con los datos de tu proyecto de Firebase y volvé a publicar el
      archivo. Instrucciones paso a paso en <code>README.md</code>.
    </div>`;
    viewRoot.innerHTML = html;
    return;
  }

  if(fatalError){
    html += `<div class="setup-banner">⚠️ ${esc(fatalError)}</div>`;
  }

  renderUserBadge();

  if(!isAuthorized()){
    tabsNav.classList.add("tabs-hidden"); btnNewPostEl.hidden = true; btnSyncCalendarEl.hidden = true;
    html += renderAuthGate();
    viewRoot.innerHTML = html;
    return;
  }

  tabsNav.classList.remove("tabs-hidden");
  btnNewPostEl.hidden = false;
  btnSyncCalendarEl.hidden = false;
  btnSyncCalendarEl.disabled = state.calendarSyncing === true;
  tabSolicitudesEl.hidden = !isAdmin();
  tabAuditoriaEl.hidden = !isAdmin();
  const pendingCount = state.accessRequests.filter(r=>r.status==="pending").length;
  document.getElementById("pendingBadge").innerHTML = (isAdmin() && pendingCount) ? `<span class="pending-count">${pendingCount}</span>` : "";
  if(!isAdmin() && (state.view === "solicitudes" || state.view === "auditoria")) state.view = "feed";

  if(!fatalError && !state.loaded){
    html += `<div class="empty-state"><div class="big">⏳</div>Cargando registro compartido…</div>`;
    viewRoot.innerHTML = html;
    return;
  }

  if(state.view === "feed") html += renderFeedView();
  else if(state.view === "paises") html += renderPaisesView();
  else if(state.view === "memoria") html += renderMemoriaView();
  else if(state.view === "solicitudes") html += renderSolicitudesView();
  else if(state.view === "auditoria") html += renderAuditoriaView();

  viewRoot.innerHTML = html;
  afterRenderView();

  if(postModalOverlay && !postModalOverlay.hidden) renderComposer();
}

function renderAuthGate(){
  const s = state.auth.status;
  if(s === "loading"){
    return `<div class="auth-gate"><div class="big">⏳</div><p>Cargando…</p></div>`;
  }
  if(s === "signedOut"){
    return `<div class="auth-gate">
      <div class="big">🔒</div>
      <h2>Acceso privado</h2>
      <p>Este registro es solo para el equipo. Iniciá sesión con tu cuenta de Google para entrar.</p>
      <button class="btn-google" data-action="google-signin">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Iniciar sesión con Google
      </button>
    </div>`;
  }
  if(s === "pending"){
    return `<div class="auth-gate">
      <div class="big">⏳</div>
      <h2>Tu acceso está pendiente de aprobación</h2>
      <p>Le avisamos a <strong>${esc(ADMIN_EMAIL)}</strong> que pediste entrar como <strong>${esc(state.auth.user.email)}</strong>.
      Cuando lo apruebe vas a poder entrar (no hace falta que hagas nada más, esta pantalla se actualiza sola).</p>
      <button class="btn-secondary" data-action="sign-out">Cerrar sesión</button>
    </div>`;
  }
  if(s === "rejected"){
    return `<div class="auth-gate">
      <div class="big">🚫</div>
      <h2>Acceso no aprobado</h2>
      <p>Tu solicitud con <strong>${esc(state.auth.user.email)}</strong> no fue aprobada. Si creés que es un error, contactá a <strong>${esc(ADMIN_EMAIL)}</strong>.</p>
      <button class="btn-mini" data-action="request-again">Pedir acceso de nuevo</button>
      <div style="height:10px"></div>
      <button class="btn-secondary" data-action="sign-out">Cerrar sesión</button>
    </div>`;
  }
  return "";
}

/* ======================================================================
   SOLICITUDES (panel admin)
   ====================================================================== */
function renderSolicitudesView(){
  const reqs = state.accessRequests;
  if(!reqs.length) return `<div class="empty-state"><div class="big">📭</div>No hay solicitudes todavía.</div>`;
  return reqs.map(r=>{
    let actions;
    if(r.status === "approved") actions = `<span class="status-pill approved">Aprobado</span>
      <button class="btn-ghost" data-action="share-calendar" data-email="${esc(r.email)}">🔄 Compartir Calendar</button>
      <span class="ractions-sep"></span>
      <button class="btn-ghost danger" data-action="revoke-access" data-email="${esc(r.email)}">Revocar acceso</button>`;
    else if(r.status === "rejected") actions = `<span class="status-pill rejected">Rechazado</span>
      <button class="btn-primary" data-action="approve-request" data-email="${esc(r.email)}">Aprobar igual</button>`;
    else actions = `<button class="btn-secondary" data-action="reject-request" data-email="${esc(r.email)}">Rechazar</button>
      <button class="btn-primary" data-action="approve-request" data-email="${esc(r.email)}">Aprobar</button>`;
    return `<div class="request-row">
      ${r.photoURL ? `<img src="${esc(r.photoURL)}" alt="">` : `<div class="avatar-fallback">${esc((r.name||r.email||"?")[0].toUpperCase())}</div>`}
      <div class="rinfo">
        <div class="rname">${esc(r.name||r.email)}</div>
        <div class="remail">${esc(r.email)} · pedido ${fmtDateTime(r.requestedAt)}</div>
      </div>
      <div class="ractions">${actions}</div>
    </div>`;
  }).join("");
}

   ACTIVIDAD / registro de auditoría (panel admin, pestaña "Actividad")

   rechazó/revocó, a quién se compartió el Calendar). No es un registro
   de los posteos ni su contenido.

/* ---------- Filtro compartido (Feed / Memoria) ---------- */
function renderFilterBar(prefix){
  const typeChips = ACTIVITY_TYPES.map(t=>`
    <span class="chip-toggle ${state.filters.types.has(t.key)?"active":""}" data-action="toggle-type" data-key="${t.key}">
      ${t.icon} ${t.label}
    </span>`).join("");
  const zoneChips = Object.values(ZONES).map(z=>`
    <span class="chip-toggle ${state.filters.zones.has(z.key)?"active":""}" data-action="toggle-zone" data-key="${z.key}">
      <span class="dot" style="background:${z.color}"></span> ${z.label}
    </span>`).join("");
  const placeChip = state.filters.place ? `
    <span class="chip-toggle active" data-action="clear-place">
      📍 ${esc(placeFilterLabel(state.filters.place))} ✕
    </span>` : "";
  const anyFilter = state.filters.text || state.filters.types.size || state.filters.zones.size || state.filters.place;
  return `
    <div class="filterbar">
      <input type="text" id="${prefix}Search" placeholder="Buscar por texto…" value="${esc(state.filters.text)}" data-action="set-text">
      <div class="chipgroup">${typeChips}</div>
      <div class="chipgroup">${zoneChips}</div>
      ${placeChip}
      ${anyFilter ? `<button class="filter-clear" data-action="clear-filters">Limpiar filtros</button>` : ""}
    </div>`;
}
function placeFilterLabel(place){
  if(place.kind==="zone") return `Región ${ZONES[place.zone].label}`;
  if(place.kind==="country") return place.country;
  if(place.kind==="city") return `${place.city}, ${place.country}`;
  return "";
}

function matchesTextFilter(text, record){
  if(!text) return true;
  const n = normalize(text);
  return normalize(record.title||"").includes(n) ||
    normalize(record.content||"").includes(n) ||
    normalize(record.authorName||"").includes(n) ||
    normalize(record.organizer||"").includes(n) ||
    normalize(record.location||"").includes(n);
}
function matchesPlaceOrZoneFilter(record){
  const f = state.filters;
  const scopes = record.scopes || [];
  if(f.zones.size && !scopes.some(sc=>zoneOfScope(sc) && f.zones.has(zoneOfScope(sc)))) return false;
  if(f.place){
    const ok = scopes.some(sc=>{
      if(f.place.kind==="zone") return scopeAffectsZone(sc, f.place.zone);
      if(f.place.kind==="country") return scopeAffectsCountry(sc, f.place.country);
      if(f.place.kind==="city") return scopeAffectsCity(sc, f.place.country, f.place.city);
      return false;
    });
    if(!ok) return false;
  }
  return true;
}

// Devuelve los posts visibles según filtros, cada uno con sus replies ordenadas
function getVisiblePosts(){
  const f = state.filters;
  return state.posts
    .filter(p=> !f.types.size || f.types.has(p.activityType))
    .filter(p=>{
      const replies = state.repliesByPost[p.id] || [];
      const postMatchesText = matchesTextFilter(f.text, p) || replies.some(r=>matchesTextFilter(f.text, r));
      if(!postMatchesText) return false;
      if(!f.zones.size && !f.place) return true;
      const postMatchesPZ = matchesPlaceOrZoneFilter(p) || replies.some(r=>matchesPlaceOrZoneFilter(r));
      return postMatchesPZ;
    })
    .map(p=>({ post:p, replies: state.repliesByPost[p.id] || [] }));
}

function renderFeedView(){
  const items = getVisiblePosts();
  return `
    ${renderFilterBar("feed")}
    ${items.length ? items.map(({post,replies})=>renderPostCard(post,replies)).join("") :
      `<div class="empty-state"><div class="big">🗒️</div>Todavía no hay posteos${anyActiveFilter()?" que coincidan con el filtro":""}.<br>Usá "+ Nuevo posteo" para sumar el primero.</div>`}
  `;
}
function anyActiveFilter(){
  const f = state.filters;
  return !!(f.text || f.types.size || f.zones.size || f.place);
}

const openReplyForms = new Set();
const openThreads = new Set(); // postIds con el hilo de comentarios desplegado
const replyDrafts = {}; // postId -> draft
const openNestedReplyForms = new Set(); // replyIds con su mini-formulario de "responder a esto" abierto
const nestedReplyDrafts = {}; // replyId -> { content }
function getNestedReplyDraft(replyId){
  if(!nestedReplyDrafts[replyId]) nestedReplyDrafts[replyId] = { content:"", images:[], links:[] };
  return nestedReplyDrafts[replyId];
}

function newScopeDraft(){ return { type:"ciudad", country:"", city:"", region:"sur", cityUseCustom:false }; }
function newReplyDraft(){
  return { content:"", images:[], links:[], extraScope:false, scopes:[], scopeDraft:newScopeDraft(), scopeError:"" };
}
function getReplyDraft(postId){
  if(!replyDrafts[postId]) replyDrafts[postId] = newReplyDraft();
  return replyDrafts[postId];
}
function resetReplyDraft(postId){
  replyDrafts[postId] = newReplyDraft();
}

function renderPostCard(post, replies){
  const type = ACTIVITY_BY_KEY[post.activityType] || ACTIVITY_BY_KEY.otro;
  const scopesHtml = (post.scopes||[]).map(sc=>renderScopeChip(sc)).join("");
  const linksHtml = (post.links||[]).filter(l=>safeUrl(l.url)).map(l=>
    `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">🔗 ${esc(l.label||l.url)}</a>`).join("");
  const imagesHtml = (post.images||[]).map(src=>
    `<img src="${src}" data-action="open-lightbox" data-src="${src}">`).join("");
  const replyOpen = openReplyForms.has(post.id);
  const threadOpen = openThreads.has(post.id);
  const startDate = post.startDate || post.date;
  const endDate = post.endDate || startDate;
  const dateLabel = endDate && endDate !== startDate ? `${fmtDate(startDate)} – ${fmtDate(endDate)}` : fmtDate(startDate);
  const metaBits = [];
  if(post.organizer) metaBits.push(`👤 Organiza: ${esc(post.organizer)}`);
  if(post.location) metaBits.push(`📍 ${esc(post.location)}`);
  const editable = canEditPost(post);
  const canCancel = editable && post.activityType !== "rutina" && !post.cancelled;
  return `
    <article class="card post ${post.cancelled?"post-cancelled":""}" data-post-id="${post.id}">
      <div class="post-head">
        <div class="post-meta">
          <span class="type-badge">${type.icon} ${type.label}</span>
          <span class="post-date">${dateLabel}</span>
          ${post.cancelled ? `<span class="type-badge" style="background:var(--danger);">🚫 Cancelado</span>` : ""}
        </div>
        <span class="post-author">${esc(post.authorName||"Anónimo")}</span>
      </div>
      ${post.title ? `<h3 style="margin:6px 0 0 0;font-size:16px;color:var(--petroleo);${post.cancelled?"text-decoration:line-through;opacity:0.7;":""}">${esc(post.title)}</h3>` : ""}
      ${metaBits.length ? `<div class="hint" style="margin-top:4px;">${metaBits.join(" · ")}</div>` : ""}
      <div class="post-content">${nl2br(post.content)}</div>
      ${scopesHtml ? `<div class="post-scopes">${scopesHtml}</div>` :
        `<div class="hint" style="color:var(--danger);">⚠️ Sin alcance definido — editalo para asignarle un país/ciudad.</div>`}
      ${linksHtml ? `<div class="post-links">${linksHtml}</div>` : ""}
      ${imagesHtml ? `<div class="post-images">${imagesHtml}</div>` : ""}
      ${post.lastEditedBy ? `<div class="hint">Editado por ${esc(post.lastEditedBy)}</div>` : ""}
      <div class="post-actions">
        <button data-action="toggle-reply" data-post-id="${post.id}">💬 Responder</button>
        ${replies.length ? `<button data-action="toggle-thread" data-post-id="${post.id}">${threadOpen ? "▲ Ocultar" : "▼ Ver"} ${replies.length} comentario${replies.length===1?"":"s"}</button>` : ""}
        ${editable ? `<button data-action="edit-post" data-post-id="${post.id}">✏️ Editar</button>` : ""}
        ${canCancel ? `<button data-action="cancel-post" data-post-id="${post.id}">🚫 Cancelar evento</button>` : ""}
      </div>

    </article>`;
}

  const zone = zoneOfScope(sc);

  return `<span class="scope-chip ${removable?"removable":""}">
      <span class="zdot" style="background:${color}"></span>${scopeIcon(sc)} ${esc(scopeLabel(sc))}
      ${removable ? `<span class="rm" data-action="${removable}" data-idx="${idx}" data-owner-id="${esc(ownerId)}">✕</span>` : ""}
    </span>`;
}

// Un solo nivel de anidamiento: responder a una respuesta ya anidada la
// cuelga del mismo padre en vez de seguir apilando (ver submitNestedReply).
function renderThread(post, replies){
  if(!replies.length) return "";
  const topLevel = replies.filter(r=>!r.replyToId);
  const childrenOf = id => replies.filter(r=>r.replyToId === id);
  const renderOne = r => {
    const children = childrenOf(r.id);
    return `${renderReply(r)}${children.length ? `<div class="reply-children">${children.map(renderOne).join("")}</div>` : ""}`;
  };
  return `<div class="thread">${topLevel.map(renderOne).join("")}</div>`;
}
function renderReply(r){
  const scopesHtml = (r.scopes||[]).map(sc=>renderScopeChip(sc)).join("");
  const linksHtml = (r.links||[]).filter(l=>safeUrl(l.url)).map(l=>
    `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">🔗 ${esc(l.label||l.url)}</a>`).join("");
  const imagesHtml = (r.images||[]).map(src=>
    `<img src="${src}" data-action="open-lightbox" data-src="${src}">`).join("");
  const likedBy = r.likedBy || [];
  const liked = isAuthorized() && likedBy.includes(state.auth.user.email);
  const nestedOpen = openNestedReplyForms.has(r.id);
  return `
    <div class="reply ${r.system?"reply-system":""}">
      <div class="reply-head">
        <span class="reply-author">${r.system ? `${esc(r.icon||"🔔")} ` : ""}${esc(r.authorName||"Anónimo")}</span>
        <span class="reply-date">${fmtDateTime(r.createdAt)}</span>
      </div>
      <div class="reply-content">${nl2br(r.content)}</div>
      ${scopesHtml ? `<div class="reply-scopes">${scopesHtml}</div>` : ""}
      ${linksHtml ? `<div class="reply-links">${linksHtml}</div>` : ""}
      ${imagesHtml ? `<div class="reply-images">${imagesHtml}</div>` : ""}
      ${!r.system ? `
      <div class="reply-actions">
        <button data-action="toggle-like" data-post-id="${r.postId}" data-reply-id="${r.id}" class="${liked?"liked":""}">${liked?"👍":"🤍"} Me gusta${likedBy.length?` (${likedBy.length})`:""}</button>
        <button data-action="toggle-nested-reply" data-reply-id="${r.id}">↩ Responder</button>
      </div>` : ""}
      ${nestedOpen ? renderNestedReplyForm(r.postId, r.id) : ""}
    </div>`;
}

    </div>`).join("")}</div>`;

function renderScopeBuilder(scope, ownerId, draft){
  const sd = draft.scopeDraft;
  let extra = "";
  if(sd.type === "region"){
    extra = `<select data-scope-field="region" data-scope="${scope}" data-owner-id="${ownerId}">
        ${Object.values(ZONES).map(z=>`<option value="${z.key}" ${sd.region===z.key?"selected":""}>${z.label}</option>`).join("")}
      </select>`;
  } else if(sd.type === "pais"){
    extra = `<select data-scope-field="country" data-scope="${scope}" data-owner-id="${ownerId}">
        <option value="">Elegir país…</option>${groupedCountryOptions(sd.country)}
      </select>`;
  } else if(sd.type === "todo"){
    extra = "";
  } else {
    const presets = CITY_PRESETS[sd.country];
    let cityField;
    if(presets && !sd.cityUseCustom){
      cityField = `<select data-scope-field="citySelect" data-scope="${scope}" data-owner-id="${ownerId}">
          <option value="">Elegir ciudad…</option>
          ${presets.map(c=>`<option value="${esc(c.name)}" ${sd.city===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}
          <option value="__other__">Otra ciudad (escribir)…</option>
        </select>`;
    } else {
      cityField = `<input type="text" placeholder="Ciudad" data-scope-field="city" data-scope="${scope}" data-owner-id="${ownerId}" value="${esc(sd.city)}">
        ${presets ? `<button type="button" class="btn-text-add" data-action="use-city-preset" data-scope="${scope}" data-owner-id="${ownerId}">← Elegir de la lista</button>` : ""}`;
    }
    extra = `<select data-scope-field="country" data-scope="${scope}" data-owner-id="${ownerId}">
        <option value="">Elegir país…</option>${groupedCountryOptions(sd.country)}
      </select>
      ${cityField}`;
  }
  return `
    <div class="scope-builder" style="margin-bottom:8px;">
      <div class="scope-builder-add ${sd.type==='ciudad'?'has-extra':''}">
        <select data-scope-field="type" data-scope="${scope}" data-owner-id="${ownerId}">
          <option value="ciudad" ${sd.type==="ciudad"?"selected":""}>Ciudad específica</option>
          <option value="pais" ${sd.type==="pais"?"selected":""}>País completo</option>
          <option value="region" ${sd.type==="region"?"selected":""}>Región completa</option>
          <option value="todo" ${sd.type==="todo"?"selected":""}>Toda LatAm y el Caribe</option>
        </select>
        ${extra}
      </div>
      <button type="button" class="btn-mini" data-action="add-scope" data-scope="${scope}" data-owner-id="${ownerId}">+ Agregar alcance</button>
      ${draft.scopeError ? `<div class="form-error">${esc(draft.scopeError)}</div>` : ""}
      <div class="scope-list">${draft.scopes.map((sc,i)=>renderScopeChip(sc, `rm-scope-${scope}`, i, ownerId)).join("")}</div>
    </div>`;
}
function groupedCountryOptions(selected){
  return Object.values(ZONES).map(z=>`
    <optgroup label="${z.label}">
      ${ZONE_COUNTRIES[z.key].map(name=>`<option value="${esc(name)}" ${selected===name?"selected":""}>${esc(name)}</option>`).join("")}
    </optgroup>`).join("");
}

/* ======================================================================
   AGREGACIÓN POR LUGAR (posts + alcance sumado desde respuestas)
   ====================================================================== */
function computePlaceCounts(){
  const byCountry = {};
  COUNTRIES.forEach(c=>{ byCountry[c.name] = { total:0, general:0, cities:{} }; });
  function ingest(scopes){
    (scopes||[]).forEach(sc=>{
      if(sc.type==="pais" && byCountry[sc.country]){
        byCountry[sc.country].total++; byCountry[sc.country].general++;
      } else if(sc.type==="ciudad" && byCountry[sc.country]){
        const city = titleCase(sc.city);
        byCountry[sc.country].total++;
        byCountry[sc.country].cities[city] = (byCountry[sc.country].cities[city]||0)+1;
      } else if(sc.type==="region" && ZONE_COUNTRIES[sc.region]){
        ZONE_COUNTRIES[sc.region].forEach(name=>{ byCountry[name].total++; byCountry[name].general++; });
      } else if(sc.type==="todo"){
        COUNTRIES.forEach(c=>{ byCountry[c.name].total++; byCountry[c.name].general++; });
      }
    });
  }
  state.posts.forEach(p=>{
    ingest(p.scopes);
    (state.repliesByPost[p.id]||[]).forEach(r=>ingest(r.scopes));
  });
  return byCountry;
}

// Clickeable, multi-selección: filtra Países (Lista y Mapa) por una o
// varias zonas a la vez (ej. Central + Norte). Click de nuevo sobre una
// zona activa la saca; si no queda ninguna tildada, se ven todas.
function renderZoneLegend(){
  const active = state.paisesZoneFilter;
  return `<div class="zone-legend">${Object.values(ZONES).map(z=>
    `<span class="chip-toggle${active.has(z.key)?" active":""}" data-action="toggle-paises-zone" data-key="${z.key}">
      <span class="dot" style="background:${z.color}"></span>${z.label}${active.has(z.key)?" ✕":""}
    </span>`).join("")}</div>`;
}
function visiblePaisesCountries(){
  return state.paisesZoneFilter.size ? COUNTRIES.filter(c=>state.paisesZoneFilter.has(c.zone)) : COUNTRIES;
}

function renderPaisesView(){
  const sub = state.paisesSubview;
  const toggle = `
    <div class="subview-toggle">
      <button data-action="paises-subview" data-key="lista" class="${sub==="lista"?"active":""}">Lista</button>
      <button data-action="paises-subview" data-key="mapa" class="${sub==="mapa"?"active":""}">Mapa</button>
    </div>`;
  if(CONFIG_IS_PLACEHOLDER) return toggle + `<div class="empty-state">Configurá Firebase para ver datos.</div>`;

  const counts = computePlaceCounts();
  const toolbar = `<div class="paises-toolbar">${toggle}${renderZoneLegend()}</div>`;
  if(sub === "mapa"){
    return `${toolbar}<div id="map"></div>`;
  }
  if(state.countryDrill && byCountryExists(state.countryDrill)){
    return toolbar + renderCountryDrill(state.countryDrill, counts[state.countryDrill]);
  }
  const sorted = visiblePaisesCountries().slice().sort((a,b)=> counts[b.name].total - counts[a.name].total || a.name.localeCompare(b.name));
  const cards = sorted.map(c=>{
    const cnt = counts[c.name].total;
    return `<div class="country-card" style="border-left-color:${ZONES[c.zone].color}" data-action="drill-country" data-country="${esc(c.name)}">
      <div class="name">${esc(c.name)}</div>
      <div class="count">${cnt}<small> registro${cnt===1?"":"s"}</small></div>
    </div>`;
  }).join("");
  return `${toolbar}<div class="country-grid">${cards}</div>`;
}
