  else if(postData.organizer) descLines.push("", `Organiza: ${postData.organizer}`);
  descLines.push("", `Cargado por ${postData.authorName} en Registro de Acciones.`);
  // Con hora (startTime/endTime cargados): evento puntual, dateTime +
  // timeZone del navegador de quien lo carga (Calendar API lo exige junto
  // a dateTime). Sin hora: como antes, evento de "todo el día" con date
  // (el fin es exclusivo, por eso el +1 día).
  const hasTime = !!(postData.startTime && postData.endTime);
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  return {
    summary: `${ACTIVITY_BY_KEY[postData.activityType]?.label || "Actividad"}: ${postData.title}`,
    location: postData.location || undefined,
    description: descLines.join("\n"),
    start: hasTime ? { dateTime: `${postData.startDate}T${postData.startTime}:00`, timeZone } : { date: postData.startDate },
    end: hasTime ? { dateTime: `${postData.endDate}T${postData.endTime}:00`, timeZone } : { date: addDaysISO(postData.endDate, 1) },
    // Los participantes taggeados en el posteo se suman como invitados de
    // verdad del evento (Google les manda la invitación por mail gracias a
    // sendUpdates=all en el fetch, ver syncToCalendar/updateCalendarEvent):
    // no alcanza con que figuren en la descripción como texto.
    attendees: participants.map(p => ({ email:p.email, displayName: p.name && p.name !== p.email ? p.name : undefined })),
  };
}

async function syncToCalendar(postData){
  const token = await ensureCalendarToken();
  if(!token) return { ok:false, reason:"no se pudo autorizar el acceso a Calendar" };
  try{
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?sendUpdates=all`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(buildCalendarEvent(postData)),
    });
    const body = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(body.error?.message || res.statusText);
    return { ok:true, eventId: body.id };
  }catch(err){
    console.error("Error sincronizando con Calendar:", err);
    return { ok:false, reason: err.message };
  }
}

async function updateCalendarEvent(eventId, postData){
  const token = await ensureCalendarToken();
  if(!token) return { ok:false, reason:"no se pudo autorizar el acceso a Calendar" };
  try{
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events/${encodeURIComponent(eventId)}?sendUpdates=all`, {
      method: "PATCH",
      headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(buildCalendarEvent(postData)),
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      // El evento pudo haberse borrado a mano en Calendar: si no existe más, tratarlo como éxito de creación en vez de fallar en silencio.
      if(res.status === 404 || res.status === 410) return syncToCalendar(postData);
      throw new Error(body.error?.message || res.statusText);
    }
    return { ok:true, eventId };
  }catch(err){
    console.error("Error actualizando el evento en Calendar:", err);
    return { ok:false, reason: err.message };
  }
}

async function deleteCalendarEvent(eventId){
  const token = await ensureCalendarToken();
  if(!token) return { ok:false, reason:"no se pudo autorizar el acceso a Calendar" };
  try{
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events/${encodeURIComponent(eventId)}`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if(!res.ok && res.status !== 404 && res.status !== 410){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error?.message || res.statusText);
    }
    return { ok:true };
  }catch(err){
    console.error("Error borrando el evento de Calendar:", err);
    return { ok:false, reason: err.message };
  }
}

// Para posteos que quedaron sin `calendarEventId` guardado (creados antes
// de esta función, o si falló la sincronización original): busca en el
// Calendar un evento que coincida por título exacto y fecha, para poder
// adoptarlo en vez de fallar o crear uno duplicado. Solo lo toma si hay
// UNA sola coincidencia clara — ante cualquier ambigüedad, no adivina.
async function findCalendarEventId(post){
  const token = await ensureCalendarToken();
  if(!token) return null;
  try{
    const timeMin = `${post.startDate}T00:00:00Z`;
    const timeMax = `${addDaysISO(post.endDate || post.startDate, 2)}T00:00:00Z`;
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events` +
      `?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&q=${encodeURIComponent(post.title)}`;
    const res = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
    if(!res.ok) return null;
    const body = await res.json();
    const expectedSummary = `${ACTIVITY_BY_KEY[post.activityType]?.label || "Actividad"}: ${post.title}`;
    const matches = (body.items||[]).filter(ev => ev.summary === expectedSummary && ev.status !== "cancelled");
    return matches.length === 1 ? matches[0].id : null;
  }catch(err){
    console.error("Error buscando el evento existente en Calendar:", err);
    return null;
  }
}

/* ======================================================================
   SINCRONIZACIÓN CALENDAR → APP (Calendar compartido → posteos)
   ======================================================================
   Si alguien edita, cancela/borra o crea un evento directamente en
   Google Calendar (sin pasar por la app), esto lo refleja en los
   posteos de Firestore. Usa el "sync token" que da la API de Calendar
   para pedir solo lo que cambió desde la última vez (se guarda en
   meta/calendarSync), no todo el calendario entero cada vez.

   Se dispara solo: (a) una vez por sesión, apenas cargan los posteos,
   PERO solo si ya hay un token de Calendar en memoria (o sea, sin pedir
   un login-popup extra a alguien que nunca tocó Calendar), y (b) a mano
   con el botón "Actualizar desde Calendar". No hace falta ninguna regla
   nueva de Firestore para posts/replies: quien corre la sincronización
   ya es un usuario aprobado de la app, así que sus escrituras pasan por
   las mismas reglas de siempre.

   Nota: los eventos recurrentes NO se expanden (no se usa singleEvents),
   así que una serie recurrente cuenta como un solo evento/posteo. No es
   el caso de uso de este calendario (cada acción tiene sus propias
   fechas), así que se deja así por simplicidad.
*/

async function getSyncMeta(){
  const snap = await fb.getDoc(fb.doc(db, "meta", "calendarSync"));
  return snap.exists() ? snap.data() : null;
}
async function setSyncMeta(patch){
  await fb.setDoc(fb.doc(db, "meta", "calendarSync"), { ...patch, lastSyncedAt: fb.serverTimestamp() }, { merge:true });
}

// Lee eventos con la clave de API (no el login de nadie) — el calendario
// tiene que estar configurado como público para lectura en Google
// Calendar. Nunca escribe nada: solo se usa para detectar cambios.
async function fetchCalendarChanges(syncToken){
  let pageToken = null, nextSyncToken = null;
  const events = [];
  do{
    const params = new URLSearchParams({ key:CALENDAR_API_KEY, maxResults:"250", showDeleted:"true" });
    if(syncToken) params.set("syncToken", syncToken);
    else params.set("timeMin", new Date(Date.now() - 90*24*60*60*1000).toISOString());
    if(pageToken) params.set("pageToken", pageToken);
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?${params}`);
    if(res.status === 410) return { needsFullResync:true };
    const body = await res.json();
    if(!res.ok) throw new Error(body.error?.message || res.statusText);
    events.push(...(body.items||[]));
    pageToken = body.nextPageToken || null;
    if(body.nextSyncToken) nextSyncToken = body.nextSyncToken;
  }while(pageToken);
  return { events, nextSyncToken };
}

// A partir de un evento de Calendar, calcula startDate/endDate en el
// mismo formato que usa la app (YYYY-MM-DD, fin inclusive). Los eventos
// de "todo el día" que arma esta misma app tienen el fin exclusivo
// (+1 día, ver buildCalendarEvent) así que hay que deshacer eso acá.
function calendarEventDates(ev){
  if(ev.start?.date) return { startDate: ev.start.date, endDate: addDaysISO(ev.end?.date || ev.start.date, -1), startTime:null, endTime:null };
  if(ev.start?.dateTime) return {
    startDate: ev.start.dateTime.slice(0,10), endDate: (ev.end?.dateTime || ev.start.dateTime).slice(0,10),
    startTime: ev.start.dateTime.slice(11,16), endTime: (ev.end?.dateTime || ev.start.dateTime).slice(11,16),
  };
  return { startDate:null, endDate:null, startTime:null, endTime:null };
}

// El "summary" que la app manda a Calendar lleva el prefijo "Tipo: " (ver
// buildCalendarEvent) — para leer el título real hay que sacarlo, si está.
function extractTitleFromSummary(summary, activityType){
  const prefix = `${ACTIVITY_BY_KEY[activityType]?.label || ""}: `;
  const s = summary || "";
  return s.startsWith(prefix) ? s.slice(prefix.length) : s;
}

async function applyCalendarEventToPosts(ev){
  const existing = state.posts.find(p => p.calendarEventId === ev.id);

  if(ev.status === "cancelled"){
    if(existing && !existing.cancelled){
      await updatePostDoc(existing.id, { cancelled:true, lastEditedAt: fb.serverTimestamp(), lastEditedBy:"Google Calendar" });
      await createReply(existing.id, {
        authorName:"Google Calendar", content:"Este evento se canceló o se borró directamente en Google Calendar.",
        system:true, icon:"📅", scopes:[], images:[], links:[],
      });
    }
    return;
  }

  const { startDate, endDate, startTime, endTime } = calendarEventDates(ev);
  if(!startDate) return;
  const location = ev.location || "";

  if(existing){
    const newTitle = extractTitleFromSummary(ev.summary, existing.activityType).trim();
    const titleChanged = !!newTitle && newTitle !== existing.title;
    const timeChanged = (existing.startTime||"") !== (startTime||"") || (existing.endTime||"") !== (endTime||"");
    const changed = existing.startDate !== startDate || existing.endDate !== endDate || timeChanged || (existing.location||"") !== location || titleChanged;
    if(!changed) return;
    const parts = [];
    if(titleChanged) parts.push(`título ("${existing.title}" → "${newTitle}")`);
    if(existing.startDate !== startDate || existing.endDate !== endDate || timeChanged){
      const oldLabel = (existing.endDate||existing.startDate) !== existing.startDate ? `${fmtDate(existing.startDate)}–${fmtDate(existing.endDate)}` : fmtDate(existing.startDate);
      const newLabel = endDate !== startDate ? `${fmtDate(startDate)}–${fmtDate(endDate)}` : fmtDate(startDate);
      parts.push(`fecha (${oldLabel} → ${newLabel})`);
    }
    if((existing.location||"") !== location) parts.push(`lugar${location ? ` (ahora: ${location})` : " (se quitó)"}`);
    const patch = {
      startDate, endDate, date:startDate, startTime, endTime, location,
      lastEditedAt: fb.serverTimestamp(), lastEditedBy:"Google Calendar",
    };
    if(titleChanged) patch.title = newTitle;
    await updatePostDoc(existing.id, patch);
    await createReply(existing.id, {
      authorName:"Google Calendar", content:`Se actualizó desde Google Calendar: ${parts.join(", ")}.`,
      system:true, icon:"📅", scopes:[], images:[], links:[],
    });
    return;
  }

  // Evento nuevo creado directo en Calendar (no vino de la app): se suma
  // como posteo simple, tipo "Otro" y SIN alcance (no "Toda LatAm" —
  // eso sumaría a los 32 países en los conteos de Países/Mapa antes de
  // que alguien lo revise). Queda marcado como "sin definir" en la
  // tarjeta hasta que alguien lo edite y le ponga el lugar real.
  await createPost({
    title: ev.summary || "(Sin título)",
    content: ev.description || "Creado automáticamente desde Google Calendar.",
    startDate, endDate, date:startDate, startTime, endTime,
    organizer: ev.organizer?.displayName || ev.organizer?.email || "",
    location,
    activityType: "otro",
    scopes: [],
    images: [], links: [],
    authorName: "Google Calendar", authorEmail: "",
    calendarEventId: ev.id,
  });
}

// Muestra el aviso como un toast flotante (no ocupa espacio ni empuja el
// contenido) y lo hace desaparecer solo, con un fundido, a los pocos
// segundos (el botón "Cerrar" lo saca al toque). Los de error NO se
// auto-ocultan: hay que poder leerlos con calma y que no desaparezcan
// antes de anotar qué decían. Se maneja por DOM directo (no vía
// state+render) para no depender del ciclo de re-render de la vista, que
// recrearía el elemento en cada tecla tipeada y cortaría la animación.
let calendarNoticeTimer = null;
function showCalendarNotice(notice){
  clearTimeout(calendarNoticeTimer);
  calendarToastTextEl.textContent = `${notice.ok ? "📅" : "⚠️"} ${notice.message}`;
  calendarToastEl.classList.toggle("notice-ok", !!notice.ok);
  calendarToastEl.classList.remove("fading");
  calendarToastEl.hidden = false;
  if(!notice.ok) return;
  calendarNoticeTimer = setTimeout(()=>{
    calendarToastEl.classList.add("fading");
    calendarNoticeTimer = setTimeout(()=>{ calendarToastEl.hidden = true; }, 400);
  }, 4000);
}

let calendarSyncInFlight = false;
async function syncFromCalendar(opts){
  const silent = !!(opts && opts.silent);
  // Lee con la clave de API: no hace falta ningún login ni token de
  // usuario, así que esto nunca dispara un popup de Google.
  if(calendarSyncInFlight) return; // evita superponer sincronizaciones (ej. el intervalo de 30s con una anterior que todavía no terminó)
  calendarSyncInFlight = true;
  if(!silent){ state.calendarSyncing = true; render(); }
  try{
    const meta = await getSyncMeta();
    let result = await fetchCalendarChanges(meta?.syncToken || null);
    if(result.needsFullResync) result = await fetchCalendarChanges(null);
    for(const ev of result.events || []){
      await applyCalendarEventToPosts(ev);
    }
    if(result.nextSyncToken) await setSyncMeta({ syncToken: result.nextSyncToken });
    if(!silent){ showCalendarNotice({ ok:true, message:`Sincronizado con Calendar (${(result.events||[]).length} cambio(s) revisado(s)).` }); }
  }catch(err){
    console.error("Error sincronizando desde Calendar:", err);
    if(!silent){ showCalendarNotice({ ok:false, message:"No se pudo sincronizar con Calendar: " + err.message }); }
  }finally{
    calendarSyncInFlight = false;
    if(!silent){ state.calendarSyncing = false; render(); }
  }
}

// Sincroniza sola cada 30s mientras la app esté abierta y con sesión
// (además del botón manual, que sigue estando). Se arranca una sola vez
// por sesión y se para al cerrar sesión.
let calendarSyncInterval = null;
function startCalendarAutoSync(){
  if(calendarSyncInterval) return;
  syncFromCalendar({ silent:true });
  calendarSyncInterval = setInterval(()=> syncFromCalendar({ silent:true }), 30000);
}
function stopCalendarAutoSync(){
  clearInterval(calendarSyncInterval);
  calendarSyncInterval = null;
}

// Registro de auditoría: eventos de acceso/administración (no de contenido
// de posteos). Como el login es 100% con cuenta de Google, no hay
// "contraseña" que registrar acá — se loguean inicio de sesión, pedidos de
// acceso, aprobar/rechazar/revocar, y compartir/sacar del Calendar. Falla
// en silencio (nunca debe bloquear la acción real que se está auditando).
// Resumen corto de navegador + sistema operativo (ej. "Chrome · Windows",
// "Safari · iPhone") a partir de navigator.userAgent, sin llamar a ningún
// servicio externo — a diferencia de la IP, no suma latencia ni depende
// de un tercero, y para un equipo remoto sin IP fija dice más ("¿esto lo
// hice yo desde el celu, o es raro?") que una dirección casi siempre
// compartida por el router de casa o una VPN corporativa.
function deviceLabel(){
  const ua = navigator.userAgent || "";
  let browser = "Navegador";
  if(/Edg\//.test(ua)) browser = "Edge";
  else if(/OPR\//.test(ua)) browser = "Opera";
  else if(/Firefox\//.test(ua)) browser = "Firefox";
  else if(/Chrome\//.test(ua)) browser = "Chrome";
  else if(/Safari\//.test(ua)) browser = "Safari";
  let os = "";
  if(/iPhone|iPad|iPod/.test(ua)) os = "iOS";
  else if(/Android/.test(ua)) os = "Android";
  else if(/Windows/.test(ua)) os = "Windows";
  else if(/Mac OS X/.test(ua)) os = "Mac";
  else if(/Linux/.test(ua)) os = "Linux";
  return os ? `${browser} · ${os}` : browser;
}
// IP pública de quien hace la acción: como esta app no tiene backend
// propio, no hay forma de leerla del lado del servidor — se le pide a
// un servicio externo gratuito y sin API key (ipify) desde el propio
// navegador. Si falla (sin conexión, el servicio está caído, un
// adblocker lo frena) se resuelve con null y el resto de logAudit sigue
// como si nada: nunca bloquea ni rompe el registro de auditoría.
async function fetchPublicIp(){
  try{
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 3000);
    const res = await fetch("https://api.ipify.org?format=json", { signal: ctrl.signal });
    clearTimeout(timeout);
    if(!res.ok) return null;
    const data = await res.json();
    return data.ip || null;
  }catch(e){ return null; }
}
async function logAudit(type, opts){
  const actorEmail = opts?.actorEmail || state.auth.user?.email;
  const actorName = opts?.actorName || state.auth.user?.displayName;
  if(!actorEmail || !actorName) return;
  try{
    const ip = await fetchPublicIp();
    await fb.addDoc(fb.collection(db,"auditLog"), {
      type, actorEmail, actorName,
      targetEmail: opts?.targetEmail || null,
      detail: opts?.detail || null,
      device: deviceLabel(),
      ip,
      createdAt: fb.serverTimestamp(),
    });
  }catch(err){ console.error("Error escribiendo auditoría:", err); }
}
// Un solo registro de "login" por sesión de navegador (no uno por cada
// re-render/recarga silenciosa de la sesión de Firebase).
let auditLoginLoggedThisSession = false;

let unsubscribeData = null;
let unsubscribeRequests = null;
let unsubAllowlist = null;
let unsubOwnRequest = null;
let unsubAuditLog = null;
let unsubRoster = null;
let unsubTerritoryConfig = null;
let unsubPreferences = null;

function recomputeAuthStatus(){
  if(state.auth.status === "admin") return;
  if(state.auth.allowlisted){ state.auth.status = "approved"; return; }
  state.auth.status = state.auth.requestStatus === "rejected" ? "rejected" : "pending";
}

async function onAuthChanged(user){
  if(unsubscribeData){ unsubscribeData(); unsubscribeData = null; }
  if(unsubscribeRequests){ unsubscribeRequests(); unsubscribeRequests = null; }
  if(unsubAllowlist){ unsubAllowlist(); unsubAllowlist = null; }
  if(unsubOwnRequest){ unsubOwnRequest(); unsubOwnRequest = null; }
  if(unsubAuditLog){ unsubAuditLog(); unsubAuditLog = null; }
  if(unsubRoster){ unsubRoster(); unsubRoster = null; }
  if(unsubTerritoryConfig){ unsubTerritoryConfig(); unsubTerritoryConfig = null; }
  if(unsubPreferences){ unsubPreferences(); unsubPreferences = null; }
  state.posts = []; state.repliesByPost = {}; state.loaded = false; state.accessRequests = []; state.auditLog = []; state.roster = [];
  // Borradores sin publicar (posteo nuevo/edición, Rutina, respuestas) y
  // paneles abiertos son estado de UI en memoria, no de Firestore — sin
  // esto, lo que alguien estaba escribiendo le quedaba visible a la
  // SIGUIENTE persona que iniciara sesión en la misma pestaña (cerrar
  // sesión no recarga la página). Se limpia en CUALQUIER cambio de
  // sesión: cerrar sesión, o pasar de una cuenta a otra.
  composerDraft = newComposerDraft();
  rutinaDraft = newRutinaDraft();
  zonasDraft = null;
  tiposDraft = null;
  calendarDraft = null;
  adjuntosDraft = null;
  state.preferenciasSection = "zonas";
  Object.keys(replyDrafts).forEach(k => delete replyDrafts[k]);
  Object.keys(nestedReplyDrafts).forEach(k => delete nestedReplyDrafts[k]);
  openReplyForms.clear();
  openThreads.clear();
  openNestedReplyForms.clear();
  userMenuOpen = false;
  mentionsMenuOpen = false;
  postModalOverlay.hidden = true;
  state.filters = { text:"", types:new Set(), zones:new Set(), place:null };

  if(!user){
    state.auth = { status:"signedOut", user:null };
    render();
    return;
  }
  const profile = { uid:user.uid, email:user.email, displayName:user.displayName || user.email, photoURL:user.photoURL || "" };
  user.getIdTokenResult().then(tok=>{
    console.log("[diagnóstico] email en user.email:", user.email, "| email en el token (lo que ven las reglas):", tok.claims.email);
  }).catch(()=>{});

  if(!auditLoginLoggedThisSession){
    auditLoginLoggedThisSession = true;
    logAudit("login", { actorEmail: profile.email, actorName: profile.displayName });
  }

  if(profile.email === ADMIN_EMAIL){
    state.auth = { status:"admin", user:profile };
    ensureAdminInRoster(profile);
    subscribeData();
    subscribeAccessRequests();
    subscribeAuditLog();
    subscribeRoster();
    subscribeTerritoryConfig();
    subscribePreferences();
    render();
    return;
  }

  // Mientras se resuelve si está aprobado, no se suscribe a posts/replies
  // (evita un permission-denied transitorio contra Firestore).
  state.auth = { status:"loading", user:profile, allowlisted:false, requestStatus:null };
  render();

  let dataSubscribed = false;
  unsubAllowlist = fb.onSnapshot(fb.doc(db, "allowlist", profile.email), snap=>{
    state.auth.allowlisted = snap.exists();
    recomputeAuthStatus();
    if(state.auth.allowlisted && !dataSubscribed){ dataSubscribed = true; subscribeData(); subscribeRoster(); subscribeTerritoryConfig(); subscribePreferences(); }
    render();
  }, err=>console.error("Error chequeando allowlist:", err));

  const reqRef = fb.doc(db, "accessRequests", profile.email);
  unsubOwnRequest = fb.onSnapshot(reqRef, async snap=>{
    if(!snap.exists()){
      try{
        await fb.setDoc(reqRef, {
          email: profile.email, name: profile.displayName, photoURL: profile.photoURL,
          status: "pending", requestedAt: fb.serverTimestamp(),
        });
        logAudit("access_requested", { actorEmail: profile.email, actorName: profile.displayName });
      }catch(err){ console.error("Error creando solicitud de acceso:", err); }
      return; // el propio setDoc va a disparar un nuevo snapshot con exists()=true
    }
    state.auth.requestStatus = snap.data().status;
    recomputeAuthStatus();
    render();
  }, err=>{
    console.error("Error leyendo solicitud de acceso:", err);
    state.auth.requestStatus = "pending";
    recomputeAuthStatus();
    render();
  });
}

async function requestAccessAgain(){
  const email = state.auth.user.email;
  try{
    await fb.setDoc(fb.doc(db, "accessRequests", email), {
      email, name: state.auth.user.displayName, photoURL: state.auth.user.photoURL,
      status: "pending", requestedAt: fb.serverTimestamp(),
    });
    state.auth = { ...state.auth, status:"pending" };
    logAudit("access_requested", { detail:"pidió de nuevo tras un rechazo" });
    render();
  }catch(err){ console.error(err); }
}

function subscribeAccessRequests(){
  const q = fb.query(fb.collection(db,"accessRequests"), fb.orderBy("requestedAt","desc"));
  unsubscribeRequests = fb.onSnapshot(q, snap=>{
    state.accessRequests = snap.docs.map(d=>({ id:d.id, ...d.data({serverTimestamps:"estimate"}) }));
    render();
  }, err=>console.error("Error leyendo solicitudes:", err));
}
function subscribeAuditLog(){
  const q = fb.query(fb.collection(db,"auditLog"), fb.orderBy("createdAt","desc"));
  unsubAuditLog = fb.onSnapshot(q, snap=>{
    state.auditLog = snap.docs.map(d=>({ id:d.id, ...d.data({serverTimestamps:"estimate"}) }));
    render();
  }, err=>console.error("Error leyendo auditoría:", err));
}
// Lista de nombre/email de todo aprobado, para autocompletar @menciones.
// Cualquier aprobado puede LEER esto (no solo el admin) — ver el cambio
// correspondiente en firestore.rules (allowlist: allow list).
function subscribeRoster(){
  const q = fb.query(fb.collection(db,"allowlist"), fb.orderBy("approvedAt","asc"));
  unsubRoster = fb.onSnapshot(q, snap=>{
    const missingNickname = [];
    state.roster = snap.docs.map(d=>{
      const data = d.data();
      if(!data.nickname) missingNickname.push(d.id);
      return { email: d.id, nickname: data.nickname || nicknameFallback(d.id), photoURL: data.photoURL || null };
    });
    render();
    // Accesos aprobados de ANTES de que existiera "nickname" no lo tienen
    // guardado — el admin (único que puede leer accessRequests de
    // cualquiera) lo completa solo, una vez, con el nombre real de Google
    // en vez del feo fallback armado desde el email.
    if(isAdmin() && missingNickname.length) backfillNicknames(missingNickname);
  }, err=>console.error("Error leyendo el equipo:", err));
}
async function backfillNicknames(emails){
  const existingNicknames = new Set(state.roster.map(u=>u.nickname).filter(Boolean));
  for(const email of emails){
    try{
      const reqSnap = await fb.getDoc(fb.doc(db, "accessRequests", email));
      const name = (reqSnap.exists() && reqSnap.data().name) || email;
      const nickname = makeNickname(name, existingNicknames);
      existingNicknames.add(nickname);
      await fb.updateDoc(fb.doc(db, "allowlist", email), { name, nickname });
    }catch(err){ console.error("No se pudo completar el nickname de " + email + ":", err); }
  }
}
// Config de zonas/países editable por el admin (ver renderZonasView): si
// existe meta/territoryConfig, reemplaza los defaults hardcodeados de
// ZONES/COUNTRIES[].zone. Se leen para TODOS los aprobados (no solo el

function subscribeTerritoryConfig(){

// Se MUTAN los mismos objetos/arrays (ZONES, cada país, ZONE_COUNTRIES,
// PLACE_INDEX) en vez de reasignar las const: todo el resto del código ya
// guarda referencias directas a ellos (ZONES[key], COUNTRY_BY_NAME, los
// filtros de zona, el mapa) y reasignar los dejaría mirando la versión
// vieja. Sin doc todavía (nadie guardó nunca desde el panel), no hace
// nada y quedan los defaults de siempre.
function applyTerritoryConfig(cfg){
  if(!cfg || !cfg.zones) return;
  Object.keys(ZONES).forEach(k=>delete ZONES[k]);
  Object.entries(cfg.zones).forEach(([key,z])=>{ ZONES[key] = { key, label:z.label, color:z.color }; });
  COUNTRIES.forEach(c=>{
    const zone = (cfg.countryZones||{})[c.name];
    if(zone && ZONES[zone]) c.zone = zone;
  });
  Object.keys(ZONE_COUNTRIES).forEach(k=>delete ZONE_COUNTRIES[k]);
  Object.keys(ZONES).forEach(k=>{ ZONE_COUNTRIES[k] = []; });
  COUNTRIES.forEach(c=>{ (ZONE_COUNTRIES[c.zone] = ZONE_COUNTRIES[c.zone] || []).push(c.name); });
  PLACE_INDEX.length = 0;
  PLACE_INDEX.push(...buildPlaceIndex());

// Se mutan EVENTO_TYPES/ACTIVITY_TYPES/ACTIVITY_BY_KEY/CALENDAR_SYNC_TYPES
// en el lugar (mismo motivo que ZONES/COUNTRIES): todo el resto del
// código ya los referencia directo por nombre.
function applyActivityTypesConfig(types){
  if(!types || !types.length) return;
  EVENTO_TYPES.length = 0;
  types.forEach(t=>{ EVENTO_TYPES.push({ key:t.key, label:t.label, icon:t.icon }); });

  ACTIVITY_TYPES.forEach(t=>{ ACTIVITY_BY_KEY[t.key] = t; });
  CALENDAR_SYNC_TYPES.clear();
  types.forEach(t=>{ if(t.calendarSync) CALENDAR_SYNC_TYPES.add(t.key); });
}
// Espejo de lo último leído de Firestore (no de CITY_PRESETS, que ya
// incluye tanto lo hardcodeado como lo promovido): hace falta para poder
// sumar una ciudad más sin perder las que ya se habían promovido antes.
let extraCitiesConfig = {};
function applyExtraCitiesConfig(extraCities){
  extraCitiesConfig = extraCities || {};
  Object.entries(extraCitiesConfig).forEach(([country, cities])=>{
    const presets = CITY_PRESETS[country] || (CITY_PRESETS[country] = []);
    (cities||[]).forEach(name=>{
      if(!presets.some(p=>normalize(p.name)===normalize(name))) presets.push({ name, coord:null });
    });
  });
  PLACE_INDEX.length = 0;
  PLACE_INDEX.push(...buildPlaceIndex());
}
async function promoteCustomCity(country, city){
  const next = {};
  Object.keys(extraCitiesConfig).forEach(k=>{ next[k] = [...extraCitiesConfig[k]]; });
  if(!next[country]) next[country] = [];
  if(!next[country].some(n=>normalize(n)===normalize(city))) next[country].push(city);
  await fb.setDoc(fb.doc(db,"meta","preferences"), { extraCities: next }, { merge:true });
}
function applyCalendarIdConfig(calendarId){
  if(calendarId) CALENDAR_ID = calendarId;
}
function applyAttachmentLimitsConfig(cfg){
  if(!cfg) return;
  if(cfg.maxImages) MAX_IMAGES = Math.min(HARD_MAX_IMAGES, Math.max(1, cfg.maxImages));
  if(cfg.maxAttachmentFiles) MAX_ATTACHMENT_FILES = Math.min(HARD_MAX_ATTACHMENT_FILES, Math.max(1, cfg.maxAttachmentFiles));
  if(cfg.maxAttachmentFileBytes) MAX_ATTACHMENT_FILE_BYTES = Math.max(1024, cfg.maxAttachmentFileBytes);
}

// Primera "palabra" usable de un nombre o de un email (si no es un
// nombre real, se recorta antes del @ y se separan puntos/guiones) —
// para "Ari Krengel" da "Ari"; para "cursoslatam.argentina@gmail.com"
// da "Cursoslatam" en vez de "Cursoslatam.argentina@gmail.com".
function firstWordFrom(text){
  const base = (text||"").includes("@") && !(text||"").includes(" ") ? text.split("@")[0] : text;
  const cleaned = (base||"").replace(/[._-]+/g, " ").trim();
  const first = cleaned.split(/\s+/)[0] || "Usuario";
  return first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
}
// Los que ya estaban aprobados de antes de que existiera "nickname" no
// tienen ese campo en su documento — se les arma uno de reserva a partir
// del email, solo para mostrar mientras backfillNicknames() no corrió
// (no se guarda en ningún lado desde acá).
function nicknameFallback(email){
  return firstWordFrom(email);
}
// Arma un @nickname corto a partir del nombre de Google, evitando
// choques con los que ya existen (ej. dos "Benny" en el equipo).
function makeNickname(displayName, existingNicknames){
  const parts = (displayName||"").trim().split(/\s+/).filter(Boolean);
  const base = firstWordFrom(parts[0] || displayName);
  if(!existingNicknames.has(base)) return base;
  const lastInitial = parts.length > 1 ? parts[1].charAt(0).toUpperCase() : "";
  if(lastInitial && !existingNicknames.has(base + lastInitial)) return base + lastInitial;
  let n = 2;
  while(existingNicknames.has(base + n)) n++;
  return base + n;
}
// El admin no pasa por accessRequests/allowlist para tener acceso (su
// permiso viene de ADMIN_EMAIL hardcodeado en las reglas), así que sin
// esto NUNCA aparecía en state.roster (que sale de la colección
// allowlist) — nadie podía etiquetarlo con @ aunque estuviera bien
// aprobado de hecho. Se asegura, una vez por login, de que también
// tenga su propio documento en allowlist con nickname, como cualquier
// otro aprobado (no cambia nada de cómo se calculan sus permisos).
async function ensureAdminInRoster(profile){
  try{
    const ref = fb.doc(db, "allowlist", profile.email);
    const snap = await fb.getDoc(ref);
    if(snap.exists() && snap.data().nickname) return;
    const rosterSnap = await fb.getDocs(fb.collection(db,"allowlist"));
    const existingNicknames = new Set(rosterSnap.docs.map(d=>d.data().nickname).filter(Boolean));
    const nickname = makeNickname(profile.displayName, existingNicknames);
    await fb.setDoc(ref, {
      email: profile.email, name: profile.displayName, nickname, photoURL: profile.photoURL || null,
      approvedAt: (snap.exists() && snap.data().approvedAt) || fb.serverTimestamp(),
      approvedBy: profile.email,
    }, { merge: true });
  }catch(err){ console.error("No se pudo sumar al admin al equipo (roster de @menciones):", err); }
}
async function approveRequest(email){
  const reqSnap = await fb.getDoc(fb.doc(db, "accessRequests", email));
  const reqData = reqSnap.exists() ? reqSnap.data() : {};
  const name = reqData.name || email;
  const rosterSnap = await fb.getDocs(fb.collection(db,"allowlist"));
  const existingNicknames = new Set(rosterSnap.docs.map(d=>d.data().nickname).filter(Boolean));
  const nickname = makeNickname(name, existingNicknames);
  await fb.setDoc(fb.doc(db, "allowlist", email), {

    approvedAt: fb.serverTimestamp(), approvedBy: ADMIN_EMAIL,
  });

// Las respuestas se escuchan posteo por posteo (subcolección normal),
// nunca con una consulta collectionGroup — ver el comentario grande en
// firestore.rules sobre por qué (esas consultas dan "Missing or
// insufficient permissions" en este proyecto sin importar la regla).
let repliesUnsubs = {}; // postId -> función para dejar de escuchar
function syncReplyListeners(){
  const currentIds = new Set(state.posts.map(p=>p.id));
  Object.keys(repliesUnsubs).forEach(postId=>{
    if(!currentIds.has(postId)){
      repliesUnsubs[postId]();
      delete repliesUnsubs[postId];
      delete state.repliesByPost[postId];
    }
  });
  currentIds.forEach(postId=>{
    if(repliesUnsubs[postId]) return;
    const repliesQ = fb.query(fb.collection(db,"posts",postId,"replies"), fb.orderBy("createdAt","asc"));
    repliesUnsubs[postId] = fb.onSnapshot(repliesQ, snap=>{
      state.repliesByPost[postId] = snap.docs.map(d=>({ id:d.id, postId, ...d.data({serverTimestamps:"estimate"}) }));
      render();
    }, err=>console.error(`Error leyendo respuestas de ${postId}:`, err));
  });
}

function subscribeData(){
  const postsQ = fb.query(fb.collection(db,"posts"), fb.orderBy("date","desc"));
  const unsubPosts = fb.onSnapshot(postsQ, snap=>{
    state.posts = snap.docs.map(d=>({ id:d.id, ...d.data({serverTimestamps:"estimate"}) }));
    state.loaded = true;
    syncReplyListeners();
    render();
    startCalendarAutoSync();
  }, err=>{
    console.error("Error leyendo posts:", err);
    renderFatalError("Error leyendo los posteos desde Firestore: " + err.message);
  });

  unsubscribeData = ()=>{
    unsubPosts();
    Object.values(repliesUnsubs).forEach(fn=>fn());
    repliesUnsubs = {};
    state.repliesByPost = {};
  };
}

function participantsLabel(participants){
  return (participants||[]).map(p=>p.name||p.email).join(", ");
}

// Compara el posteo original con los datos nuevos y arma un resumen en
// español para dejarlo como respuesta automática en el hilo.
function buildEditSummary(original, next){
  const parts = [];
  if(original.title !== next.title) parts.push(`título ("${original.title}" → "${next.title}")`);
  const oldStart = original.startDate, oldEnd = original.endDate || oldStart;
  const timeChanged = (original.startTime||"") !== (next.startTime||"") || (original.endTime||"") !== (next.endTime||"");
  if(oldStart !== next.startDate || oldEnd !== next.endDate || timeChanged){
    const oldLabel = oldEnd !== oldStart ? `${fmtDate(oldStart)}–${fmtDate(oldEnd)}` : fmtDate(oldStart);
    const newLabel = next.endDate !== next.startDate ? `${fmtDate(next.startDate)}–${fmtDate(next.endDate)}` : fmtDate(next.startDate);
    parts.push(`fecha (${oldLabel} → ${newLabel})`);
  }
  const oldParticipants = participantsLabel(original.participants) || (original.organizer||"");
  const newParticipants = participantsLabel(next.participants);
  if(oldParticipants !== newParticipants) parts.push(`participantes${newParticipants ? ` (ahora: ${newParticipants})` : " (se quitaron)"}`);
  if(original.activityType !== next.activityType) parts.push(`tipo de actividad (${ACTIVITY_BY_KEY[original.activityType]?.label} → ${ACTIVITY_BY_KEY[next.activityType]?.label})`);
  if(original.content !== next.content) parts.push("comentarios");
  if(JSON.stringify(original.scopes||[]) !== JSON.stringify(next.scopes||[])) parts.push("lugar");
  if(!parts.length) return null;
  return `✏️ ${state.auth.user.displayName} editó este posteo: ${parts.join(", ")}.`;
}

// Actualiza el posteo, deja constancia en el hilo, y mantiene el mismo
// evento de Calendar en vez de duplicarlo (lo crea si antes no existía,
// lo actualiza si ya existía, o lo borra si dejó de ser un tipo que
// sincroniza).
async function updatePostAndSync(postId, original, newData){
  const patch = {
    title:newData.title, content:newData.content, startDate:newData.startDate, endDate:newData.endDate,
    date:newData.startDate, startTime:newData.startTime||null, endTime:newData.endTime||null,
    participants:newData.participants,
    activityType:newData.activityType, scopes:newData.scopes, images:newData.images, links:newData.links,
    lastEditedAt: fb.serverTimestamp(), lastEditedBy: state.auth.user.displayName,
  };
  await updatePostDoc(postId, patch);

  const summary = buildEditSummary(original, newData);
  if(summary){
    await createReply(postId, {
      authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
      content: summary, system:true, icon:"✏️", scopes:[], images:[], links:[],
    });
  }

  const willSync = CALENDAR_SYNC_TYPES.has(newData.activityType);
  let eventId = original.calendarEventId;
  if(!eventId && CALENDAR_SYNC_TYPES.has(original.activityType)){
    // Posteo viejo sin el vínculo guardado: buscar el evento existente por
    // título/fecha originales antes de resignarse o crear uno duplicado.
    eventId = await findCalendarEventId(original);
    if(eventId) await updatePostDoc(postId, { calendarEventId: eventId }).catch(()=>{});
  }

  let calResult = { ok:true };
  if(eventId && willSync){
    calResult = await updateCalendarEvent(eventId, newData);
    if(calResult.ok && calResult.eventId !== eventId){
      await updatePostDoc(postId, { calendarEventId: calResult.eventId }).catch(()=>{});
    }
  } else if(eventId && !willSync){
    calResult = await deleteCalendarEvent(eventId);
    if(calResult.ok) await updatePostDoc(postId, { calendarEventId: null }).catch(()=>{});
  } else if(!eventId && willSync){
    calResult = await syncToCalendar(newData);
    if(calResult.ok && calResult.eventId) await updatePostDoc(postId, { calendarEventId: calResult.eventId }).catch(()=>{});
  }
  return calResult;
}

async function cancelPost(post){
  if(!confirm(`¿Cancelar "${post.title}"? Queda marcado como cancelado (no se borra) y se avisa en el hilo.`)) return;
  try{
    await updatePostDoc(post.id, { cancelled:true, lastEditedAt: fb.serverTimestamp(), lastEditedBy: state.auth.user.displayName });
    await createReply(post.id, {
      authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
      content: `🚫 ${state.auth.user.displayName} canceló este evento.`, system:true, icon:"🚫",
      scopes:[], images:[], links:[],
    });
    let eventId = post.calendarEventId;
    if(!eventId && CALENDAR_SYNC_TYPES.has(post.activityType)){
      eventId = await findCalendarEventId(post);
      if(eventId) await updatePostDoc(post.id, { calendarEventId: eventId }).catch(()=>{});
    }
    let calResult;
    if(eventId){
      calResult = await deleteCalendarEvent(eventId);
    } else if(CALENDAR_SYNC_TYPES.has(post.activityType)){
      calResult = { ok:false, reason:"no se encontró un evento de Calendar que coincida (puede que ya se haya borrado a mano, o el título cambió demasiado) — revisalo a mano si hace falta" };
    } else {
      calResult = { ok:true }; // nunca había sincronizado (era Rutina), no hay nada que borrar
    }
    showCalendarNotice(calResult.ok
      ? { ok:true, message:`Se canceló "${post.title}".` }
      : { ok:false, message:`Se canceló "${post.title}" en la app, pero no se pudo sacar del Calendar (${calResult.reason}).` });
  }catch(err){
    console.error(err);
    alert("No se pudo cancelar: " + err.message);
  }
}

// Textareas marcadas con la clase "autogrow" (por ahora, la de Rutina)
// crecen solas con el contenido en vez de quedar en una caja chica fija
// con scroll interno — se recalcula en cada tecleo (ver el input handler)
// y también acá, porque cada render() reconstruye el elemento de cero
// (innerHTML) y pierde cualquier alto que se le haya puesto a mano.
//
// Leer scrollHeight fuerza un reflow sincrónico de TODA la página (no
// solo de este elemento) — si se hace directo en cada tecla, con un
// Feed largo esto se sentía como que la caja "se trababa" y dejaba de
// responder al escribir rápido o mantener apretada una tecla. Se
// posterga al próximo frame (y se cancela el anterior si todavía no
// corrió) para que el navegador nunca acumule más de un reflow pendiente
// por elemento, sin importar cuántas teclas entren de golpe.
const autoGrowFrames = new WeakMap();
function autoGrowTextarea(el){
  if(!el) return;
  const pending = autoGrowFrames.get(el);
  if(pending) cancelAnimationFrame(pending);
  const frame = requestAnimationFrame(()=>{
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
    autoGrowFrames.delete(el);
  });
  autoGrowFrames.set(el, frame);
}

function render(){
  const active = document.activeElement;
  const focusId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  doRender();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el && el !== active){
      el.focus();
      if(selStart != null) try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
  document.querySelectorAll("textarea.autogrow").forEach(autoGrowTextarea);
}

function doRender(){
  document.querySelectorAll("#tabs button[data-view]").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === state.view);
  });

  let html = "";
  if(CONFIG_IS_PLACEHOLDER){
    tabsNav.classList.add("tabs-hidden"); btnNewPostEl.hidden = true; btnSyncCalendarEl.hidden = true; userBadgeEl.innerHTML = ""; mentionsBellEl.innerHTML = "";
    html += `<div class="setup-banner">
      ⚠️ <strong>Falta configurar Firebase.</strong> Esta app todavía no tiene datos compartidos
      porque <code>FIREBASE_CONFIG</code> tiene valores de ejemplo. Abrí <code>index.html</code>,
      completá la configuración con los datos de tu proyecto de Firebase y volvé a publicar el
      archivo. Instrucciones paso a paso en <code>README.md</code>.
    </div>`;
    viewRoot.innerHTML = html;
    return;
  }

  if(fatalError){
    html += `<div class="setup-banner">⚠️ ${esc(fatalError)}</div>`;
  }

  renderUserBadge();
  renderMentionsBell();

  if(!isAuthorized()){
    tabsNav.classList.add("tabs-hidden"); btnNewPostEl.hidden = true; btnSyncCalendarEl.hidden = true;
    html += renderAuthGate();
    viewRoot.innerHTML = html;
    return;
  }

  tabsNav.classList.remove("tabs-hidden");
  btnNewPostEl.hidden = false;
  btnSyncCalendarEl.hidden = false;
  btnSyncCalendarEl.disabled = state.calendarSyncing === true;
  tabSolicitudesEl.hidden = !isAdmin();
  tabAuditoriaEl.hidden = !isAdmin();
  tabPreferenciasEl.hidden = !isAdmin();
  const pendingCount = state.accessRequests.filter(r=>r.status==="pending").length;
  document.getElementById("pendingBadge").innerHTML = (isAdmin() && pendingCount) ? `<span class="pending-count">${pendingCount}</span>` : "";
  if(!isAdmin() && (state.view === "solicitudes" || state.view === "auditoria" || state.view === "preferencias")) state.view = "feed";

  if(!fatalError && !state.loaded){
    html += `<div class="empty-state"><div class="big">⏳</div>Cargando registro compartido…</div>`;
    viewRoot.innerHTML = html;
    return;
  }

  if(state.view === "feed") html += renderFeedView();
  else if(state.view === "paises") html += renderPaisesView();
  else if(state.view === "memoria") html += renderMemoriaView();
  else if(state.view === "solicitudes") html += renderSolicitudesView();
  else if(state.view === "auditoria") html += renderAuditoriaView();
  else if(state.view === "preferencias") html += renderPreferenciasView();

  viewRoot.innerHTML = html;
  afterRenderView();

  if(postModalOverlay && !postModalOverlay.hidden) renderComposer();
}

/* ======================================================================
   ACTIVIDAD / registro de auditoría (panel admin, pestaña "Actividad")
   — accesos y cambios administrativos (quién entró, a quién se aprobó/
   rechazó/revocó, a quién se compartió el Calendar). No es un registro
   de los posteos ni su contenido.
   ====================================================================== */
const AUDIT_LABELS = {
  login: { icon:"🔓", filterLabel:"Login", text: e => `${e.actorName} inició sesión.` },
  access_requested: { icon:"📝", filterLabel:"Pidió acceso", text: e => `${e.actorName} pidió acceso${e.detail ? ` (${e.detail})` : ""}.` },
  access_approved: { icon:"✅", filterLabel:"Aprobó", text: e => `${e.actorName} aprobó el acceso de ${e.targetEmail}.` },
  access_rejected: { icon:"🚫", filterLabel:"Rechazó", text: e => `${e.actorName} rechazó el acceso de ${e.targetEmail}.` },
  access_revoked: { icon:"⛔", filterLabel:"Revocó", text: e => `${e.actorName} revocó el acceso de ${e.targetEmail}.` },
  calendar_shared: { icon:"📅", filterLabel:"Compartió Calendar", text: e => `${e.actorName} compartió el Calendar con ${e.targetEmail}.` },
  calendar_unshared: { icon:"📅", filterLabel:"Sacó del Calendar", text: e => `${e.actorName} sacó a ${e.targetEmail} del Calendar.` },
};
// Paginado de a 30 (ver botón "Ver más" más abajo) en vez de mostrar toda
// la lista de una — con meses de uso esto puede ser larguísimo. Vive
// afuera de `state` a propósito, como openReplyForms/userMenuOpen: es
// puro estado de UI efímero (se resetea solo al recargar la página).
let auditVisibleCount = 30;
// Orden de la tabla (click en un header, ver renderAuditColumnsHeader):
// bien simple, un solo criterio a la vez. Por defecto más nuevo primero,
// que es como ya venían las entradas desde Firestore.
let auditSort = { key: "date", dir: "desc" };
function auditSortValue(e, key){
  if(key === "date") return tsToMillis(e.createdAt) || 0;
  if(key === "device") return normalize(e.device);
  if(key === "ip") return normalize(e.ip);
  if(key === "action"){
    const info = AUDIT_LABELS[e.type];
    return normalize(info ? info.text(e) : e.type);
  }
  return "";
}
function sortAuditEntries(list){
  const { key, dir } = auditSort;
  const sign = dir === "asc" ? 1 : -1;
  return [...list].sort((a,b)=>{
    const va = auditSortValue(a,key), vb = auditSortValue(b,key);
    if(va < vb) return -1 * sign;
    if(va > vb) return 1 * sign;
    return 0;
  });
}
function auditSortArrow(key){
  return auditSort.key === key ? (auditSort.dir === "asc" ? " ▲" : " ▼") : "";
}
// Chips de tipo + buscador por persona (ver state.auditFilters): igual
// que en el Feed, "sin nada tildado" = mostrar todos los tipos.
function matchesAuditFilters(e){
  const f = state.auditFilters;
  if(f.types.size && !f.types.has(e.type)) return false;
  if(f.text){
    const n = normalize(f.text);
    const haystack = normalize(`${e.actorName||""} ${e.actorEmail||""} ${e.targetEmail||""}`);
    if(!haystack.includes(n)) return false;
  }
  return true;
}
function renderAuditFilters(){
  const f = state.auditFilters;
  const anyFilter = f.text || f.types.size;
  return `
    <div class="audit-filters">
      <input type="text" id="auditSearch" placeholder="Buscar por persona (nombre o email)..." value="${esc(f.text)}">
      <div class="chipgroup">
        ${Object.entries(AUDIT_LABELS).map(([key,info])=>`
          <button type="button" class="chip-toggle${f.types.has(key)?" active":""}" data-action="audit-toggle-type" data-key="${key}">${info.icon} ${info.filterLabel}</button>`).join("")}
        ${anyFilter ? `<button type="button" class="filter-clear" data-action="audit-clear-filters">Limpiar filtros</button>` : ""}
      </div>
    </div>`;
}
function renderAuditColumnsHeader(){
  return `<div class="audit-columns-header">
      <span></span>
      <button type="button" class="ach-sort ach-action" data-action="audit-sort" data-key="action">Acción${auditSortArrow("action")}</button>
      <button type="button" class="ach-sort ach-device" data-action="audit-sort" data-key="device">Dispositivo${auditSortArrow("device")}</button>
      <button type="button" class="ach-sort ach-ip" data-action="audit-sort" data-key="ip">IP${auditSortArrow("ip")}</button>
      <button type="button" class="ach-sort ach-date" data-action="audit-sort" data-key="date">Fecha${auditSortArrow("date")}</button>
    </div>`;
}
function renderAuditoriaView(){
  const entries = state.auditLog;
  if(!entries.length) return `<div class="empty-state"><div class="big">🗂️</div>Todavía no hay actividad registrada.</div>`;
  const filtered = sortAuditEntries(entries.filter(matchesAuditFilters));
  const visible = filtered.slice(0, auditVisibleCount);
  const remaining = filtered.length - visible.length;
  const list = !filtered.length
    ? `<div class="empty-state"><div class="big">🔎</div>Ningún registro coincide con el filtro.</div>`
    : `${renderAuditColumnsHeader()}<div class="audit-list">${visible.map(e=>{
        const info = AUDIT_LABELS[e.type] || { icon:"•", text: e2 => `${e2.actorName}: ${e2.type}` };
        return `<div class="audit-row">
          <span class="audit-icon">${info.icon}</span>
          <div class="audit-text">${esc(info.text(e))}</div>
          <span class="audit-device">${esc(e.device || "")}</span>
          <span class="audit-ip">${esc(e.ip || "")}</span>
          <span class="audit-date">${fmtDateTime(e.createdAt)}</span>
        </div>`;
      }).join("")}</div>
      ${remaining > 0 ? `<div class="audit-more"><button type="button" class="btn-secondary" data-action="audit-load-more">Ver ${Math.min(30, remaining)} más (quedan ${remaining})</button></div>` : ""}`;
  return renderAuditFilters() + list;
}

function newZonasDraft(){

}

// Clave estable (sin tildes/espacios) para un item nuevo (zona o tipo de
// actividad), sin chocar con las que ya existen — ej. "Caribe" ->
// "caribe", y si ya existiera, "caribe2".
function slugifyKey(label, existingKeys){
  const base = normalize(label).replace(/[^a-z0-9]+/g,"") || "item";
  let key = base, i = 2;
  while(existingKeys.includes(key)){ key = base + i; i++; }
  return key;
}
function renderZonasSection(){
  const d = getZonasDraft();

        // en que se cargó originalmente.
        const countries = Object.keys(d.countryZones)
          .filter(name=>d.countryZones[name]===key)
          .sort((a,b)=>a.localeCompare(b,"es"));
        return `<div class="zone-section">

          </div>
        </div>`;
      }).join("")}
      <div class="zone-add-row">

        <button type="button" class="btn-mini" data-action="zonas-add-zone">+ Agregar zona</button>

/* ----- Preferencias: sección "Lugares" -----
   Ciudades que el equipo fue escribiendo a mano (ver getPlaceMatches,
   "Usar ... (lugar nuevo)") y todavía no están en la lista oficial
   CITY_PRESETS — acá se revisan y, si corresponde, se suman como
   sugerencia del buscador para todo el mundo. */
function getCustomCityUsage(){
  const usage = {};
  const scan = scopes => (scopes||[]).forEach(sc=>{
    if(sc.type !== "ciudad") return;
    const presets = CITY_PRESETS[sc.country] || [];
    if(presets.some(p=>normalize(p.name)===normalize(sc.city))) return;
    const key = sc.country + "|||" + sc.city;
    if(!usage[key]) usage[key] = { country:sc.country, city:sc.city, count:0 };
    usage[key].count++;
  });
  state.posts.forEach(p=>{
    scan(p.scopes);
    (state.repliesByPost[p.id]||[]).forEach(r=>scan(r.scopes));
  });
  return Object.values(usage).sort((a,b)=> b.count - a.count);
}
function renderLugaresSection(){
  const items = getCustomCityUsage();
  return `
      <div class="hint" style="margin-bottom:16px;">
        Ciudades que el equipo fue cargando y todavía no están en la lista oficial. Sumarlas acá hace que aparezcan como

      </div>
      ${!items.length ? `<div class="empty-state"><div class="big">📍</div>No hay ciudades nuevas pendientes de revisar.</div>` : `

}

}
function placeFilterLabel(place){
  if(place.kind==="zone") return `Región ${ZONES[place.zone].label}`;
  if(place.kind==="country") return place.country;
  if(place.kind==="city") return `${place.city}, ${place.country}`;
  return "";
}

function matchesTextFilter(text, record){
  if(!text) return true;
  const n = normalize(text);
  return normalize(record.title||"").includes(n) ||
    normalize(record.content||"").includes(n) ||
    normalize(record.authorName||"").includes(n) ||
    normalize(participantsLabel(record.participants) || record.organizer||"").includes(n) ||
    normalize(record.location||"").includes(n);
}
function matchesPlaceOrZoneFilter(record){
  const f = state.filters;
  const scopes = record.scopes || [];
  if(f.zones.size && !scopes.some(sc=>zoneOfScope(sc) && f.zones.has(zoneOfScope(sc)))) return false;
  if(f.place){
    const ok = scopes.some(sc=>{
      if(f.place.kind==="zone") return scopeAffectsZone(sc, f.place.zone);
      if(f.place.kind==="country") return scopeAffectsCountry(sc, f.place.country);
      if(f.place.kind==="city") return scopeAffectsCity(sc, f.place.country, f.place.city);
      return false;
    });
    if(!ok) return false;
  }
  return true;
}

// Devuelve los posts visibles según filtros, cada uno con sus replies ordenadas
function getVisiblePosts(){
  const f = state.filters;
  return state.posts
    .filter(p=> !f.types.size || f.types.has(p.activityType))
    .filter(p=>{
      const replies = state.repliesByPost[p.id] || [];
      const postMatchesText = matchesTextFilter(f.text, p) || replies.some(r=>matchesTextFilter(f.text, r));
      if(!postMatchesText) return false;
      if(!f.zones.size && !f.place) return true;
      const postMatchesPZ = matchesPlaceOrZoneFilter(p) || replies.some(r=>matchesPlaceOrZoneFilter(r));
      return postMatchesPZ;
    })
    .map(p=>({ post:p, replies: state.repliesByPost[p.id] || [] }));
}

// Orden del Feed (a pedido): 1) lo recién publicado siempre primero,
// 2) hasta 2 "destacados" (comentarios + me gusta, solo si es reciente,
// para que un posteo viejo con mucho engagement no vuelva a subir),
// 3) el resto como ya estaba, por fecha. Esto es SOLO para el Feed —
// Memoria sigue usando getVisiblePosts() tal cual, con su propio orden
// cronológico controlable por el usuario.
const FEED_FEATURED_WINDOW_MS = 7 * 24 * 60 * 60 * 1000;
const FEED_FEATURED_MAX = 2;
function computeFeedOrder(items){
  if(items.length <= 1) return items.map(it=>({ ...it, featured:false }));
  const mostRecent = items.reduce((a,b)=> tsToMillis(b.post.createdAt) > tsToMillis(a.post.createdAt) ? b : a);
  const pool = items.filter(it=>it.post.id !== mostRecent.post.id);
  const now = Date.now();
  const featured = pool
    .map(it=>({
      it,
      score: it.replies.length + (it.post.likedBy||[]).length + it.replies.reduce((s,r)=>s + ((r.likedBy||[]).length), 0),
      age: now - tsToMillis(it.post.createdAt),
    }))
    .filter(x=> x.score > 0 && x.age <= FEED_FEATURED_WINDOW_MS)
    .sort((a,b)=> b.score - a.score)
    .slice(0, FEED_FEATURED_MAX)
    .map(x=>x.it);
  const featuredIds = new Set(featured.map(it=>it.post.id));
  const rest = pool.filter(it=>!featuredIds.has(it.post.id));
  return [
    { ...mostRecent, featured:false },
    ...featured.map(it=>({ ...it, featured:true })),
    ...rest.map(it=>({ ...it, featured:false })),
  ];
}
function renderFeedView(){
  const items = computeFeedOrder(getVisiblePosts());
  return `
    ${renderRutinaComposer()}
    ${renderFilterBar("feed")}
    ${items.length ? items.map(({post,replies,featured})=>renderPostCard(post,replies,featured)).join("") :
      `<div class="empty-state"><div class="big">🗒️</div>Todavía no hay posteos${anyActiveFilter()?" que coincidan con el filtro":""}.<br>Usá "+ Nuevo evento" para sumar el primero.</div>`}
  `;
}
function anyActiveFilter(){
  const f = state.filters;
  return !!(f.text || f.types.size || f.zones.size || f.place);
}

async function submitRutina(){
  const d = rutinaDraft;
  d.error = "";
  const content = d.content.trim();
  if(!content){ d.error = "Escribí algo antes de publicar."; render(); return; }
  const links = d.links.filter(l=>safeUrl(l.url));
  const today = new Date().toISOString().slice(0,10);
  // title/fechas no tienen sentido para una rutina, pero el esquema de
  // posts los pide siempre — se completan solos y no se muestran en la
  // tarjeta (ver renderPostCard) para no repetir el contenido dos veces.
  const title = content.length > 140 ? content.slice(0,137).trimEnd() + "…" : content;
  const postData = {
    title, content, startDate:today, endDate:today, date:today,
    location:"",
    activityType:"rutina", scopes:d.scopes,
    images:d.images, links, files:d.files, mentions:extractMentionsFromContent(content),
    authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
  };
  try{
    await createPost(postData);
    rutinaDraft = newRutinaDraft();
    render();
  }catch(err){
    console.error(err);
    d.error = "No se pudo publicar: " + err.message;
    render();
  }
}

/* ======================================================================
   AGREGACIÓN POR LUGAR (posts + alcance sumado desde respuestas)
   ====================================================================== */
function computePlaceCounts(){
  const byCountry = {};
  COUNTRIES.forEach(c=>{ byCountry[c.name] = { total:0, general:0, cities:{} }; });
  function ingest(scopes){
    (scopes||[]).forEach(sc=>{
      if(sc.type==="pais" && byCountry[sc.country]){
        byCountry[sc.country].total++; byCountry[sc.country].general++;
      } else if(sc.type==="ciudad" && byCountry[sc.country]){
        const city = titleCase(sc.city);
        byCountry[sc.country].total++;
        byCountry[sc.country].cities[city] = (byCountry[sc.country].cities[city]||0)+1;
      } else if(sc.type==="region" && ZONE_COUNTRIES[sc.region]){
        ZONE_COUNTRIES[sc.region].forEach(name=>{ byCountry[name].total++; byCountry[name].general++; });
      } else if(sc.type==="todo"){
        COUNTRIES.forEach(c=>{ byCountry[c.name].total++; byCountry[c.name].general++; });
      }
    });
  }
  state.posts.forEach(p=>{
    ingest(p.scopes);
    (state.repliesByPost[p.id]||[]).forEach(r=>ingest(r.scopes));
  });
  return byCountry;
}

  return state.paisesZoneFilter.size ? COUNTRIES.filter(c=>state.paisesZoneFilter.has(c.zone)) : COUNTRIES;

function renderPaisesView(){
  const sub = state.paisesSubview;
  const toggle = `
    <div class="subview-toggle">
      <button data-action="paises-subview" data-key="lista" class="${sub==="lista"?"active":""}">Lista</button>
      <button data-action="paises-subview" data-key="mapa" class="${sub==="mapa"?"active":""}">Mapa</button>
    </div>`;
  if(CONFIG_IS_PLACEHOLDER) return toggle + `<div class="empty-state">Configurá Firebase para ver datos.</div>`;

  const counts = computePlaceCounts();
  const toolbar = `<div class="paises-toolbar">${toggle}${renderZoneLegend()}</div>`;
  if(sub === "mapa"){
    return `${toolbar}<div id="map"></div>`;
  }
  if(state.countryDrill && byCountryExists(state.countryDrill)){
    return toolbar + renderCountryDrill(state.countryDrill, counts[state.countryDrill]);
  }
  const sorted = visiblePaisesCountries().slice().sort((a,b)=> counts[b.name].total - counts[a.name].total || a.name.localeCompare(b.name));
  const cards = sorted.map(c=>{
    const cnt = counts[c.name].total;
    return `<div class="country-card" style="border-left-color:${ZONES[c.zone].color}" data-action="drill-country" data-country="${esc(c.name)}">

    </div>`;
  }).join("");
  return `${toolbar}<div class="country-grid">${cards}</div>`;
}
function byCountryExists(name){ return !!COUNTRY_BY_NAME[name]; }

function renderCountryDrill(countryName, data){
  const rows = [];
  if(data.general){
    rows.push({ label:"General / todo el país", count:data.general, city:null });
  }
  Object.entries(data.cities).sort((a,b)=>b[1]-a[1]).forEach(([city,count])=>{
    rows.push({ label:city, count, city });
  });
  const rowsHtml = rows.length ? rows.map(r=>`
      <div class="city-row" data-action="${r.city?"goto-city":"goto-country"}" data-country="${esc(countryName)}" ${r.city?`data-city="${esc(r.city)}"`:""}>

        <span class="ccount">${r.count}</span>

    `<div class="empty-state">Todavía no hay registros para ${esc(countryName)}.</div>`;
  return `

const MAP_MARKER_SIZE = 40; // diámetro fijo, en px, de TODOS los círculos de país (no varía con la cantidad)

function initOrUpdateMap(){
  if(state.leafletMap){ state.leafletMap.remove(); state.leafletMap = null; }
  const mapEl = document.getElementById("map");
  if(!mapEl || !window.L) return;
  const map = L.map("map", { scrollWheelZoom:false }).setView([-15, -65], 3);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 12,
  }).addTo(map);

  // Agrupa países cercanos en un solo círculo "cluster" cuando el zoom
  // está alejado (evita el amasijo de círculos superpuestos con muchos
  // países vecinos, como toda Centroamérica junta); al acercar el zoom
  // se van separando en sus círculos individuales. El cluster toma el
  // color de la zona (Sur/Central/Norte) más común entre los países que
  // agrupa, en vez de un color propio — son los mismos 3 colores de
  // siempre, nunca uno nuevo.
  const clusterGroup = window.L.markerClusterGroup({
    maxClusterRadius: 50,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    iconCreateFunction: cluster => {
      const zoneCounts = {};
      cluster.getAllChildMarkers().forEach(m=>{ zoneCounts[m.zoneKey] = (zoneCounts[m.zoneKey]||0) + 1; });
      const topZone = Object.keys(zoneCounts).reduce((a,b)=> zoneCounts[b] > (zoneCounts[a]||0) ? b : a, null);
      const color = topZone ? ZONES[topZone].color : "var(--petroleo)";
      return L.divIcon({
        html: `<div class="map-cluster" style="background:${color}">${cluster.getChildCount()}</div>`,
        className: "map-cluster-wrap",
        iconSize: [MAP_MARKER_SIZE, MAP_MARKER_SIZE],
      });
    },
  });

  const counts = computePlaceCounts();
  const visibleCountries = visiblePaisesCountries();
  visibleCountries.forEach(c=>{
    const cnt = counts[c.name].total;
    const color = ZONES[c.zone].color;
    const marker = L.marker(c.coord, {
      icon: L.divIcon({
        html: `<div class="map-country-marker" style="background:${color};opacity:${cnt>0 ? 0.9 : 0.45}">${cnt}</div>`,
        className: "map-country-marker-wrap",
        iconSize: [MAP_MARKER_SIZE, MAP_MARKER_SIZE],
      }),
    });
    marker.zoneKey = c.zone;
    const topCities = Object.entries(counts[c.name].cities).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const popupHtml = `<div class="map-popup"><b>${esc(c.name)} — ${cnt} registro${cnt===1?"":"s"}</b>
      ${topCities.map(([city,n])=>`<div class="pop-city"><span>${esc(city)}</span><span>${n}</span></div>`).join("")}
      <button class="btn-mini" data-action="goto-country" data-country="${esc(c.name)}">Ver memoria →</button></div>`;
    marker.bindPopup(popupHtml);
    clusterGroup.addLayer(marker);
  });
  map.addLayer(clusterGroup);

  if(state.paisesZoneFilter.size && visibleCountries.length){
    map.fitBounds(visibleCountries.map(c=>c.coord), { padding:[30,30] });
  }
  state.leafletMap = map;
}

          <div class="img-preview"><img src="${src}"><button type="button" class="rm" data-action="post-rm-image" data-idx="${i}">✕</button></div>`).join("")}</div>` : ""}

      ` : `
        <button type="button" class="btn-text-add" data-action="toggle-post-attach">📎 Agregar imagen, PDF/audio o link</button>
      `}
    </div>
    ${d.error ? `<div class="form-error">${esc(d.error)}</div>` : ""}
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="cCancel">Cancelar</button>
      <button type="submit" class="btn-primary">${d.editingPost ? "Guardar cambios" : "Publicar"}</button>
    </div>
  `;
}

function getDraftFor(scope, ownerId){
  if(scope==="post") return composerDraft;
  if(scope==="rutina") return rutinaDraft;
  if(scope==="nested-reply") return getNestedReplyDraft(ownerId);
  return getReplyDraft(ownerId);
}

function commitScope(scope, ownerId){
  const draft = getDraftFor(scope, ownerId);
  const sd = draft.scopeDraft;
  let newScope = null;
  if(sd.type === "todo"){
    newScope = { type:"todo" };
  } else if(sd.type === "region"){
    newScope = { type:"region", region: sd.region };
  } else if(sd.type === "pais"){
    if(!sd.country){ draft.scopeError = "Elegí un país."; render(); return; }
    newScope = { type:"pais", country: sd.country };
  } else {
    if(!sd.country || !sd.city.trim()){ draft.scopeError = "Elegí un país y escribí una ciudad."; render(); return; }
    const fromPreset = CITY_PRESETS[sd.country] && !sd.cityUseCustom;
    newScope = { type:"ciudad", country: sd.country, city: fromPreset ? sd.city.trim() : titleCase(sd.city) };
  }
  draft.scopes.push(newScope);
  draft.scopeDraft = newScopeDraft();
  draft.scopeError = "";
  render();
}
