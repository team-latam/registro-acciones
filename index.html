<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Acciones — Team LatAm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<!-- Google Identity Services: solo para renovar el token de Calendar en
     segundo plano sin popup visible (ver requestSilentCalendarToken en el
     script principal) — el login en sí sigue siendo 100% Firebase Auth. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --petroleo:#0d3b3e;
    --petroleo-dark:#082a2c;
    --celeste:#4fc7e0;
    --celeste-dark:#1a9fb8;
    --bg:#f4f8f8;
    --card:#ffffff;
    --text:#0d2a2c;
    --text-muted:#5c7a7c;
    --border:#e1edee;
    --sur:#2563eb;
    --central:#eab308;
    --norte:#16a34a;
    --danger:#dc2626;
    --shadow: 0 6px 24px rgba(13,59,62,0.08);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Si el navegador necesita hacer scroll solo (ej. para mantener a la
     vista el cursor mientras crece el textarea de Rutina), que lo haga
     suave en vez de un salto brusco de golpe. */
  html{scroll-behavior:smooth;}
  body{
    font-family:'Montserrat',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; }
  a{ color:var(--celeste-dark); }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Header ---------- */
  header.topbar{
    background:linear-gradient(135deg, var(--petroleo), var(--petroleo-dark));
    color:#fff;
    padding:18px 20px 0 20px;
    position:sticky; top:0; z-index:40;
    box-shadow:0 4px 18px rgba(0,0,0,0.15);
  }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1200px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{ font-size:26px; }
  .brand h1{ font-size:17px; margin:0; font-weight:800; letter-spacing:0.2px; }
  .brand .sub{ font-size:11px; color:#bfe9ef; font-weight:500; }
  .btn-new{
    background:var(--celeste); color:var(--petroleo-dark); border:none;
    padding:10px 18px; border-radius:999px; font-weight:700; font-size:13.5px;
    cursor:pointer; box-shadow:0 4px 12px rgba(79,199,224,0.4);
    white-space:nowrap;
  }
  .btn-new:hover{ background:var(--celeste-dark); color:#fff; }
  .btn-sync{ background:rgba(255,255,255,0.14); color:#fff; border:none; padding:9px 16px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .btn-sync:hover{ background:rgba(255,255,255,0.24); }
  .btn-sync:disabled{ opacity:0.5; cursor:not-allowed; }
  .header-actions{ display:flex; align-items:center; gap:10px; }

  /* Avatar circular en el header: al apretarlo despliega un menú tipo
     Google con nombre/email y cerrar sesión, en vez de mostrar el email
     entero pegado al lado del botón todo el tiempo. */
  .user-badge{ position:relative; }
  .avatar-btn{
    position:relative; width:36px; height:36px; padding:0; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    flex-shrink:0; transition:border-color .15s;
  }
  .avatar-btn:hover, .avatar-btn.open{ border-color:#fff; }
  .avatar-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-btn .avatar-fallback-badge{ color:#fff; font-weight:800; font-size:14px; }

  .user-menu{
    position:absolute; top:calc(100% + 12px); right:0; width:250px;
    background:var(--card); color:var(--text); border-radius:var(--radius-md);
    box-shadow:0 14px 36px rgba(8,42,44,0.28); padding:18px 16px 14px;
    text-align:center; z-index:60;
  }
  .user-menu::before{
    content:""; position:absolute; top:-6px; right:13px; width:12px; height:12px;
    background:var(--card); transform:rotate(45deg); border-radius:2px;
  }
  .user-menu .um-avatar, .user-menu .um-avatar-fallback{
    width:60px; height:60px; border-radius:50%; margin:0 auto 10px; display:flex;
    align-items:center; justify-content:center; object-fit:cover;
  }
  .user-menu .um-avatar-fallback{ background:var(--petroleo); color:#fff; font-weight:800; font-size:22px; }
  .user-menu .um-name{ font-size:14.5px; font-weight:700; color:var(--petroleo-dark); line-height:1.3; }
  .user-menu .um-role{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.3px; text-transform:uppercase;
    padding:2px 10px; border-radius:999px; margin:5px 0 2px;
  }
  .user-menu .um-role.role-admin{ background:var(--petroleo); color:#fff; }
  .user-menu .um-role.role-member{ background:var(--bg); color:var(--text-muted); border:1px solid var(--border); }
  .user-menu .um-role.role-pending{ background:#fff7e6; color:#6b4c00; }
  .user-menu .um-role.role-rejected{ background:#fee2e2; color:#991b1b; }
  .user-menu .um-email{ font-size:12px; color:var(--text-muted); margin:6px 0 14px; word-break:break-all; }
  .user-menu .um-signout{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--petroleo-dark);
    padding:9px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .user-menu .um-signout:hover{ background:#eaf3f3; }
  #tabSolicitudes .pending-count{ background:var(--danger); color:#fff; border-radius:999px; font-size:10.5px; font-weight:800; padding:1px 6px; margin-left:6px; }

  /* ---------- Auth gate (login / pendiente / rechazado) ---------- */
  .auth-gate{ max-width:440px; margin:60px auto; text-align:center; }
  .auth-gate .big{ font-size:44px; margin-bottom:14px; }
  .auth-gate h2{ margin:0 0 8px 0; color:var(--petroleo); font-size:19px; }
  .auth-gate p{ color:var(--text-muted); font-size:13.5px; line-height:1.6; margin:0 0 20px 0; }
  .btn-google{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:#3c4043; border:1.5px solid var(--border);
    padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:var(--shadow);
  }
  .btn-google:hover{ border-color:var(--celeste); }

  /* ---------- Solicitudes (admin) ---------- */
  .request-row{
    display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--border);
    border-radius:var(--radius-md); padding:14px 18px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .request-row img{ width:40px; height:40px; border-radius:50%; flex:none; }
  .avatar-fallback{
    width:40px; height:40px; border-radius:50%; flex:none; background:var(--petroleo); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
  }
  .request-row .rinfo{ flex:1; min-width:0; }
  .request-row .rname{ font-weight:700; font-size:14px; }
  .request-row .remail{ font-size:12px; color:var(--text-muted); margin-top:1px; }
  .request-row .ractions{ display:flex; align-items:center; gap:4px; flex:none; }
  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:999px; margin-right:6px;
  }
  .status-pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .status-pill.approved{ background:#dcfce7; color:#166534; }
  .status-pill.rejected{ background:#fee2e2; color:#991b1b; }
  .btn-ghost{ background:none; border:none; padding:9px 14px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--petroleo); white-space:nowrap; }
  .btn-ghost:hover{ background:#eef4f4; }
  .btn-ghost.danger{ color:var(--danger); }
  .btn-ghost.danger:hover{ background:#fdeceb; }
  .ractions-sep{ width:1px; height:20px; background:var(--border); margin:0 6px; }

  /* ---------- Actividad / registro de auditoría (admin) ---------- */
  /* Tabla de verdad con CSS Grid: las 4 columnas (Acción/Dispositivo/IP/
     Fecha) se reparten TODO el ancho de la tarjeta en proporción (2fr/1fr/
     1fr/1fr) en vez de ser anchos fijos angostos pegados contra el borde
     derecho — así Dispositivo e IP quedan hacia la mitad de la fila, con
     aire entre columnas, no apretados contra Fecha. El mismo
     grid-template-columns en el header y en cada fila es lo que hace que
     encabezado y datos queden alineados verticalmente como columnas.
     display:none en mobile (ver media query) saca Dispositivo/IP del
     flujo del grid entero, así que ahí queda otro grid-template-columns
     más corto (3 en vez de 5) para que lo que sigue visible no se
     desalinee. */
  .audit-list{ background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow); }
  .audit-columns-header, .audit-row{
    display:grid; grid-template-columns: 26px minmax(220px,2fr) 1fr 1fr 1fr;
    align-items:center; gap:12px;
  }
  .audit-columns-header{ padding:0 18px 8px; }
  .audit-row{ padding:11px 18px; }
  .audit-row + .audit-row{ border-top:1px solid var(--border); }
  .audit-icon{ font-size:16px; }
  .audit-text{ font-size:13px; min-width:0; }
  .audit-device, .audit-ip{
    font-size:11.5px; color:var(--text-muted); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .audit-date{ font-size:11.5px; color:var(--text-muted); text-align:right; white-space:nowrap; }
  /* Encabezados-botón (ordenan al click, ver sortAuditEntries): mismo
     look que el texto de columna que tenían antes, sin pinta de botón. */
  .ach-sort{
    background:none; border:none; padding:0; margin:0; font:inherit; cursor:pointer; text-align:left; min-width:0;
    font-size:10.5px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase; color:var(--text-muted);
  }
  .ach-sort:hover{ color:var(--petroleo); }
  .ach-date{ text-align:right; }
  .audit-more{ text-align:center; margin-top:14px; }
  .audit-filters{ margin-bottom:14px; }
  .audit-filters input{
    width:100%; box-sizing:border-box; padding:9px 14px; border-radius:999px; border:1.5px solid var(--border);
    font-size:13px; background:#fff; margin-bottom:10px;
  }
  @media (max-width:760px){
    .audit-columns-header, .audit-row{ grid-template-columns: 22px minmax(140px,1fr) 1fr; }
    .audit-device, .audit-ip, .ach-device, .ach-ip{ display:none; }
  }

  /* ---------- Zonas (panel admin) ----------
     Versión compacta (v2): las zonas van en una lista angosta de una sola
     línea cada una (sin tarjeta propia) y los países en una grilla de
     varias columnas en vez de una fila entera por país — con 43 países
     una lista de una sola columna ocupaba una pantalla entera de alto. */
  /* Mismo ancho que el resto de las pestañas (Solicitudes, Actividad,
     etc.) — usa los 1200px de "main" sin achicarse. La grilla de países
     de Zonas es auto-fill (ver .zone-countries) así que se acomoda sola
     a lo ancho que le toque, sin quedar desproporcionada. */
  /* Zonas v3: cada zona es una sección apilada de ancho completo (no
     columnas lado a lado, eso se probó y no gustó — ver charla) con una
     cabecera de color y sus países debajo en filas grandes, en vez de
     una lista aparte de países con selects sueltos. */
  .zone-section{ border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); background:#fff; }
  .zone-section + .zone-section{ margin-top:14px; }
  .zone-bar{ display:flex; align-items:center; gap:12px; padding:14px 18px; }
  .zone-swatch{
    width:20px; height:20px; border-radius:6px; flex:none; cursor:pointer; display:block;
    position:relative; overflow:hidden;
  }
  .zone-swatch:hover{ box-shadow:0 0 0 3px rgba(0,0,0,0.08); }
  .zone-swatch input[type=color]{ position:absolute; inset:0; width:100%; height:100%; padding:0; border:none; cursor:pointer; opacity:0; }
  .zone-name{
    font-size:16px; font-weight:800; color:var(--petroleo-dark); border:none; background:transparent;
    font-family:inherit; padding:2px 0; border-bottom:1.5px solid transparent; flex:1; min-width:0;
  }
  .zone-name:hover, .zone-name:focus{ outline:none; border-bottom-color:var(--border); }
  .zone-rm{
    width:24px; height:24px; border-radius:50%; border:none; background:transparent; color:var(--text-muted);
    font-size:13px; cursor:pointer; flex:none; line-height:24px; text-align:center; padding:0;
  }
  .zone-rm:hover:not(:disabled){ background:#fdeceb; color:var(--danger); }
  .zone-rm:disabled{ opacity:0.25; cursor:not-allowed; }
  .zone-countries{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); border-top:1px solid var(--border); }
  .zone-countries:empty{ display:none; }
  .country-row{ display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--border); border-right:1px solid var(--border); }
  .country-name{ flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .country-row select{
    border:1.5px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit;
    font-size:12px; font-weight:700; border-radius:999px; padding:6px 12px; cursor:pointer; flex:none;
  }
  @media (max-width:520px){ .zone-countries{ grid-template-columns:1fr; } .country-row{ border-right:none; } }
  /* Filas de configuración genéricas (ícono + texto + control), usadas
     hoy en Adjuntos — mismo lenguaje visual que .zone-section/.country-row
     en vez de labels sueltos arriba de inputs. */
  .settings-card{ background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
  .setting-row{ display:flex; align-items:center; gap:14px; padding:14px 18px; flex-wrap:wrap; }
  .setting-row + .setting-row{ border-top:1px solid var(--border); }
  .setting-icon{ font-size:19px; flex:none; width:26px; text-align:center; }
  .setting-text{ flex:1 1 180px; min-width:0; }
  .setting-label{ font-size:14px; font-weight:700; color:var(--petroleo-dark); }
  .setting-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  /* Ancho fijo común: sin esto, la caja con unidad (KB) quedaba más
     ancha que las otras dos (el input + el sufijo "KB" suman más que
     un input solo) — con .setting-control-unit compartiendo la misma
     clase .setting-control, las tres cajas de Adjuntos miden lo mismo. */
  .setting-control{ flex:none; display:flex; align-items:center; gap:6px; width:96px; }
  .setting-control input[type=number]{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px;
    font-weight:700; text-align:center; background:var(--bg); font-family:inherit;
  }
  /* La fila con unidad (KB) se ve como UNA caja, no un input + texto
     suelto al lado — mismo alto/borde/ancho que las otras dos filas de
     Adjuntos, con la unidad adentro a modo de sufijo. */
  .setting-control-unit{
    border:1.5px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); gap:0;
  }
  .setting-control-unit input[type=number]{
    flex:1; width:auto; min-width:0; border:none; border-radius:0; background:transparent; padding:8px 4px 8px 10px; text-align:right;
  }
  .setting-unit{
    flex:none; font-size:12px; font-weight:700; color:var(--text-muted); padding:8px 10px 8px 4px;
  }
  .pref-subnav{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .tipo-icon-input{
    width:38px; flex:none; border:1px solid var(--border); border-radius:6px; padding:3px 4px;
    font-size:15px; text-align:center; background:#fff;
  }
  /* Fila de Tipos con grilla de 3 columnas (ícono | nombre | bloque de la
     derecha) en vez de flexbox: con flex, el input del nombre (flex:1)
     se comía el espacio sobrante distinto en cada fila según cuánto
     texto tuviera el contador de posteos al lado ("0 posteos" vs "42
     posteos"), y el checkbox terminaba arrancando en un x distinto por
     fila — nada quedaba alineado. Con columnas fijas, la 3ra columna
     (checkbox+Calendar+contador+borrar, ver .tipo-meta) siempre mide lo
     mismo, así que arranca exactamente en el mismo lugar en toda fila. */
  .tipo-sync-toggle{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-muted); width:72px; white-space:nowrap; cursor:pointer; }
  .zone-edit-list{
    display:flex; flex-direction:column; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden;
  }
  .zone-edit-row{ display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:8px; padding:8px; background:#fff; }
  .zone-edit-row + .zone-edit-row{ border-top:1px solid var(--border); }
  .zone-edit-row:hover{ background:#f8fbfb; }
  .zone-edit-row input[type=color]{ width:20px; height:20px; padding:0; border:none; border-radius:5px; cursor:pointer; }
  .zone-label-input{
    min-width:0; border:1px solid transparent; border-radius:6px; padding:3px 6px; font-size:13px;
    font-weight:600; background:transparent;
  }
  .zone-label-input:hover, .zone-label-input:focus{ border-color:var(--border); background:#fff; outline:none; }
  .zone-count{ font-size:11px; color:var(--text-muted); flex:none; white-space:nowrap; }
  .tipo-meta{ display:flex; align-items:center; gap:10px; justify-self:end; }
  .tipo-meta .zone-count{ width:66px; text-align:right; }
  @media (max-width:420px){
    .zone-edit-row{ grid-template-columns:38px 1fr; }
    .tipo-meta{ grid-column:1 / -1; justify-self:stretch; justify-content:flex-start; }
  }
  .zone-edit-row .rm{
    width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; border:none;
    font-size:10px; cursor:pointer; line-height:18px; text-align:center; padding:0; flex-shrink:0;
  }
  .zone-edit-row .rm:disabled{ background:var(--border); color:var(--text-muted); cursor:not-allowed; }
  .zone-add-row{ display:flex; gap:8px; margin-top:6px; }
  .zone-add-row input{ flex:1; border:1.5px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; }
  .country-zone-list{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:var(--radius-sm);
    overflow:hidden; max-height:400px; overflow-y:auto;
  }
  .country-zone-row{ display:flex; align-items:center; gap:8px; background:#fff; padding:7px 10px; }
  .country-zone-row .zdot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .cz-name{ flex:1; min-width:0; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .country-zone-row select{
    flex:none; width:100px; border:1px solid var(--border); border-radius:6px; padding:4px 5px; font-size:11.5px; background:#fbfdfd;
  }
  nav.tabs{ max-width:1200px; margin:14px auto 0 auto; display:flex; gap:4px; }
  nav.tabs.tabs-hidden{ visibility:hidden; pointer-events:none; }
  nav.tabs button{
    background:transparent; border:none; color:#bfe9ef; padding:10px 16px;
    font-weight:700; font-size:13.5px; cursor:pointer; border-bottom:3px solid transparent;
    border-radius:8px 8px 0 0;
  }
  nav.tabs button.active{ color:#fff; border-bottom-color:var(--celeste); background:rgba(255,255,255,0.06); }

  main{ flex:1; max-width:1200px; width:100%; margin:0 auto; padding:18px 16px 80px 16px; }

  /* ---------- Setup banner ---------- */
  .setup-banner{
    background:#fff7e6; border:1px solid #f3d78b; color:#6b4c00;
    border-radius:var(--radius-md); padding:16px 18px; margin-bottom:16px; font-size:13.5px; line-height:1.5;
  }
  .setup-banner code{ background:#f3e6c4; padding:1px 6px; border-radius:5px; }
  /* Flota encima del contenido (no empuja nada) y se desvanece sola. */
  .calendar-notice{
    position:fixed; left:50%; bottom:24px; z-index:70; max-width:min(560px, calc(100vw - 32px));
    transform:translate(-50%, 0); background:#fff7e6; border:1px solid #f3d78b; color:#6b4c00;
    border-radius:var(--radius-md); padding:14px 18px; font-size:13.5px; line-height:1.5;
    box-shadow:0 8px 28px rgba(0,0,0,0.18);
    transition:opacity 0.4s ease, transform 0.4s ease; opacity:1;
  }
  .calendar-notice.notice-ok{ background:#dcfce7; border-color:#86efac; color:#166534; }
  .calendar-notice.fading{ opacity:0; transform:translate(-50%, 8px); }
  .calendar-notice[hidden]{ display:none; }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    padding:18px; margin-bottom:16px; border:1px solid var(--border);
  }

  /* ---------- Filter bar ---------- */
  .filterbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .filterbar input[type=text]{
    flex:1 1 220px; padding:11px 14px; border-radius:999px; border:1.5px solid var(--border);
    font-size:13.5px; background:#fff;
  }
  .chip-toggle{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px;
    border:1.5px solid var(--border); background:#fff; font-size:12.5px; font-weight:600;
    cursor:pointer; color:var(--text-muted); user-select:none;
  }
  .chip-toggle.active{ background:var(--petroleo); color:#fff; border-color:var(--petroleo); }
  .chip-toggle .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chipgroup{ display:flex; flex-wrap:wrap; gap:6px; }
  .filter-clear{ background:none; border:none; color:var(--text-muted); font-size:12px; text-decoration:underline; cursor:pointer; }

  /* ---------- Scope chips ---------- */
  .scope-chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px;
    font-size:11.5px; font-weight:700; background:#eef6f6; color:var(--petroleo); border:1px solid var(--border);
  }
  .scope-chip .zdot{ width:8px; height:8px; border-radius:50%; }
  .scope-chip.removable{ padding-right:6px; }
  .scope-chip .rm{ cursor:pointer; font-weight:800; opacity:0.6; margin-left:2px; }
  .scope-chip .rm:hover{ opacity:1; }

  /* ---------- Participantes (chip-input, ver renderParticipantsField) ---------- */
  .participants-field{ flex:1; min-width:0; position:relative; }
  .participants-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .participant-chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px;
    font-size:11.5px; font-weight:700; background:rgba(79,199,224,0.16); color:var(--celeste-dark); border:1px solid var(--border);
  }
  .participant-chip .rm{ cursor:pointer; font-weight:800; opacity:0.6; margin-left:2px; }
  .participant-chip .rm:hover{ opacity:1; }
  .participant-chip-avatar{ width:16px; height:16px; border-radius:50%; object-fit:cover; flex-shrink:0; }

  .type-badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    font-size:11px; font-weight:700; background:var(--petroleo); color:#fff;
  }
  /* Insignia de posteo "destacado" en el Feed (ver computeFeedOrder):
     mismo pill que type-badge, con el celeste de la app en vez del
     petroleo por defecto para que resalte sin salirse de la paleta. */
  .type-badge.featured-badge{ background:var(--celeste); color:var(--petroleo-dark); }

  /* ---------- Post card ---------- */
  .post{ transition:background-color .8s ease; }
  .post.mention-highlight{ background:#fff3cd; }
  .post-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .post-meta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .post-date{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .post-author{ font-size:12.5px; font-weight:700; color:var(--petroleo); }
  .post-content{ font-size:14.5px; line-height:1.55; white-space:pre-wrap; margin:8px 0 10px 0; }
  .post-scopes{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .post-links{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .post-links a{ font-size:12.5px; font-weight:600; }
  .post-images{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .post-images img{
    width:92px; height:92px; object-fit:cover; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid var(--border);
  }
  .post-actions{ display:flex; gap:14px; font-size:12.5px; }
  .post-actions button{
    background:none; border:none; color:var(--text-muted); font-weight:700; cursor:pointer; padding:4px 0;
  }
  .post-actions button:hover{ color:var(--celeste-dark); }
  .post-actions button.liked{ color:var(--celeste-dark); }

  .thread{ margin-top:12px; padding-left:16px; border-left:3px solid var(--border); display:flex; flex-direction:column; gap:12px; }
  .reply{ background:#f8fbfb; border-radius:var(--radius-md); padding:12px 14px; }
  .reply-system{ background:#fdf9ee; border:1px dashed #ecdcae; }
  .post-cancelled{ opacity:0.85; }
  .reply-head{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .reply-author{ font-size:12.5px; font-weight:700; color:var(--petroleo); }
  .reply-date{ font-size:11px; color:var(--text-muted); }
  .reply-content{ font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .reply-scopes{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .reply-images{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .reply-images img{ width:70px; height:70px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--border); }
  .reply-links{ margin-top:6px; display:flex; flex-direction:column; gap:2px; }
  .reply-links a{ font-size:12px; }
  .reply-actions{ display:flex; gap:14px; margin-top:8px; }
  .reply-actions button{ background:none; border:none; padding:0; font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer; }
  .reply-actions button:hover{ color:var(--petroleo); }
  .reply-actions button.liked{ color:var(--celeste-dark); }
  .reply-children{ margin-top:10px; margin-left:18px; padding-left:12px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .reply-nested-form{ margin-top:8px; }
  .reply-nested-form textarea{ width:100%; min-height:60px; padding:8px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--border); font-size:13px; font-family:inherit; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state .big{ font-size:36px; margin-bottom:10px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,30,31,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:24px 12px; z-index:100; overflow-y:auto;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:#fff; border-radius:var(--radius-lg); width:100%; max-width:640px; padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); margin:auto 0;
    /* Altura tope: que el modal no siga creciendo con cada campo nuevo
       (Tipo de actividad, Adjuntos, error, botones) — a partir de acá
       scrollea SOLO el formulario, con el título siempre visible arriba. */
    max-height:min(720px, 88vh); display:flex; flex-direction:column;
  }
  .modal h2{ margin:0 0 14px 0; font-size:18px; color:var(--petroleo); flex:none; }
  .modal .close{
    position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted);
  }
  .modal-wrap{ position:relative; }
  #postForm{ overflow-y:auto; flex:1; min-height:0; padding-right:4px; margin-right:-4px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px; }
  .field input[type=text], .field input[type=date], .field textarea, .field select, .field input[type=url]{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1.5px solid var(--border); font-size:14px; background:#fbfdfd;
  }
  .field textarea{ min-height:90px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  /* Composer de Evento inspirado en Google Calendar (no un calco): título
     grande sin caja + filas con icono a la izquierda (🕐 cuándo, 📍 dónde,
     👥 participantes) en vez de todo agrupado en cajas ".field" iguales. */
  .field-title-plain{ margin-bottom:6px; }
  /* Especificidad reforzada a propósito: ".field input[type=text]" (más
     arriba) también matchea este input por estar dentro de un .field, y
     sin esto ganaba esa regla de caja gris en vez de la línea simple de
     abajo estilo Calendar. */
  .field.field-title-plain input.title-input-plain{
    width:100%; border:none; border-bottom:1.5px solid var(--border); background:transparent;
    padding:8px 2px; font-size:20px; font-weight:700; color:var(--petroleo-dark);
  }
  .field.field-title-plain input.title-input-plain:focus{ outline:none; border-bottom-color:var(--celeste); }
  .field-icon-row{ display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .field-icon{ flex:none; width:20px; text-align:center; font-size:15px; line-height:2.2; color:var(--text-muted); }
  .field-icon-body{ flex:1; min-width:0; }
  .field-icon-input{
    flex:1; min-width:0; padding:10px 12px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    font-size:14px; background:#fbfdfd;
  }
  .allday-toggle{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; cursor:pointer; }
  .dt-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .dt-row:last-child{ margin-bottom:0; }
  .dt-row input[type=date], .dt-row input[type=time]{
    flex:1; min-width:0; padding:9px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    font-size:13.5px; background:#fbfdfd;
  }
  .dt-sep{ color:var(--text-muted); font-size:13px; flex:none; }
  /* El buscador de lugar (mismo que Rutina) metido adentro de una fila
     con ícono: sin el margin-top de ".place-picker" (pensado para ir
     debajo de otra cosa), acá es el único contenido de la fila. */
  .place-picker-inline{ margin-top:0; }
  @media (max-width:480px){ .field-icon-row{ gap:8px; } .field-icon{ width:16px; font-size:13px; } }

  .type-picker{ display:flex; flex-wrap:wrap; gap:8px; }
  .type-picker label{ display:inline-flex; }
  .type-opt{ display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; border:1.5px solid var(--border); cursor:pointer; font-size:12.5px; font-weight:600; }
  .type-opt input{ display:none; }
  .type-opt.checked{ background:var(--petroleo); color:#fff; border-color:var(--petroleo); }

  .scope-builder{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:12px; }
  .scope-builder-add{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .scope-builder-add.has-extra{ grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:520px){ .scope-builder-add, .scope-builder-add.has-extra{ grid-template-columns:1fr; } }
  .scope-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .btn-mini{ background:var(--celeste); color:var(--petroleo-dark); border:none; padding:9px 14px; border-radius:var(--radius-sm); font-weight:700; font-size:12.5px; cursor:pointer; }
  .btn-mini:hover{ background:var(--celeste-dark); color:#fff; }

  /* Composer de Rutina, arriba del Feed, estilo "¿Qué está pasando?" de X:
     avatar + texto libre + adjuntos + publicar, mucho más liviano que el
     modal de Evento (sin título, fechas, organiza ni dónde). */
  .quick-composer-row{ display:flex; gap:12px; align-items:flex-start; }
  .qc-avatar{ width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0; display:block; }
  .qc-avatar.qc-avatar-fallback{ display:flex; align-items:center; justify-content:center; background:var(--petroleo); color:#fff; font-weight:800; font-size:15px; }
  .quick-composer textarea{
    /* El textarea está adentro de .mention-anchor (para poder ubicar el
       desplegable de @menciones justo debajo), así que ya NO es hijo
       directo del flex de .quick-composer-row — flex:1 no hace nada ahí,
       hace falta width:100% para que ocupe todo el .mention-anchor
       (que sí es el que tiene flex:1). Sin esto quedaba con el ancho
       por default del navegador (~175px) y el texto se cortaba a los
       pocos caracteres aunque la tarjeta fuera bien ancha. */
    width:100%; border:none; resize:none; overflow-y:auto; font-family:inherit; font-size:15px; line-height:1.4;
    padding:8px 0; min-height:44px; max-height:180px; background:transparent;
    transition:height .12s ease-out;
  }
  .quick-composer textarea:focus{ outline:none; }
  .quick-composer .btn-new:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; }

  .attach-toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label.btn-attach, button.btn-attach{
    display:inline-flex; align-items:center; gap:6px; background:#eef4f4; color:var(--text);
    border:none; padding:11px 18px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer;
    text-transform:none; letter-spacing:normal; margin-bottom:0;
  }
  .btn-attach:hover{ background:#e2eded; }
  .attach-panel{ margin-top:10px; }
  .reply-form-footer{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .attach-row{
    display:flex; gap:8px; align-items:center; margin-bottom:6px;
    background:#f8fbfb; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px;
  }
  .attach-row input{ flex:1; border:1.5px solid var(--border); border-radius:8px; padding:7px 9px; font-size:13px; background:#fff; }
  .attach-row input[data-link-field="label"]{ flex:0 1 90px; }
  .attach-row input[data-link-field="url"]{ flex:2 1 auto; }
  .attach-row .btn-mini{ flex:none; }
  .link-rows{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .btn-text-add{ background:none; border:none; color:var(--celeste-dark); font-weight:700; font-size:12.5px; cursor:pointer; padding:4px 0; }
  .img-preview-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .img-preview{ position:relative; width:76px; height:76px; }
  .img-preview img{ width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
  .img-preview .rm{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--danger);
    color:#fff; border:none; font-size:12px; cursor:pointer; line-height:20px; text-align:center; padding:0;
  }

  /* Adjuntos genéricos (PDF/audio chicos, ver MAX_ATTACHMENT_FILE_BYTES):
     mismo look que los chips de imagen, pero sin miniatura. */
  .file-preview-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .file-chip{
    display:inline-flex; align-items:center; gap:6px; background:#eef4f4; border:1px solid var(--border);
    border-radius:999px; padding:6px 8px 6px 12px; font-size:12.5px; font-weight:600; max-width:220px;
  }
  .file-chip .fname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-chip .rm{
    width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; border:none;
    font-size:11px; cursor:pointer; line-height:18px; text-align:center; padding:0; flex-shrink:0;
  }
  .post-files{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .post-file-audio{ display:flex; align-items:center; gap:8px; }
  .post-file-audio audio{ height:32px; max-width:260px; }
  .post-file-audio .fname, .post-file-link{ font-size:12.5px; font-weight:600; color:var(--petroleo); }

  /* Autocompletado genérico (lugar y @menciones): lista angosta debajo
     del input/textarea que la dispara. */
  .autocomplete-list{
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--border);
    border-radius:var(--radius-sm); box-shadow:var(--shadow); z-index:8; max-height:220px; overflow-y:auto;
  }
  .autocomplete-option{
    display:block; width:100%; text-align:left; background:none; border:none; padding:9px 14px; font-size:13px;
    cursor:pointer; color:var(--text);
  }
  .autocomplete-option:hover, .autocomplete-option.active{ background:#f2f6f6; }
  .autocomplete-empty{ padding:9px 14px; font-size:12.5px; color:var(--text-muted); }
  /* Opción "sumar como lugar nuevo" (ver getPlaceMatches): mismo look que
     una sugerencia normal, con el celeste de la app para diferenciarla de
     un lugar ya conocido. */
  .autocomplete-option-new{ color:var(--celeste-dark); font-weight:700; }
  /* Fila de @mención: compacta, con avatar chico — más angosta que un
     .autocomplete-option de texto plano (place-picker). */
  .autocomplete-option.mention-option{ display:flex; align-items:center; gap:8px; padding:5px 12px; font-weight:600; }
  .mention-avatar{ width:20px; height:20px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .mention-avatar.mention-avatar-fallback{
    display:flex; align-items:center; justify-content:center; background:var(--petroleo); color:#fff;
    font-size:10px; font-weight:800;
  }
  /* @Nickname dentro de un posteo/respuesta ya publicado (ver
     highlightMentions()) — mismo celeste de la app, no el verde de
     WhatsApp, pero con la misma idea de resaltar la mención del resto
     del texto. */
  .mention-tag{ color:var(--celeste-dark); background:rgba(79,199,224,0.16); border-radius:4px; padding:0 3px; font-weight:700; }
  .place-picker{ position:relative; margin-top:8px; }
  .place-picker input{ width:100%; border:1.5px solid var(--border); border-radius:999px; padding:9px 14px; font-size:13px; background:#fff; box-sizing:border-box; }
  .mention-anchor{ position:relative; flex:1; }

  /* Resalte de @mención EN VIVO mientras se escribe (no solo en lo ya
     publicado): un <div> detrás del textarea, con el mismo texto pasado
     por highlightMentions(), que solo pinta el fondo celeste detrás de
     "@Nickname" — el texto en sí (negro) lo sigue mostrando el textarea
     real, que queda transparente arriba. Nunca se le pone padding extra
     al span de la mención acá adentro: correría el punto donde el texto
     ajusta renglón respecto del textarea real y quedaría desalineado. */
  .mention-highlight-backdrop{
    position:absolute; top:0; left:0; right:0; bottom:0; margin:0; overflow:hidden; pointer-events:none;
    color:transparent; white-space:pre-wrap; word-wrap:break-word; word-break:break-word;
    font-family:inherit; box-sizing:border-box;
  }
  .mention-highlight-backdrop .mention-tag{ padding:0; font-weight:inherit; color:transparent; background:rgba(79,199,224,0.32); }
  .field .mention-highlight-backdrop{
    padding:10px 12px; border:1.5px solid transparent; border-radius:var(--radius-sm);
    font-size:14px; background:#fbfdfd;
  }
  .field textarea.mention-input{ position:relative; z-index:1; background:transparent; }
  .quick-composer .mention-highlight-backdrop{ padding:8px 0; font-size:15px; line-height:1.4; }
  .quick-composer textarea.mention-input{ position:relative; z-index:1; }
  .reply-nested-form .mention-highlight-backdrop{
    padding:8px 10px; border:1.5px solid transparent; border-radius:var(--radius-sm);
    font-size:13px; background:#fff;
  }
  .reply-nested-form textarea.mention-input{ position:relative; z-index:1; background:transparent; }

  /* Punto rojo de @menciones sin ver (ver getUnseenMentionCount), hoy
     colgado de la campanita en vez del avatar. */
  .mention-dot{
    position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; padding:0 3px; border-radius:999px;
    background:var(--danger); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center;
    justify-content:center; border:2px solid var(--petroleo-dark);
  }

  /* Campanita de @menciones, entre "+ Nuevo evento" y el avatar: mismo
     look circular que el avatar-btn, con un desplegable corto (últimas 4
     nomás) de las menciones más recientes en vez de un historial largo. */
  .mentions-bell-wrap{ position:relative; }
  .bell-btn{
    position:relative; width:36px; height:36px; padding:0; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.55); font-size:16px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color .15s;
  }
  .bell-btn:hover, .bell-btn.open{ border-color:#fff; }
  .mentions-menu{
    position:absolute; top:calc(100% + 12px); right:0; width:280px;
    background:var(--card); color:var(--text); border-radius:var(--radius-md);
    box-shadow:0 14px 36px rgba(8,42,44,0.28); padding:10px; z-index:60; text-align:left;
  }
  .mentions-menu::before{
    content:""; position:absolute; top:-6px; right:13px; width:12px; height:12px;
    background:var(--card); transform:rotate(45deg); border-radius:2px;
  }
  .mentions-menu-title{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted); padding:4px 8px 8px; }
  .mention-item{
    display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; background:none; border:none;
    padding:8px; border-radius:var(--radius-sm); cursor:pointer;
  }
  .mention-item:hover{ background:#f2f6f6; }
  .mention-item .mi-author{ font-size:12.5px; font-weight:700; color:var(--petroleo-dark); }
  .mention-item .mi-content{ font-size:12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mention-item .mi-date{ font-size:10.5px; color:var(--text-muted); }
  .mentions-empty{ padding:12px 8px; font-size:12.5px; color:var(--text-muted); text-align:center; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .btn-secondary{ background:#eef4f4; color:var(--text); border:none; padding:11px 18px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-primary{ background:var(--petroleo); color:#fff; border:none; padding:11px 20px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .form-error{ color:var(--danger); font-size:12.5px; margin-top:6px; }
  .hint{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }

  .subview-toggle{ display:inline-flex; background:#eef4f4; border-radius:999px; padding:4px; margin-bottom:16px; }
  .subview-toggle button{ border:none; background:none; padding:8px 18px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; color:var(--text-muted); }
  .subview-toggle button.active{ background:var(--petroleo); color:#fff; }
  .paises-toolbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .paises-toolbar .subview-toggle, .paises-toolbar .zone-legend{ margin-bottom:0; }
  .country-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .country-card{
    background:#fff; border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow); cursor:pointer;
    border:1px solid var(--border); border-left:6px solid var(--petroleo); transition:transform 0.1s;
  }
  .country-card:hover{ transform:translateY(-2px); }
  .country-card .name{ font-weight:800; font-size:14px; margin-bottom:4px; }
  .country-card .count{ font-size:22px; font-weight:800; color:var(--petroleo); }
  .country-card .count small{ font-size:11px; font-weight:600; color:var(--text-muted); }
  .zone-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:var(--text-muted); font-weight:600; }
  .zone-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .zone-legend .dot{ width:11px; height:11px; border-radius:50%; }
  /* position+z-index EXPLÍCITOS acá (no solo el position:relative que ya
     pone leaflet.css) para que el mapa cree su propio contexto de
     apilamiento: sin esto, los controles/paneles internos de Leaflet
     (z-index 400 a 1000) "se escapan" del mapa y terminan dibujándose
     por ENCIMA de cosas de la página que están más abajo en el HTML,
     como el menú desplegable del avatar en el header — pasaba porque el
     header solo tiene z-index:40, muy por debajo de esos 400-1000. */
  #map{ height:480px; border-radius:var(--radius-lg); box-shadow:var(--shadow); border:1px solid var(--border); position:relative; z-index:0; }
  .breadcrumb{ font-size:12.5px; color:var(--text-muted); margin-bottom:12px; }
  .breadcrumb a{ cursor:pointer; font-weight:700; }
  .city-list{ display:flex; flex-direction:column; gap:8px; }
  .city-row{
    display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:12px 14px; cursor:pointer;
  }
  .city-row:hover{ border-color:var(--celeste); }
  .city-row .cname{ font-weight:700; font-size:13.5px; }
  .city-row .ccount{ font-weight:800; color:var(--petroleo); }
  /* Círculos del mapa: SIEMPRE el mismo tamaño (el número adentro es lo
     que cambia, no el círculo) — antes el radio crecía con la cantidad de
     registros y con muchos países cercanos terminaba en un amasijo de
     círculos superpuestos de tamaños random. En vez de eso, los países
     cercanos entre sí se agrupan en un solo círculo "cluster" al alejar
     el zoom (con la cantidad de países agrupados en el número), y se
     van separando en sus círculos individuales a medida que se acerca
     el zoom — ver leaflet.markercluster en initOrUpdateMap().
  */
  .map-country-marker-wrap, .map-cluster-wrap{ background:transparent!important; border:none!important; }
  .map-country-marker{
    width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:12px; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,0.28);
  }
  .map-cluster{
    width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--petroleo); color:#fff; font-weight:800; font-size:13px; border:3px solid #fff;
    box-shadow:0 3px 10px rgba(0,0,0,0.32);
  }
  .map-popup b{ display:block; margin-bottom:4px; }
  .map-popup .pop-city{ font-size:12px; display:flex; justify-content:space-between; gap:10px; }
  .map-popup button{ margin-top:8px; }

  /* ---------- Lightbox ---------- */
  #lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:200;
    cursor:zoom-out; padding:20px;
  }
  #lightbox.show{ display:flex; }
  #lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }

  .sort-toggle{ display:flex; gap:8px; margin-bottom:14px; }

  footer.appfoot{ text-align:center; color:var(--text-muted); font-size:11.5px; padding:20px; }

  const re = new RegExp(`@(${names.join("|")})\\b`, "g");
  return escapedText.replace(re, m => `<span class="mention-tag">${m}</span>`);
}
function nl2br(s){ return highlightMentions(esc(s)).replace(/\n/g,"<br>"); }
function normalize(s){
  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
}
function titleCase(s){
  return String(s||"").trim().replace(/\s+/g," ").replace(/\w\S*/g, w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
}
function safeUrl(u){

}
function fmtDate(d){
  if(!d) return "";
  const dt = typeof d === "string" ? new Date(d+"T00:00:00") : d;
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("es-AR",{ day:"2-digit", month:"short", year:"numeric" });
}
function fmtDateTime(ts){
  if(!ts) return "";

  if(isNaN(dt)) return "";

         dt.toLocaleTimeString("es-AR",{ hour:"2-digit", minute:"2-digit" });

// "Notificaciones" de @menciones: sin backend pago (Cloud Functions/Blaze),
// solo un indicador dentro de la app. Se guarda en localStorage (por
// dispositivo/navegador, no sincroniza entre aparatos) cuándo fue la
// última vez que la persona abrió el menú del avatar, y se cuenta cuántas
// menciones a su email son más nuevas que eso.
const MENTIONS_SEEN_KEY = "mentionsSeenAt";
// Guardado por email (no una sola clave global): si dos cuentas distintas
// comparten el mismo navegador, "ya vistas" de una no debe ocultar (ni
// inventar) menciones nuevas para la otra.
function mentionsSeenKey(){
  const email = state.auth.user && state.auth.user.email;
  return email ? `${MENTIONS_SEEN_KEY}:${email}` : null;
}
function getMentionsSeenAt(){
  const key = mentionsSeenKey();
  if(!key) return 0;
  try{ return Number(localStorage.getItem(key)) || 0; }catch(e){ return 0; }
}
function markMentionsSeen(){
  const key = mentionsSeenKey();
  if(!key) return;
  try{ localStorage.setItem(key, String(Date.now())); }catch(e){}
}
// "@all" (ver renderMentionSuggestions) cuenta como mención para
// cualquiera, no solo para un email puntual.
function mentionsInclude(mentions, email){
  return (mentions||[]).includes(email) || (mentions||[]).includes("all");
}
// El array `mentions` que se guarda con el posteo/respuesta se arma
// SIEMPRE a partir del texto final, justo antes de publicar — nunca de
// un array que se va acumulando mientras se escribe (ver
// selectMentionMatch): si alguien elegía una mención del desplegable y
// después borraba o cambiaba ese "@Nombre" del texto a mano, ese array
// acumulado quedaba con una mención "fantasma" que ya no estaba escrita
// en ningún lado, y esa persona recibía notificaciones de algo que en
// realidad no la mencionaba. Recalcular desde el texto lo hace imposible.
function extractMentionsFromContent(content){
  const byNickname = {};
  state.roster.forEach(u=>{ byNickname[u.nickname.toLowerCase()] = u.email; });
  const found = new Set();
  const re = /@(\w+)/g;
  let m;
  while((m = re.exec(content||""))){
    const nick = m[1].toLowerCase();
    if(nick === "all") found.add("all");
    else if(byNickname[nick]) found.add(byNickname[nick]);
  }
  return [...found];
}
function getUnseenMentionCount(){
  const email = state.auth.user && state.auth.user.email;
  if(!email) return 0;
  const seenAt = getMentionsSeenAt();
  let count = 0;
  state.posts.forEach(p=>{
    if(mentionsInclude(p.mentions, email) && tsToMillis(p.createdAt) > seenAt) count++;
  });
  Object.values(state.repliesByPost).forEach(list=>{
    list.forEach(r=>{
      if(mentionsInclude(r.mentions, email) && tsToMillis(r.createdAt) > seenAt) count++;
    });
  });
  return count;
}
// Las últimas N menciones (posteos o respuestas) a la persona logueada,
// para el desplegable de la campanita — no hace falta separar vistas de
// no vistas acá, es solo un "últimas menciones" corto.
function getRecentMentions(limit=4){
  const email = state.auth.user && state.auth.user.email;
  if(!email) return [];
  const items = [];
  state.posts.forEach(p=>{
    if(mentionsInclude(p.mentions, email)){
      items.push({ postId:p.id, replyId:null, authorName:p.authorName, content:p.content, createdAt:p.createdAt });
    }
  });
  Object.entries(state.repliesByPost).forEach(([postId, list])=>{
    list.forEach(r=>{
      if(mentionsInclude(r.mentions, email)){
        items.push({ postId, replyId:r.id, authorName:r.authorName, content:r.content, createdAt:r.createdAt });
      }
    });
  });
  items.sort((a,b)=> tsToMillis(b.createdAt) - tsToMillis(a.createdAt));
  return items.slice(0, limit);
}

function zoneOfScope(scope){
  if(scope.type==="region") return scope.region;
  const c = COUNTRY_BY_NAME[scope.country];
  return c ? c.zone : null;
}
// ¿esta escala (post o respuesta) afecta al país dado? (directo, vía región, o "toda LatAm")
function scopeAffectsCountry(scope, countryName){
  if(scope.type==="todo") return true;
  if(scope.type==="pais" || scope.type==="ciudad") return scope.country === countryName;
  if(scope.type==="region") return ZONE_COUNTRIES[scope.region].includes(countryName);
  return false;
}
function scopeAffectsZone(scope, zoneKey){
  if(scope.type==="todo") return true;
  return zoneOfScope(scope) === zoneKey;
}
function scopeAffectsCity(scope, countryName, cityName){
  if(scope.type==="todo") return true;
  return scope.type==="ciudad" && scope.country===countryName && normalize(scope.city)===normalize(cityName);
}
function scopeLabel(scope){
  if(scope.type==="todo") return "Toda LatAm";
  if(scope.type==="region") return `Región ${ZONES[scope.region].label}`;
  if(scope.type==="pais") return scope.country;
  if(scope.type==="ciudad") return `${scope.city}, ${scope.country}`;
  return "";
}
function scopeIcon(scope){
  if(scope.type==="todo") return "🌐";
  return scope.type==="region" ? "🌎" : scope.type==="pais" ? "🏳️" : "📍";
}

/* Compresión de imágenes: reduce a JPEG, máx 1280px de lado mayor */
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("No se pudo leer la imagen"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Imagen inválida"));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function waitForGis(){
  return new Promise((resolve, reject)=>{
    if(window.google?.accounts?.oauth2) return resolve();
    let tries = 0;
    const check = setInterval(()=>{
      tries++;
      if(window.google?.accounts?.oauth2){ clearInterval(check); resolve(); }
      else if(tries > 20){ clearInterval(check); reject(new Error("Google Identity Services no cargó")); } // ~5s
    }, 250);
  });
}
// Intenta renovar el token de Calendar CON Google Identity Services (gsi/
// client, cargado en el <head>) en vez del popup completo de
// signInWithPopup: si la persona ya concedió el permiso antes y sigue con
// sesión activa de Google en el navegador, esto suele resolver con una
// ventanita que se abre y se cierra sola en una fracción de segundo (o
// directo sin ninguna ventana), en vez del popup de "elegí tu cuenta" de
// siempre. Si el navegador bloquea eso (ventana privada, cookies de
// terceros bloqueadas, permiso revocado) o la librería no cargó, se
// resuelve con null y quien llama cae al popup de siempre — nunca se
// queda trabado esperando.
function requestSilentCalendarToken(scopes){
  return new Promise(async (resolve)=>{
    try{ await waitForGis(); }catch(e){ return resolve(null); }
    let settled = false;
    const finish = (value)=>{ if(settled) return; settled = true; clearTimeout(timeout); resolve(value); };
    const timeout = setTimeout(()=>finish(null), 6000);
    try{
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        scope: scopes.join(" "),
        hint: state.auth.user?.email,
        callback: (resp)=>finish(resp && resp.access_token ? resp : null),
        error_callback: ()=>finish(null),
      });
      tokenClient.requestAccessToken({ prompt: "" });
    }catch(e){ finish(null); }
  });
}

// Se asegura de tener un token de Calendar vigente. Si no lo tiene (por
// ejemplo, la sesión de Firebase se restauró silenciosamente al recargar
// la página, lo que NO trae un access token nuevo), primero intenta
// renovarlo en segundo plano (ver requestSilentCalendarToken) y solo si
// eso no funciona, vuelve a pedir el login con Google — normalmente un
// click rápido, ya con la cuenta pre-seleccionada, no un login completo
// de nuevo.
// Si quien está logueado es el admin, se pide de una vez también el
// permiso de compartir/sacar gente del Calendar (ver ensureCalendarAclToken)
// junto con el de eventos — así el admin ve como mucho UN popup de Google
// por sesión (al crear/editar el primer posteo, o al aprobar/compartir el
// primer acceso, lo que ocurra primero) en vez de uno para cada acción.
async function ensureCalendarToken(){
  if(calendarAccessToken && Date.now() < calendarTokenExpiry) return calendarAccessToken;
  const isAdminUser = state.auth.user && state.auth.user.email === ADMIN_EMAIL;
  const scopes = ["https://www.googleapis.com/auth/calendar.events"];
  if(isAdminUser) scopes.push("https://www.googleapis.com/auth/calendar.acls");

  const silent = await requestSilentCalendarToken(scopes);
  if(silent){ storeCalendarCredentialFromGis(silent, { aclScope: isAdminUser }); return calendarAccessToken; }

  try{
    const provider = new authMod.GoogleAuthProvider();
    scopes.forEach(s=>provider.addScope(s));
    provider.setCustomParameters({ login_hint: state.auth.user.email });
    const result = await authMod.signInWithPopup(auth, provider);
    storeCalendarCredential(result, { aclScope: isAdminUser });
    return calendarAccessToken;
  }catch(err){
    console.error("No se pudo obtener acceso a Calendar:", err);
    return null;
  }
}

// Sólo la usa el admin: pide además el permiso para administrar a quién
// está compartido el calendario (compartir/sacar gente), para poder
// automatizar el alta y baja de acceso al aprobar/revocar en "Solicitudes".
// Requiere que ADMIN_EMAIL sea DUEÑO del calendario (no solo editor) —
// Google exige ese nivel para poder compartirlo en nombre de otra persona.
// calendarAclScopeGranted (declarado más arriba, junto con el token) queda
// en true una vez concedido, y se guarda en sessionStorage junto con el
// token para no volver a pedir el popup en cada recarga de página.
async function ensureCalendarAclToken(){
  if(calendarAclScopeGranted && calendarAccessToken && Date.now() < calendarTokenExpiry) return calendarAccessToken;
  const scopes = ["https://www.googleapis.com/auth/calendar.events", "https://www.googleapis.com/auth/calendar.acls"];

  const silent = await requestSilentCalendarToken(scopes);
  if(silent){ storeCalendarCredentialFromGis(silent, { aclScope:true }); return calendarAccessToken; }

  try{
    const provider = new authMod.GoogleAuthProvider();
    scopes.forEach(s=>provider.addScope(s));
    provider.setCustomParameters({ login_hint: state.auth.user.email });
    const result = await authMod.signInWithPopup(auth, provider);
    storeCalendarCredential(result, { aclScope: true });
    return calendarAccessToken;
  }catch(err){
    console.error("No se pudo obtener acceso para compartir/sacar del Calendar:", err);
    return null;
  }
}

function buildCalendarEvent(postData){
