// Tope duro absoluto de imágenes: MAX_IMAGES (editable desde Preferencias
// > Adjuntos) puede achicarlo, nunca agrandarlo más allá de esto — Firestore
// también lo exige (ver isValidPostBase en firestore.rules).
const HARD_MAX_IMAGES = 6;
let MAX_IMAGES = HARD_MAX_IMAGES;
async function handleImageFiles(fileList, targetArray, max=MAX_IMAGES){
  const files = Array.from(fileList).slice(0, Math.max(0, max - targetArray.length));
  for(const file of files){
    try{
      const dataUrl = await compressImage(file);
      targetArray.push(dataUrl);
    }catch(err){ console.error("Error comprimiendo imagen:", err); }
  }
  render();
}

// Adjuntos genéricos chicos (PDF, audio): a diferencia de las imágenes no
// se comprimen (no tiene sentido para un PDF/audio), así que se limita
// directamente el tamaño del archivo y la cantidad — Firestore permite
// ~1MB por documento entero, y el base64 pesa ~33% más que el archivo
// original, así que hay que dejar margen para el resto del posteo.
// Topes duros absolutos: los de Preferencias > Adjuntos pueden achicarlos,
// nunca agrandarlos más allá de esto — Firestore también los exige (ver
// isValidPostBase en firestore.rules, que valida contra el tope duro, no
// contra estas variables editables).
const HARD_MAX_ATTACHMENT_FILES = 2;
let MAX_ATTACHMENT_FILES = HARD_MAX_ATTACHMENT_FILES;
let MAX_ATTACHMENT_FILE_BYTES = 150 * 1024;
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("No se pudo leer el archivo"));
    reader.onload = ()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
async function handleFileAttachments(fileList, targetArray){
  const files = Array.from(fileList).slice(0, Math.max(0, MAX_ATTACHMENT_FILES - targetArray.length));
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_FILE_BYTES){
      alert(`"${file.name}" pesa ${(file.size/1024).toFixed(0)}KB, más del máximo de ${(MAX_ATTACHMENT_FILE_BYTES/1024).toFixed(0)}KB para adjuntar acá. Para archivos más grandes, subilo a Drive (o similar) y pegá el link.`);
      continue;
    }
    try{
      const dataUrl = await readFileAsDataUrl(file);
      targetArray.push({ name:file.name, mime:file.type, kind: file.type.startsWith("audio/") ? "audio" : "pdf", dataUrl });
    }catch(err){ console.error("Error leyendo archivo:", err); }
  }
  render();
}
function renderFileChips(files, rmAction, extraAttrs=""){
  if(!files || !files.length) return "";
  return `<div class="file-preview-list">${files.map((f,i)=>`
    <div class="file-chip">${f.kind==="audio"?"🎤":"📄"} <span class="fname">${esc(f.name)}</span>
      <button type="button" class="rm" data-action="${rmAction}" data-idx="${i}" ${extraAttrs}>✕</button></div>`).join("")}</div>`;
}
// Archivos YA publicados en un posteo/respuesta (a diferencia de
// renderFileChips, que es para los que todavía se están por mandar).
function renderPostedFiles(files){
  if(!files || !files.length) return "";
  return `<div class="post-files">${files.map(f => f.kind === "audio"
    ? `<div class="post-file-audio"><audio controls src="${f.dataUrl}"></audio><span class="fname">${esc(f.name)}</span></div>`
    : `<a class="post-file-link" href="${f.dataUrl}" download="${esc(f.name)}" target="_blank" rel="noopener noreferrer">📄 ${esc(f.name)}</a>`
  ).join("")}</div>`;
}

// Autocompletar "lugar" (composer de Rutina) y "@menciones" (cualquier
// textarea de contenido): dos listas desplegables chiquitas con el mismo
// look (.autocomplete-list/.autocomplete-option), una sobre PLACE_INDEX y
// otra sobre state.roster. Ambas se pueden recorrer con las flechas del
// teclado y confirmar con Tab/Enter (ver el keydown handler más abajo);
// getPlaceMatches/getMentionMatches se comparten entre el render y el
// manejo de teclado para que siempre miren exactamente la misma lista.
function getPlaceMatches(query){
  const q = (query||"").trim().toLowerCase();
  if(!q) return [];
  const matches = PLACE_INDEX.filter(it => it.label.toLowerCase().includes(q)).slice(0, 8);
  if(matches.length) return matches;
  // Sin resultados: si escribieron "Ciudad, País" y el país ya existe (los
  // 43 países ya están todos cargados, nunca hace falta sumar uno), se
  // ofrece sumar esa ciudad como lugar nuevo. No hace falta coordenada
  // propia para esto — el mapa de Países solo marca por país (ver
  // initOrUpdateMap), nunca por ciudad, así que esto ya funciona igual
  // que un preset en todo lo demás (filtros, conteos, chips). Si más
  // adelante el equipo arranca presencia real ahí, el admin la puede
  // sumar a CITY_PRESETS con el nombre prolijo (ver README).
  const parts = (query||"").split(",");
  if(parts.length >= 2){
    const cityPart = parts.slice(0,-1).join(",").trim();
    const countryPart = parts[parts.length-1].trim();
    const country = COUNTRIES.find(c => normalize(c.name) === normalize(countryPart));
    if(cityPart && country){
      const city = titleCase(cityPart);
      return [{ label: `Usar "${city}, ${country.name}" (lugar nuevo)`, icon:"➕", scope:{type:"ciudad", country:country.name, city}, isNew:true }];
    }
  }
  return [];
}
function renderPlaceSuggestions(draft, scope, ownerId){
  const matches = getPlaceMatches(draft.placeQuery);
  if(!draft.placeQuery.trim()) return "";
  if(!matches.length) return `<div class="autocomplete-list"><div class="autocomplete-empty">Sin resultados. Para sumar un lugar nuevo, escribí "Ciudad, País".</div></div>`;
  return `<div class="autocomplete-list">${matches.map((it,i)=>`
    <button type="button" class="autocomplete-option${it.isNew?" autocomplete-option-new":""}${i===draft.placeHighlight?" active":""}" data-action="pick-place" data-scope="${scope}" data-owner-id="${ownerId}" data-match-idx="${i}">${it.icon} ${esc(it.label)}</button>`).join("")}</div>`;
}
function selectPlaceMatch(scope, ownerId, match){
  const draft = getDraftFor(scope, ownerId);
  if(match){
    const exists = draft.scopes.some(sc => JSON.stringify(sc) === JSON.stringify(match.scope));
    if(!exists) draft.scopes.push(match.scope);
    draft.placeQuery = "";
    draft.placeHighlight = 0;
  }
  render();
}

// Actualiza el resalte EN VIVO (ver .mention-highlight-backdrop) en cada
// tecleo, leyendo directo del DOM (no del draft) para no depender de un
// render() completo — igual que autoGrowTextarea, esto se llama en cada
// tecla sin esperar a que cambie la @mención en curso.
function syncMentionBackdrop(textarea){
  const bd = document.getElementById(textarea.id + "-hl");
  if(!bd) return;
  bd.innerHTML = highlightMentions(esc(textarea.value));
  bd.scrollTop = textarea.scrollTop;
}

// Detecta si justo antes del cursor hay un "@palabra" sin terminar, para
// mostrar (o no) el desplegable de menciones. Se llama en cada tecleo.
function updateMentionState(draft, textarea){
  const caret = textarea.selectionStart;
  const uptoCaret = textarea.value.slice(0, caret);
  const match = uptoCaret.match(/(?:^|\s)@(\w*)$/);
  if(match){
    if(draft.mentionQuery !== match[1]) draft.mentionHighlight = 0;
    draft.mentionQuery = match[1]; draft.mentionCaret = caret;
  }
  else { draft.mentionQuery = null; }
}
// "@all" es una mención especial (no es un email real): pick-mention la
// inserta como cualquier otra, y se guarda literalmente "all" en el
// array `mentions` — getUnseenMentionCount() la cuenta como mención para
// TODOS, no hace falta tratarla distinto en ningún otro lado.
function getMentionMatches(draft){
  if(draft.mentionQuery == null) return [];
  const q = draft.mentionQuery.toLowerCase();
  const allOption = "all".startsWith(q) ? [{ email:"all", nickname:"all", isAll:true }] : [];
  const myEmail = state.auth.user && state.auth.user.email;
  return allOption.concat(state.roster.filter(u =>
    u.email !== myEmail && u.nickname.toLowerCase().startsWith(q)
  )).slice(0, 6);
}
function renderMentionSuggestions(draft, scope, ownerId, textareaId){
  if(draft.mentionQuery == null) return "";
  const matches = getMentionMatches(draft);
  if(!matches.length) return `<div class="autocomplete-list"><div class="autocomplete-empty">Sin coincidencias</div></div>`;
  return `<div class="autocomplete-list">${matches.map((u,i)=>{
    const avatar = u.isAll ? `<span class="mention-avatar mention-avatar-fallback">👥</span>`
      : u.photoURL ? `<img class="mention-avatar" src="${esc(u.photoURL)}" alt="">`
      : `<span class="mention-avatar mention-avatar-fallback">${esc(u.nickname[0].toUpperCase())}</span>`;
    return `<button type="button" class="autocomplete-option mention-option${i===draft.mentionHighlight?" active":""}" data-action="pick-mention" data-scope="${scope}" data-owner-id="${ownerId}" data-textarea-id="${textareaId}" data-nickname="${esc(u.nickname)}" data-email="${esc(u.email)}">${avatar}<span>@${esc(u.nickname)}</span></button>`;
  }).join("")}</div>`;
}
function selectMentionMatch(scope, ownerId, textareaId, match){
  if(!match) return;
  const draft = getDraftFor(scope, ownerId);
  const caret = draft.mentionCaret != null ? draft.mentionCaret : draft.content.length;
  const before = draft.content.slice(0, caret).replace(/@(\w*)$/, "");
  const after = draft.content.slice(caret);
  const insText = "@" + match.nickname + " ";
  draft.content = before + insText + after;
  draft.mentionQuery = null;
  draft.mentionHighlight = 0;
  const newCaret = before.length + insText.length;
  render();
  // El foco/cursor no se restaura solo acá (no fue un evento de la
  // textarea): se reposiciona a mano justo después de la mención.
  const el = document.getElementById(textareaId);
  if(el){ el.focus(); el.setSelectionRange(newCaret, newCaret); autoGrowTextarea(el); }
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// Participantes del composer principal (único lugar donde se usa, por
// eso trabaja directo sobre composerDraft en vez del patrón genérico
// getDraftFor/scope/ownerId que usan @menciones y lugar): gente del
// roster por nickname o email, más la opción de sumar un email suelto
// (alguien externo, o sin cuenta todavía) si lo tipeado ya es un email
// válido y todavía no fue agregado.
function getParticipantMatches(draft){
  const raw = (draft.participantQuery||"").trim();
  const q = raw.toLowerCase();
  if(!q) return [];
  const already = new Set(draft.participants.map(p=>p.email.toLowerCase()));
  const matches = state.roster.filter(u =>
    !already.has(u.email.toLowerCase()) &&
    (u.nickname.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))
  ).slice(0, 6).map(u => ({ email:u.email, name:u.nickname, photoURL:u.photoURL }));
  if(EMAIL_RE.test(raw) && !already.has(q) && !matches.some(m=>m.email.toLowerCase()===q)){
    matches.push({ email:raw, name:raw, isLoose:true });
  }
  return matches;
}
function renderParticipantsField(draft){
  return `
    <div class="participants-field">
      ${draft.participants.length ? `<div class="participants-row">${draft.participants.map((p,i)=>renderParticipantChip(p,i)).join("")}</div>` : ""}
      <input type="text" id="cParticipantQuery" class="field-icon-input" placeholder="Sumar participante (nombre o email)..." autocomplete="off" value="${esc(draft.participantQuery)}">
      ${draft.participantQuery ? renderParticipantSuggestions(draft) : ""}
      ${draft.legacyOrganizer ? `<div class="hint" style="margin-top:4px;">Antes decía "Organiza: ${esc(draft.legacyOrganizer)}" — se reemplaza al guardar por lo que sumes acá.</div>` : ""}
    </div>`;
}
function renderParticipantChip(p, idx){
  const avatar = p.photoURL ? `<img class="participant-chip-avatar" src="${esc(p.photoURL)}" alt="">` : "";
  return `<span class="participant-chip">${avatar}${esc(p.name || p.email)}<span class="rm" data-action="rm-participant" data-idx="${idx}">✕</span></span>`;
}
function renderParticipantSuggestions(draft){
  const matches = getParticipantMatches(draft);
  if(!matches.length) return `<div class="autocomplete-list"><div class="autocomplete-empty">Sin coincidencias. Escribí un email completo para sumar a alguien de afuera.</div></div>`;
  return `<div class="autocomplete-list">${matches.map((m,i)=>{
    const avatar = m.isLoose ? `<span class="mention-avatar mention-avatar-fallback">✉️</span>`
      : m.photoURL ? `<img class="mention-avatar" src="${esc(m.photoURL)}" alt="">`
      : `<span class="mention-avatar mention-avatar-fallback">${esc((m.name||m.email)[0].toUpperCase())}</span>`;
    const label = m.isLoose ? `Sumar "${esc(m.email)}" como invitado` : `${esc(m.name)} <span style="color:var(--text-muted); font-weight:500;">${esc(m.email)}</span>`;
    return `<button type="button" class="autocomplete-option mention-option${i===draft.participantHighlight?" active":""}" data-action="pick-participant" data-match-idx="${i}">${avatar}<span>${label}</span></button>`;
  }).join("")}</div>`;
}
function selectParticipantMatch(match){
  if(!match) return;
  const draft = composerDraft;
  if(!draft.participants.some(p=>p.email.toLowerCase()===match.email.toLowerCase())){
    draft.participants.push({ email: match.email, name: match.name || match.email });
  }
  draft.participantQuery = ""; draft.participantHighlight = 0;
  render();
  const el = document.getElementById("cParticipantQuery");
  if(el) el.focus();
}

// Navegar los desplegables de lugar/@mención con flechas arriba/abajo, y
// confirmar la opción resaltada con Tab o Enter (Escape los cierra sin
// elegir nada) — en vez de depender solo del mouse.
document.addEventListener("keydown", e=>{
  const t = e.target;
  if(t.dataset.placeScope){
    const draft = getDraftFor(t.dataset.placeScope, t.dataset.placeOwner);
    const matches = getPlaceMatches(draft.placeQuery);
    if(!matches.length) return;
    if(e.key === "ArrowDown"){
      e.preventDefault();
      draft.placeHighlight = (draft.placeHighlight + 1) % matches.length;
      render();
    } else if(e.key === "ArrowUp"){
      e.preventDefault();
      draft.placeHighlight = (draft.placeHighlight - 1 + matches.length) % matches.length;
      render();
    } else if(e.key === "Tab" || e.key === "Enter"){
      e.preventDefault();
      selectPlaceMatch(t.dataset.placeScope, t.dataset.placeOwner, matches[draft.placeHighlight]);
    } else if(e.key === "Escape"){
      draft.placeQuery = ""; draft.placeHighlight = 0; render();
    }
    return;
  }
  if(t.dataset.mentionScope){
    const draft = getDraftFor(t.dataset.mentionScope, t.dataset.mentionOwner);
    if(draft.mentionQuery == null) return;
    const matches = getMentionMatches(draft);
    if(!matches.length) return;
    if(e.key === "ArrowDown"){
      e.preventDefault();
      draft.mentionHighlight = (draft.mentionHighlight + 1) % matches.length;
      render();
    } else if(e.key === "ArrowUp"){
      e.preventDefault();
      draft.mentionHighlight = (draft.mentionHighlight - 1 + matches.length) % matches.length;
      render();
    } else if(e.key === "Tab" || e.key === "Enter"){
      e.preventDefault();
      selectMentionMatch(t.dataset.mentionScope, t.dataset.mentionOwner, t.id, matches[draft.mentionHighlight]);
    } else if(e.key === "Escape"){
      draft.mentionQuery = null; draft.mentionHighlight = 0; render();
    }
    return;
  }
  if(t.id === "cParticipantQuery"){
    const draft = composerDraft;
    const matches = getParticipantMatches(draft);
    if(!matches.length) return;
    if(e.key === "ArrowDown"){
      e.preventDefault();
      draft.participantHighlight = (draft.participantHighlight + 1) % matches.length;
      render();
    } else if(e.key === "ArrowUp"){
      e.preventDefault();
      draft.participantHighlight = (draft.participantHighlight - 1 + matches.length) % matches.length;
      render();
    } else if(e.key === "Tab" || e.key === "Enter"){
      e.preventDefault();
      selectParticipantMatch(matches[draft.participantHighlight]);
    } else if(e.key === "Escape"){
      draft.participantQuery = ""; draft.participantHighlight = 0; render();
    }
  }
});

document.addEventListener("click", e=>{
  if(userMenuOpen && !e.target.closest("#userBadge")){
    userMenuOpen = false; render();
  }
  if(mentionsMenuOpen && !e.target.closest("#mentionsBell")){
    mentionsMenuOpen = false; render();
  }

  if(!t) return;
  const action = t.dataset.action;
  const postId = t.dataset.postId;

  if(action === "toggle-type"){
    const key = t.dataset.key;
    state.filters.types.has(key) ? state.filters.types.delete(key) : state.filters.types.add(key);
    render();
  } else if(action === "toggle-zone"){
    const key = t.dataset.key;
    state.filters.zones.has(key) ? state.filters.zones.delete(key) : state.filters.zones.add(key);
    render();

    state.filters.place = null; render();

    state.filters = { text:"", types:new Set(), zones:new Set(), place:null }; render();

    auditVisibleCount = 30; render();
  } else if(action === "audit-clear-filters"){
    state.auditFilters = { text:"", types:new Set() }; auditVisibleCount = 30; render();
  } else if(action === "audit-sort"){
    const key = t.dataset.key;

    openLightbox(t.dataset.src);

    else{ openReplyForms.add(postId); openThreads.add(postId); }

    render();
  } else if(action === "cancel-nested-reply"){
    openNestedReplyForms.delete(t.dataset.replyId); render();
  } else if(action === "submit-nested-reply"){
    submitNestedReply(t.dataset.postId, t.dataset.replyId);
  } else if(action === "toggle-reply-extra-scope"){
    // manejado en 'change'
  } else if(action === "reply-add-link"){
    getReplyDraft(postId).links.push({ label:"", url:"" }); render();
  } else if(action === "nested-reply-add-link"){
    getNestedReplyDraft(t.dataset.replyId).links.push({ label:"", url:"" }); render();

    getNestedReplyDraft(t.dataset.replyId).images.splice(Number(t.dataset.idx),1); render();
  } else if(action === "post-rm-image"){
    composerDraft.images.splice(Number(t.dataset.idx),1); render();
  } else if(action === "rutina-rm-image"){
    rutinaDraft.images.splice(Number(t.dataset.idx),1); render();
  } else if(action === "post-rm-file"){
    composerDraft.files.splice(Number(t.dataset.idx),1); render();
  } else if(action === "reply-rm-file"){
    getReplyDraft(postId).files.splice(Number(t.dataset.idx),1); render();
  } else if(action === "nested-reply-rm-file"){
    getNestedReplyDraft(t.dataset.replyId).files.splice(Number(t.dataset.idx),1); render();
  } else if(action === "rutina-rm-file"){
    rutinaDraft.files.splice(Number(t.dataset.idx),1); render();
  } else if(action === "submit-rutina"){
    submitRutina();
  } else if(action === "pick-place"){
    const draft = getDraftFor(t.dataset.scope, t.dataset.ownerId);
    const matches = getPlaceMatches(draft.placeQuery);
    selectPlaceMatch(t.dataset.scope, t.dataset.ownerId, matches[Number(t.dataset.matchIdx)]);
  } else if(action === "pick-mention"){
    selectMentionMatch(t.dataset.scope, t.dataset.ownerId, t.dataset.textareaId, { nickname:t.dataset.nickname, email:t.dataset.email });
  } else if(action === "pick-participant"){
    selectParticipantMatch(getParticipantMatches(composerDraft)[Number(t.dataset.matchIdx)]);
  } else if(action === "rm-participant"){
    composerDraft.participants.splice(Number(t.dataset.idx), 1); render();
  } else if(action === "use-city-preset"){
    const sd = getDraftFor(t.dataset.scope, t.dataset.ownerId).scopeDraft;
    sd.cityUseCustom = false; sd.city = ""; render();
  } else if(action === "add-scope"){
    commitScope(t.dataset.scope, t.dataset.ownerId);
  } else if(action && action.startsWith("rm-scope-")){
    const scope = action.replace("rm-scope-",""); const ownerId = t.dataset.ownerId; const idx = Number(t.dataset.idx);
    getDraftFor(scope, ownerId).scopes.splice(idx,1); render();
  } else if(action === "submit-reply"){
    submitReply(postId);
  } else if(action === "paises-subview"){
    state.paisesSubview = t.dataset.key; state.countryDrill = null; render();
  } else if(action === "toggle-paises-zone"){
    const key = t.dataset.key;
    state.paisesZoneFilter.has(key) ? state.paisesZoneFilter.delete(key) : state.paisesZoneFilter.add(key);
    state.countryDrill = null;
    render();
  } else if(action === "drill-country"){
    state.countryDrill = t.dataset.country; render();
  } else if(action === "drill-clear"){
    state.countryDrill = null; render();
  } else if(action === "goto-country"){
    state.filters.place = { kind:"country", country:t.dataset.country };
    state.view = "memoria"; state.countryDrill = null; render();
  } else if(action === "goto-city"){
    state.filters.place = { kind:"city", country:t.dataset.country, city:t.dataset.city };
    state.view = "memoria"; state.countryDrill = null; render();
  } else if(action === "dismiss-calendar-notice"){
    clearTimeout(calendarNoticeTimer);
    calendarToastEl.hidden = true;
    calendarToastEl.classList.remove("fading");
  } else if(action === "memoria-order"){
    state.memoriaOrder = t.dataset.key; render();
  } else if(action === "google-signin"){
    signIn();
  } else if(action === "toggle-user-menu"){
    userMenuOpen = !userMenuOpen;
    render();
  } else if(action === "toggle-mentions-menu"){
    mentionsMenuOpen = !mentionsMenuOpen;
    if(mentionsMenuOpen) markMentionsSeen();
    render();
  } else if(action === "goto-mention"){
    mentionsMenuOpen = false;
    gotoMention(t.dataset.postId, t.dataset.replyId || null);
  } else if(action === "sign-out"){
    userMenuOpen = false;
    doSignOut();
  } else if(action === "request-again"){
    requestAccessAgain();
  } else if(action === "approve-request"){
    const email = t.dataset.email;
    approveRequest(email).then(()=>shareCalendarWith(email)).then(res=>{
      showCalendarNotice(res.ok
        ? { ok:true, message:`${email} ya puede usar la app y cargar eventos al Calendar compartido de LatAm.` }
        : { ok:false, message:`${email} ya puede usar la app, pero no se pudo compartirle el Calendar automáticamente (${res.reason}). Puede que ADMIN_EMAIL no sea el dueño del calendario "LatAm" — o compartíselo a mano desde Google Calendar.` });
    }).catch(err=>{ console.error(err); alert("No se pudo aprobar: " + err.message); });
  } else if(action === "share-calendar"){
    const email = t.dataset.email;
    shareCalendarWith(email).then(res=>{
      showCalendarNotice(res.ok
        ? { ok:true, message:`Se compartió el Calendar con ${email}.` }
        : { ok:false, message:`No se pudo compartir el Calendar con ${email} (${res.reason}).` });
    }).catch(err=>{ console.error(err); alert("No se pudo compartir: " + err.message); });
  } else if(action === "reject-request"){
    rejectRequest(t.dataset.email).catch(err=>{ console.error(err); alert("No se pudo rechazar: " + err.message); });
  } else if(action === "revoke-access"){
    const email = t.dataset.email;
    if(confirm(`¿Revocar el acceso de ${email}? Va a dejar de poder ver y cargar posteos, y se le va a sacar el acceso al Calendar compartido de LatAm.`)){
      revokeAccess(email).then(()=>unshareCalendarWith(email)).then(res=>{
        showCalendarNotice(res.ok
          ? { ok:true, message:`Se revocó el acceso de ${email} (app y Calendar).` }
          : { ok:false, message:`Se revocó el acceso a la app, pero no se pudo sacarlo del Calendar automáticamente (${res.reason}). Sacalo a mano si hace falta.` });
      }).catch(err=>{ console.error(err); alert("No se pudo revocar: " + err.message); });
    }
  } else if(action === "zonas-remove-zone"){
    const d = getZonasDraft();
    const key = t.dataset.key;
    const inUse = Object.values(d.countryZones).some(z=>z===key);
    if(inUse){ d.error = "Reasigná primero los países que están en esta zona."; render(); return; }
    delete d.zones[key];
    d.zoneOrder = d.zoneOrder.filter(k=>k!==key);
    d.error = "";
    render();
  } else if(action === "zonas-add-zone"){
    const d = getZonasDraft();
    const label = d.newZoneLabel.trim();
    if(!label){ d.error = "Escribí un nombre para la zona nueva."; render(); return; }
    const key = slugifyKey(label, d.zoneOrder);
    d.zones[key] = { label, color:"#64748b" };
    d.zoneOrder.push(key);
    d.newZoneLabel = "";
    d.error = "";
    render();
  } else if(action === "zonas-reset"){
    zonasDraft = null;
    render();
  } else if(action === "zonas-save"){
    const d = getZonasDraft();
    d.saving = true; d.error = ""; render();
    saveTerritoryConfig(d.zones, d.countryZones).then(()=>{
      d.saving = false; render();
    }).catch(err=>{
      console.error(err);
      d.saving = false; d.error = "No se pudo guardar: " + err.message; render();
    });
  } else if(action === "pref-section"){
    state.preferenciasSection = t.dataset.key; render();
  } else if(action === "tipos-remove"){
    const d = getTiposDraft();
    const key = t.dataset.key;
    if(countPostsByType(key) > 0){ d.error = "Hay posteos con este tipo — no se puede eliminar."; render(); return; }
    d.types = d.types.filter(x=>x.key!==key);
    d.error = "";
    render();
  } else if(action === "tipos-add"){
    const d = getTiposDraft();
    const label = d.newLabel.trim();
    if(!label){ d.error = "Escribí un nombre para el tipo nuevo."; render(); return; }
    const key = slugifyKey(label, d.types.map(x=>x.key));
    d.types.push({ key, label, icon: d.newIcon.trim() || "✨", calendarSync:true });
    d.newLabel = ""; d.newIcon = ""; d.error = "";
    render();
  } else if(action === "tipos-reset"){
    tiposDraft = null; render();
  } else if(action === "tipos-save"){
    const d = getTiposDraft();
    if(!d.types.length){ d.error = "Tiene que quedar al menos un tipo de actividad."; render(); return; }
    d.saving = true; d.error = ""; render();
    fb.setDoc(fb.doc(db,"meta","preferences"), { activityTypes: d.types }, { merge:true }).then(()=>{
      d.saving = false; render();
    }).catch(err=>{
      console.error(err);
      d.saving = false; d.error = "No se pudo guardar: " + err.message; render();
    });
  } else if(action === "lugares-promote"){
    promoteCustomCity(t.dataset.country, t.dataset.city).then(render).catch(err=>{
      console.error(err); alert("No se pudo sumar el lugar: " + err.message);
    });
  } else if(action === "calendar-reset"){
    calendarDraft = null; render();
  } else if(action === "calendar-save"){
    const d = getCalendarDraft();
    const id = d.calendarId.trim();
    if(!id){ d.error = "Escribí el ID del calendario."; render(); return; }
    d.saving = true; d.error = ""; render();
    fb.setDoc(fb.doc(db,"meta","preferences"), { calendarId: id }, { merge:true }).then(()=>{
      d.saving = false; render();
    }).catch(err=>{
      console.error(err);
      d.saving = false; d.error = "No se pudo guardar: " + err.message; render();
    });
  } else if(action === "adjuntos-reset"){
    adjuntosDraft = null; render();
  } else if(action === "adjuntos-save"){
    const d = getAdjuntosDraft();
    d.saving = true; d.error = ""; render();
    const maxImages = Math.min(HARD_MAX_IMAGES, Math.max(1, Number(d.maxImages) || HARD_MAX_IMAGES));
    const maxAttachmentFiles = Math.min(HARD_MAX_ATTACHMENT_FILES, Math.max(1, Number(d.maxFiles) || HARD_MAX_ATTACHMENT_FILES));
    const maxAttachmentFileBytes = Math.max(1024, (Number(d.maxFileKB) || 150) * 1024);
    fb.setDoc(fb.doc(db,"meta","preferences"), { maxImages, maxAttachmentFiles, maxAttachmentFileBytes }, { merge:true }).then(()=>{
      d.saving = false; render();
    }).catch(err=>{
      console.error(err);
      d.saving = false; d.error = "No se pudo guardar: " + err.message; render();
    });
  }
});

// El scroll de un textarea (al crecer más allá de max-height, o al mover
// el cursor con flechas fuera de lo visible) no dispara "input" — sin
// este listener en capture (scroll no burbujea) el resalte de fondo se
// desalinearía verticalmente del texto real apenas apareciera scroll.
document.addEventListener("scroll", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.mentionScope){
    const bd = document.getElementById(t.id + "-hl");
    if(bd) bd.scrollTop = t.scrollTop;
  }
}, true);

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.mentionScope) syncMentionBackdrop(t);
  if(t.id === "feedSearch" || t.id === "memoriaSearch"){
    state.filters.text = t.value; render();
  } else if(t.id === "auditSearch"){
    state.auditFilters.text = t.value; auditVisibleCount = 30; render();
  } else if(t.id === "cTitle"){ composerDraft.title = t.value; }
  else if(t.id === "cContent"){
    composerDraft.content = t.value;
    const prevQuery = composerDraft.mentionQuery;
    updateMentionState(composerDraft, t);
    if(prevQuery !== composerDraft.mentionQuery) render();
  }
  else if(t.id === "cParticipantQuery"){
    composerDraft.participantQuery = t.value; composerDraft.participantHighlight = 0; render();
  }
  else if(t.dataset.placeScope){
    const draft = getDraftFor(t.dataset.placeScope, t.dataset.placeOwner);
    draft.placeQuery = t.value; draft.placeHighlight = 0; render();
  }
  else if(t.id === "rutinaContent"){
    rutinaDraft.content = t.value;
    // Solo habilita/deshabilita el botón Publicar al tipear — evita un
    // render() completo (y perder el foco/cursor) en cada letra, salvo
    // que se esté escribiendo una @mención (ahí sí hace falta re-renderizar
    // para mostrar/actualizar el desplegable de sugerencias). El alto sí
    // se ajusta siempre, tecla por tecla, para que la caja crezca con el
    // texto en vez de quedar chica con scroll interno.
    autoGrowTextarea(t);
    const btn = document.getElementById("rutinaPublish");
    if(btn) btn.disabled = !t.value.trim();
    const prevQuery = rutinaDraft.mentionQuery;
    updateMentionState(rutinaDraft, t);
    if(prevQuery !== rutinaDraft.mentionQuery) render();
  }
  else if(t.dataset.replyField === "content"){
    const draft = getReplyDraft(t.dataset.postId);
    draft.content = t.value;
    const prevQuery = draft.mentionQuery;
    updateMentionState(draft, t);
    if(prevQuery !== draft.mentionQuery) render();
  }
  else if(t.dataset.nestedReplyField === "content"){
    const draft = getNestedReplyDraft(t.dataset.replyId);
    draft.content = t.value;
    const prevQuery = draft.mentionQuery;
    updateMentionState(draft, t);
    if(prevQuery !== draft.mentionQuery) render();
  }
  else if(t.dataset.scopeField === "city"){ getDraftFor(t.dataset.scope, t.dataset.ownerId).scopeDraft.city = t.value; }
  else if(t.dataset.linkField){
    const draft = getDraftFor(t.dataset.scope, t.dataset.ownerId);
    draft.links[Number(t.dataset.idx)][t.dataset.linkField] = t.value;
  }
  else if(t.dataset.action === "zonas-label"){ getZonasDraft().zones[t.dataset.key].label = t.value; }
  else if(t.id === "zonasNewZoneLabel"){ getZonasDraft().newZoneLabel = t.value; }
  else if(t.dataset.action === "tipos-icon"){
    const type = getTiposDraft().types.find(x=>x.key===t.dataset.key);
    if(type) type.icon = t.value;
  }
  else if(t.dataset.action === "tipos-label"){
    const type = getTiposDraft().types.find(x=>x.key===t.dataset.key);
    if(type) type.label = t.value;
  }
  else if(t.id === "tiposNewIcon"){ getTiposDraft().newIcon = t.value; }
  else if(t.id === "tiposNewLabel"){ getTiposDraft().newLabel = t.value; }
  else if(t.id === "calendarIdInput"){ getCalendarDraft().calendarId = t.value; }
  else if(t.id === "adjMaxImages"){ getAdjuntosDraft().maxImages = t.value; }
  else if(t.id === "adjMaxFiles"){ getAdjuntosDraft().maxFiles = t.value; }
  else if(t.id === "adjMaxFileKB"){ getAdjuntosDraft().maxFileKB = t.value; }
});

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.name === "cType"){ composerDraft.activityType = t.value; render(); }
  else if(t.id === "cStartDate"){
    composerDraft.startDate = t.value;
    if(composerDraft.endDate < t.value) composerDraft.endDate = t.value;
    render();
  }
  else if(t.id === "cEndDate"){ composerDraft.endDate = t.value; render(); }
  else if(t.id === "cAllDay"){
    composerDraft.allDay = t.checked;
    if(t.checked){ composerDraft.startTime = ""; composerDraft.endTime = ""; }
    render();
  }
  else if(t.id === "cStartTime"){ composerDraft.startTime = t.value; render(); }
  else if(t.id === "cEndTime"){ composerDraft.endTime = t.value; render(); }
  else if(t.dataset.scopeField === "type"){ getDraftFor(t.dataset.scope, t.dataset.ownerId).scopeDraft.type = t.value; render(); }
  else if(t.dataset.scopeField === "country"){
    const sd = getDraftFor(t.dataset.scope, t.dataset.ownerId).scopeDraft;
    sd.country = t.value; sd.city = ""; sd.cityUseCustom = false; render();
  }
  else if(t.dataset.scopeField === "region"){ getDraftFor(t.dataset.scope, t.dataset.ownerId).scopeDraft.region = t.value; }
  else if(t.dataset.scopeField === "citySelect"){
    const sd = getDraftFor(t.dataset.scope, t.dataset.ownerId).scopeDraft;
    if(t.value === "__other__"){ sd.cityUseCustom = true; sd.city = ""; }
    else { sd.city = t.value; sd.cityUseCustom = false; }
    render();
  }
  else if(t.id === "cImages"){ handleImageFiles(t.files, composerDraft.images); }
  else if(t.dataset.action === "rutina-images"){ handleImageFiles(t.files, rutinaDraft.images); }
  else if(t.dataset.action === "reply-images"){ handleImageFiles(t.files, getReplyDraft(t.dataset.postId).images); }
  else if(t.dataset.action === "nested-reply-images"){ handleImageFiles(t.files, getNestedReplyDraft(t.dataset.replyId).images); }
  else if(t.id === "cFiles"){ handleFileAttachments(t.files, composerDraft.files); }
  else if(t.dataset.action === "rutina-files"){ handleFileAttachments(t.files, rutinaDraft.files); }
  else if(t.dataset.action === "reply-files"){ handleFileAttachments(t.files, getReplyDraft(t.dataset.postId).files); }
  else if(t.dataset.action === "nested-reply-files"){ handleFileAttachments(t.files, getNestedReplyDraft(t.dataset.replyId).files); }
  else if(t.dataset.action === "toggle-reply-extra-scope"){
    getReplyDraft(t.dataset.postId).extraScope = t.checked; render();
  }
  else if(t.dataset.action === "zonas-color"){ getZonasDraft().zones[t.dataset.key].color = t.value; render(); }
  else if(t.dataset.action === "zonas-country-zone"){ getZonasDraft().countryZones[t.dataset.country] = t.value; render(); }
  else if(t.dataset.action === "tipos-sync"){
    const type = getTiposDraft().types.find(x=>x.key===t.dataset.key);
    if(type) type.calendarSync = t.checked;
  }
});

document.addEventListener("click", e=>{ if(e.target.id === "cCancel") closeComposer(); });

postForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const d = composerDraft;
  d.error = "";
  const title = d.title.trim();
  const content = d.content.trim();
  if(!title){ d.error = "Escribí un título."; render(); return; }
  if(!content){ d.error = "Contá algo en comentarios."; render(); return; }
  if(!d.scopes.length){ d.error = "Agregá al menos un lugar (país, ciudad, región o toda LatAm)."; render(); return; }
  if(!d.startDate){ d.error = "Elegí una fecha de inicio."; render(); return; }
  if(d.endDate < d.startDate){ d.error = "La fecha de fin no puede ser anterior a la de inicio."; render(); return; }
  if(!d.allDay){
    if(!d.startTime || !d.endTime){ d.error = "Elegí hora de inicio y de fin, o marcá \"Todo el día\"."; render(); return; }
    if(d.startDate === d.endDate && d.endTime <= d.startTime){ d.error = "La hora de fin tiene que ser posterior a la de inicio."; render(); return; }
  }
  const links = d.links.filter(l=>safeUrl(l.url));
  const postData = {
    title, content, startDate:d.startDate, endDate:d.endDate, date:d.startDate,
    startTime: d.allDay ? null : d.startTime, endTime: d.allDay ? null : d.endTime,
    participants: d.participants,
    activityType:d.activityType, scopes:d.scopes,
    images:d.images, links, files:d.files, mentions:extractMentionsFromContent(content),
    authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
  };
  try{
    if(d.editingPost){
      const postId = d.editingPost.id;
      const original = d.editingPost;
      closeComposer();
      updatePostAndSync(postId, original, postData).then(res=>{
        showCalendarNotice(res.ok
          ? { ok:true, message:"Se guardaron los cambios (y el Calendar, si correspondía)." }
          : { ok:false, message:"Se guardaron los cambios, pero no se pudo actualizar el Calendar (" + res.reason + ")." });
      }).catch(err=>{
        console.error("Error guardando la edición:", err);
        showCalendarNotice({ ok:false, message:"No se pudo guardar la edición: " + err.message });
      });
    } else {
      const postId = await createPost(postData);
      closeComposer();
      if(CALENDAR_SYNC_TYPES.has(postData.activityType)){
        syncToCalendar(postData).then(res=>{
          if(res.ok && res.eventId) updatePostDoc(postId, { calendarEventId: res.eventId }).catch(()=>{});
          showCalendarNotice(res.ok
            ? { ok:true, message:"Se sumó también al Calendar compartido de LatAm." }
            : { ok:false, message:"El posteo se guardó, pero no se pudo sumar al Calendar (" + res.reason + ")." });
        });
      }
    }
  }catch(err){
    console.error(err);
    d.error = "No se pudo publicar: " + err.message;
    render();
  }
});

async function submitReply(postId){
  const d = getReplyDraft(postId);
  const content = d.content.trim();
  if(!content){ d.scopeError = "Escribí una respuesta antes de publicar."; render(); return; }
  const links = d.links.filter(l=>safeUrl(l.url));
  try{
    await createReply(postId, {
      authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
      content, scopes:d.extraScope ? d.scopes : [],
      images:d.images, links, files:d.files, mentions:extractMentionsFromContent(content),
    });
    openReplyForms.delete(postId);
    resetReplyDraft(postId);
    render();
  }catch(err){
    console.error(err);
    d.scopeError = "No se pudo publicar la respuesta: " + err.message;
    render();
  }
}

// Responder a una respuesta puntual. Un solo nivel de anidamiento: si la
// respuesta a la que le contestás ya era, a su vez, una respuesta anidada,
// la nueva se cuelga del MISMO padre (no se van apilando niveles).
async function submitNestedReply(postId, replyId){
  const d = getNestedReplyDraft(replyId);
  const content = d.content.trim();
  if(!content) return;
  const parent = (state.repliesByPost[postId]||[]).find(r=>r.id===replyId);
  const replyToId = parent?.replyToId || replyId;
  const links = d.links.filter(l=>safeUrl(l.url));
  try{
    await createReply(postId, {
      authorName: state.auth.user.displayName, authorEmail: state.auth.user.email,
      content, scopes:[], images:d.images, links, files:d.files, mentions:extractMentionsFromContent(content), replyToId,
    });
    openNestedReplyForms.delete(replyId);
    delete nestedReplyDrafts[replyId];
    render();
  }catch(err){
    console.error(err);
    alert("No se pudo publicar la respuesta: " + err.message);
  }
}

async function togglePostLike(postId){
  const email = state.auth.user.email;
  const post = getPostById(postId);
  if(!post) return;
  const liked = (post.likedBy||[]).includes(email);
  try{
    await fb.updateDoc(fb.doc(db,"posts",postId), {
      likedBy: liked ? fb.arrayRemove(email) : fb.arrayUnion(email),
    });
  }catch(err){
    console.error("Error al dar me gusta:", err);
  }
}

async function toggleReplyLike(postId, replyId){
  const email = state.auth.user.email;
  const reply = (state.repliesByPost[postId]||[]).find(r=>r.id===replyId);
  if(!reply) return;
  const liked = (reply.likedBy||[]).includes(email);
  try{
    await fb.updateDoc(fb.doc(db,"posts",postId,"replies",replyId), {
      likedBy: liked ? fb.arrayRemove(email) : fb.arrayUnion(email),
    });
  }catch(err){
    console.error("Error al dar me gusta:", err);
  }
}

render();
initFirebase();
